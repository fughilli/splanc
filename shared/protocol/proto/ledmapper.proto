// LED Mapper wire protocol (design doc §7) — protocol-buffer contract.
//
// This is the WIRE format for all host <-> phone communication: binary
// protobuf frames over the /ws WebSocket, wrapped in the ClientMessage /
// ServerMessage envelopes (one oneof arm per §7 message type).
//
// JSON parity: field names and shapes are chosen so the proto3 JSON mapping
// of every message matches the pre-protobuf JSON wire exactly (the server's
// internal models and the web app's TypeScript types predate this file and
// are generated from the JSON Schemas in ../schemas/). That parity is what
// keeps the migration boundary thin — each end converts envelope <-> flat
// JSON object at the socket and nothing else changes. Notes:
//   - vectors are FLAT `repeated double` (JSON: [x, y, z]), matching the
//     schema's fixed-arity arrays; `K` carries an explicit json_name;
//   - enum-like fields (encoding, fec, units, frame, syncPattern) are
//     STRINGS, because the JSON wire uses "gray-hue"-style values that
//     proto enum JSON names cannot reproduce;
//   - nullable-on-the-wire fields are `optional` (unset <-> null);
//   - trajectories are `repeated Vec3` and need a tiny shape conversion at
//     the boundary ([[x,y,z], ...] <-> [{v: [x,y,z]}, ...]) — the one spot
//     proto3 JSON cannot express nested arrays. Segment polylines (Topology)
//     get the same conversion.
//
// PLAYER PROFILES (docs/esp32-led-mapping-plan.md): two player targets
// implement this protocol behind one wire. Which envelope arms each supports:
//
//   CORE (every player — the stable player protocol):
//     client: hello, time_sync_ping, start_mapping, configure, stop_mapping,
//             submit_map, get_pattern, set_counting_pattern, set_led_count,
//             submit_topology, set_playback, get_playback
//     server: welcome, time_sync_pong, mapping_started, mapping_stopped,
//             pattern_state, result_ready, error, counting_state,
//             led_count_state, playback_state
//
//   PI ONLY (host-solve + live-map + telemetry paths — the Pi serves the
//   webapp and can run the solver):
//     client: detections, imu_batch, exposure_report, get_status,
//             get_live_map, get_solve_status
//     server: status, live_map, solve_status
//     The Pi's welcome carries solverBenchMs; an ESP32 never sets it, which
//     already makes the phone's placement decision "solve on phone"
//     (web/src/solver/placement.ts).
//
//   OTA (ESP32 players with the loader layout, docs/design/ota.md):
//     client: ota_begin, ota_chunk, ota_finish, ota_abort, get_ota_status,
//             ota_reboot
//     server: ota_status (and welcome.ota from the update loader)
//     The image always goes to the LOADER: the app answers ota_begin by
//     checking the manifest and restarting into the loader (state REBOOTING);
//     the client reconnects and sends ota_begin again.
//
//   Unknown/unsupported arms on a player MUST produce a bounded reply, never
//   a crash: REQUEST arms (those with a defined reply) get
//   error{code: "unsupported"}; fire-and-forget arms (detections, imu_batch,
//   exposure_report) MAY be silently dropped so a chatty phone cannot flood
//   the error channel.

syntax = "proto3";

package ledmapper.v1;

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// 3-vector; used only where nesting forces a message type (trajectories).
message Vec3 {
  repeated double v = 1 [packed = true];
}

// Camera pose: position [x,y,z] (meters) + quaternion [x,y,z,w],
// camera-to-world (§7.4).
message Pose {
  repeated double p = 1 [packed = true];
  repeated double q = 2 [packed = true];
}

// Code-book parameters describing the temporal blink pattern (§7.6).
message CodeParams {
  int32 led_count = 1;
  // Coded BITS per cycle (data + FEC parity), sent log2(symbols) per frame.
  int32 bits = 2;
  // "hue" (the only carrier: constant-brightness color code).
  string encoding = 3;
  // Hold time per frame (symbol window), ms.
  double bit_period_ms = 4;
  // "on_off".
  string sync_pattern = 5;
  // 2 (sync delimiter) + ceil(bits / log2(symbols)) data frames.
  int32 cycle_frames = 6;
  // "none" | "secded".
  string fec = 7;
  // Data-symbol alphabet size: 2 (red/blue) or 4 (Gray-ordered bit pairs).
  int32 symbols = 8;
  // LED output brightness scale in [0,1]; unset = 1.0. Servoed by the phone
  // against measured bloom/wash-out (exposure.ts planLedBrightness).
  optional double brightness = 9;
  // Diffuse-capture striding (design: diffuse_capture; stride_lit in
  // firmware/pattern ↔ web/src/code/stride.ts). Unset/<=1 stride_spacing = every
  // LED lit every frame (legacy). Otherwise only a sparse, ≥ stride_spacing-
  // separated subset of LEDs lights in the active `stride_phase`; the phone
  // rotates the phase across epochs to cover the fixture.
  optional int32 stride_spacing = 10;
  optional int32 anchor_density = 11;
  optional int32 stride_phase = 12;
  // Group capture (docs/design/multi-fixture-localization.md): this fixture's
  // LED i transmits code-book id (i + code_offset); led_count above is then the
  // SHARED code-book size (every fixture in the group derives the same bits /
  // cycle_frames from it). Unset = 0 (single-fixture capture).
  optional int32 code_offset = 13;
}

// One labeled observation of one LED in one frame (§7.4).
message DetectionRecord {
  int32 led_id = 1;
  double t_capture_ms = 2;
  double u = 3;
  double v = 4;
  int32 img_w = 5;
  int32 img_h = 6;
  // fx, fy, cx, cy.
  repeated double k = 7 [json_name = "K", packed = true];
  // Unset on the WebXR-free capture path (poses solved server-side).
  optional Pose pose = 8;
  double confidence = 9;
}

// One inertial sample, camera frame (§7.1 imu_batch).
message ImuSample {
  double t = 1;
  repeated double gyro = 2 [packed = true];
  repeated double accel = 3 [packed = true];
}

// Camera/exposure telemetry (§7.1 exposure_report).
message ExposureStats {
  double t_capture_ms = 1;
  double frame_interval_ms = 2;
  double mean_luma = 3;
  double p95_luma = 4;
  double clip_frac = 5;
  int32 blob_count = 6;
  double detector_threshold = 7;
  optional double iso = 8;
  optional double exposure_time_ms = 9;
  optional double ambient_intensity = 10;
}

// Per-LED entry of a reconstructed map (§7.5).
message LedEntry {
  int32 id = 1;
  repeated double xyz = 2 [packed = true];
  double confidence = 3;
  int32 n_views = 4;
  double rms_reproj_px = 5;
  double parallax_deg = 6;
}

message OutputMapStats {
  double rms_reproj_px_global = 1;
  double median_parallax_deg = 2;
  // Relative standard error of the metric scale from the inertial re-anchor
  // (visual-inertial solves). Unset = not computed.
  optional double scale_rel_std_err = 3;
  // Human-readable solve-quality warnings (weak/implausible metric scale).
  repeated string warnings = 4;
}

// A reconstructed LED map (§7.5).
message OutputMap {
  string map_id = 1;
  string created_at = 2;
  // "meters".
  string units = 3;
  // "webxr_session_ref" | "gravity_leveled".
  string frame = 4;
  int32 led_count = 5;
  repeated LedEntry leds = 6;
  repeated int32 unmapped = 7 [packed = true];
  // Solved camera path (visual-inertial solves), same frame as leds.
  repeated Vec3 trajectory = 8;
  OutputMapStats stats = 9;
}

// Interim LED position during a running solve (lightweight preview).
message SolveLed {
  int32 id = 1;
  repeated double xyz = 2 [packed = true];
}

// A contiguous run of same-color LEDs in a counting pattern (§7.9).
message ColorBlock {
  int32 start = 1;
  int32 count = 2;
  // [r, g, b] in [0,1].
  repeated double rgb = 3 [packed = true];
}

// Skeletonized fixture topology (§7.7, Phase F output) — drives the O(N)
// pulse illuminate on players. Keyed to the OutputMap it skeletonizes.
message BranchPoint {
  int32 id = 1;
  // Meters, same frame as the OutputMap.
  repeated double xyz = 2 [packed = true];
}

message TopologySegment {
  int32 id = 1;
  // Endpoint branch-point ids; -1 = free end. Arclength runs from a to b.
  int32 a = 2;
  int32 b = 3;
  // Polyline from a to b (JSON: [[x,y,z], ...] — converted like trajectory).
  repeated Vec3 polyline = 4;
  // Total polyline arclength, meters.
  double length = 5;
}

message LedAssociation {
  int32 led_id = 1;
  int32 segment_id = 2;
  // Arclength of the LED's foot point along the segment, meters from a.
  double foot_arclength = 3;
  // Perpendicular distance LED -> foot point, meters.
  double d_perp = 4;
}

message Topology {
  string map_id = 1;
  repeated BranchPoint branch_points = 2;
  repeated TopologySegment segments = 3;
  repeated LedAssociation associations = 4;
}

// A solved fixture bundled for OFFLINE use: the point cloud + its skeleton
// topology, as one self-contained binaryproto file (.binpb). Exported by the
// phone (post-solve) or dumped from a player, and imported into the host
// effects-simulator workspace to preview effects on real captured data. Not an
// envelope arm — a standalone file format.
message MappingBundle {
  OutputMap map = 1;
  Topology topology = 2;
}

// Effect tunables (§7.8), mirroring the pulse reference's controls. All
// fields are optional overlays: unset keeps the player's current/default.
message PlaybackParams {
  // Global output brightness scale in [0,1].
  optional double intensity = 1;
  // Soft-falloff radius around a pulse agent, meters ('soft').
  optional double glow_radius = 2;
  // Concurrent pulse agents traversing the topology.
  optional int32 agent_count = 3;
  // Agent travel speed along the topology, m/s.
  optional double speed = 4;
  // Palette as 0xRRGGBB ints; empty keeps the player default.
  repeated uint32 palette = 5 [packed = true];
  // Pulse lead-in/out ramp distance at termini, meters (0 = derive from glow).
  optional double lead_in = 6;
  // Probability [0,1] a pulse splits at a junction.
  optional double split_prob = 7;
  // Flood fade length behind the wavefront, meters (0 = derive from glow).
  optional double decay = 8;
}

// ---------------------------------------------------------------------------
// Client -> server messages (§7.1)
// ---------------------------------------------------------------------------

message Hello {
  string client = 1;
  string app_version = 2;
}

message TimeSyncPing {
  double t0 = 1;
}

message StartMappingOptions {
  int32 led_count = 1;
  optional int32 symbols = 2;
  optional double bit_period_ms = 3;
  optional double brightness = 4;
  // Diffuse-capture striding (see CodeParams.stride_spacing). Unset/<=1 =
  // legacy all-lit. `anchor_density` (>=3, default 3) sets the shared-LED
  // overlap that fuses the per-phase partials; `stride_phase` (default 0) is
  // the initial phase the phone advances via Configure.
  optional int32 stride_spacing = 5;
  optional int32 anchor_density = 6;
  optional int32 stride_phase = 7;
  // Group capture (docs/design/multi-fixture-localization.md), on players
  // advertising the "group_capture" feature. Several fixtures flash DISJOINT
  // id ranges of one shared code book on one shared clock, so a single phone
  // capture decodes them all at once:
  //   - code_offset: this fixture's LED i transmits id (i + code_offset);
  //   - code_space: the shared code-book size (>= code_offset + led_count),
  //     from which bits / cycle_frames derive (identical across the group);
  //   - epoch_ms: the pattern epoch in THIS player's clock (the millis() domain
  //     time_sync_pong reports), so every fixture's frames line up; a past epoch
  //     just phase-aligns the running pattern.
  // The pattern keeps running after the client disconnects (stop_mapping ends it).
  optional int32 code_offset = 8;
  optional int32 code_space = 9;
  optional double epoch_ms = 10;
}

message StartMapping {
  StartMappingOptions options = 1;
}

message ConfigureOptions {
  optional int32 led_count = 1;
  optional int32 symbols = 2;
  optional double bit_period_ms = 3;
  optional double brightness = 4;
  // Diffuse-capture striding (see StartMappingOptions). The phone re-sends this
  // each epoch to ADVANCE the phase (Configure restamps the pattern epoch).
  optional int32 stride_spacing = 5;
  optional int32 anchor_density = 6;
  optional int32 stride_phase = 7;
}

// Mid-capture renegotiation; reply is PatternState with the new epoch.
message Configure {
  ConfigureOptions options = 1;
}

message StopMapping {
  // Solver placement (client benchmark decision): unset/true -> host
  // reconstructs (reply result_ready); false -> stop + persist only (reply
  // mapping_stopped), the client solves locally and uploads via submit_map.
  optional bool solve_on_host = 1;
}

// Client-solved OutputMap upload (phone-side final solve, wasm).
message SubmitMap {
  OutputMap map = 1;
}

message Detections {
  repeated DetectionRecord batch = 1;
}

message ImuBatch {
  repeated ImuSample samples = 1;
}

message ExposureReport {
  ExposureStats report = 1;
}

message GetStatus {}

message GetPattern {}

message GetLiveMap {}

message GetSolveStatus {}

// LED-counting handshake (§7.9): display a static color-block pattern.
// Blocks paint [start, start+count); uncovered LEDs are off; painting past
// the physical strip end IS the probe (the phone binary-searches the strip
// length by observing which blocks light). Empty blocks = all off.
// Reply: counting_state.
message SetCountingPattern {
  repeated ColorBlock blocks = 1;
  // Player output channel the blocks paint; unset -> 0. Block indices are
  // relative to the START of this channel's strip (block start 0 = the first
  // LED wired to that output), so the probe works the same on every channel.
  // The other channels are blanked while the probe runs. A channel the player
  // doesn't drive is rejected (error bad_message).
  optional int32 channel = 2;
  // Wire color order for THIS probe's pixels (a permutation of "RGB", e.g.
  // "GRB"), applied ONLY to the counting pattern and independent of the
  // channel's committed color order. Lets the color-order test preview a
  // candidate order (or drive raw during identify) WITHOUT mutating the
  // persisted hardware config. Unset -> identity "RGB" (raw wire bytes).
  optional string color_order = 3;
}

// Persist the detected strip length for a channel (defaults future
// codeParams.ledCount, bounds playback buffers). Reply: led_count_state.
message SetLedCount {
  int32 led_count = 1;
  optional int32 channel = 2;
}

// Upload the skeletonized topology for a stored map (Phase F). The player
// persists it next to the map and replies result_ready (mirrors submit_map).
message SubmitTopology {
  Topology topology = 1;
}

// Playback control (§7.8): select the effect and overlay params. "off" is
// universal; other effects are player-capability-dependent (reply: error
// code="unsupported_effect" when not shipped). Reply: playback_state.
message SetPlayback {
  string effect = 1;
  PlaybackParams params = 2;
  // Stored map/topology to play on; unset keeps the current selection.
  optional string map_id = 3;
}

message GetPlayback {}

// Poll rendered-frame timing. The player samples its monotonic clock as it
// pushes each mapping-pattern frame to the LEDs; this drains the accumulated
// samples so the phone can forward them to the trace server and pattern-
// generator stutter becomes visible offline. Reply: frame_timing.
message GetFrameTiming {}

// Pull the player's stored map + topology back off the device as a
// MappingBundle, streamed in chunks (a map is far larger than one control
// frame). Request bytes [offset, offset+max_len) of the encoded bundle; the
// reply carries the total length so the phone knows when it has it all. Lets a
// phone recover a previously-mapped fixture without re-mapping and preview /
// export it. Reply: stored_map_chunk (or error `no_map`).
message GetStoredMap {
  int32 offset = 1;
  int32 max_len = 2;
}

// Sharded upload of a large submit_map / submit_topology, so no single frame
// forces the player's mbedtls to allocate a big contiguous TLS record buffer
// on its fragmented heap (a full ~150-LED map is one ~15 KB record; the C6
// OOMs the handshake/read trying to alloc it — see docs). The client slices
// the encoded frame into `payload` windows and streams them in `seq` order;
// the player reassembles and decodes on `last`. Each non-final chunk is
// ack'd with chunk_ack so the browser flushes one small TLS record per send
// (queued writes would otherwise re-coalesce into a big record). `upload_id`
// groups one sequence — a new id resets the player's accumulator.
// Reply: chunk_ack per chunk; result_ready (or error) on the last.
message UploadChunk {
  enum Kind {
    MAP = 0;       // payload windows reassemble a SubmitMap frame
    TOPOLOGY = 1;  // payload windows reassemble a SubmitTopology frame
    EFFECT = 2;    // payload windows reassemble a SubmitEffect frame (large .fxb
                   // bytecode) — lets effect uploads fit the BLE transport's
                   // small per-frame cap, same as map/topology.
  }
  uint32 upload_id = 1;
  uint32 seq = 2;     // 0-based; strictly increasing within an upload_id
  bool last = 3;      // the final window — reassemble + decode after this one
  Kind kind = 4;
  bytes payload = 5;  // a byte slice of the encoded frame (order = seq)
}

// ---------------------------------------------------------------------------
// Effects (§ effects-runtime): user shader bytecode (.fxb) execution
// ---------------------------------------------------------------------------

// A single uniform's live value. `slot` indexes the effect's uniform manifest;
// `value` carries 1..4 floats (scalar or vecN) interpreted per the manifest.
message UniformValue {
  uint32 slot = 1;
  repeated float value = 2 [packed = true];
}

// Upload a compiled effect: `.fxb` = bytecode + embedded uniform manifest.
// Stored to LittleFS keyed by `effect_id`, like submit_map. Set `activate` to
// make it the active effect on receipt. `deck` selects which of the two
// concurrent FX decks it loads onto (0 = A, the default and the only persisted
// deck; 1 = B) so the app can cue two effects and crossfade between them
// (docs/design/uniform-keypoints.md). Reply: result_ready (id=effect_id) or
// error (`effect_too_large`, `bad_fxb`).
message SubmitEffect {
  string effect_id = 1;
  bytes fxb = 2;
  bool activate = 3;
  // FX deck to load onto: 0 = A (default), 1 = B. See SetCrossfade.
  uint32 deck = 4;
}

// Select the active effect by id. "" or "off" clears it (back to the built-in
// idle/playback). `deck` targets deck A (0, default) or B (1); "" on a deck
// parks that deck without disturbing the other. Reply: playback_state.
message SetEffect {
  string effect_id = 1;
  // FX deck to target: 0 = A (default), 1 = B.
  uint32 deck = 2;
}

// Set live uniform values on the active effect (slider drags). Coalesced and
// persisted like set_playback. Reply: playback_state.
message SetUniforms {
  repeated UniformValue values = 1;
  // Persist these values (auto-resume on boot) — true or unset, today's behaviour —
  // or apply them live only (false): a client streaming a ramp sends uncommitted
  // updates and commits once at the end, so a slider drag doesn't wear the flash.
  // Mirrors SetColorCorrection.commit.
  optional bool commit = 2;
  // FX deck whose uniforms to set: 0 = A (default), 1 = B. Deck B is never
  // persisted (commit is ignored there).
  uint32 deck = 3;
}

// Ask for the device's TLS identity state (docs/design/per-device-cert.md). Works over
// BLE as well as wss, so a client can learn — before it opens wss — whether the device
// has finished generating its first-boot key + certificate, and which certificate
// (SHA-256) to pin for this device id. Firmware advertising the "tls_info" feature
// answers it. Reply: tls_info.
message GetTlsInfo {}

// Override the effect framerate target (FUG-82; firmware advertising the "fps"
// feature). By default the player autoscales the effect FPS on a 5-fps ladder
// (25..80) keeping at least 5% of every frame period free; `target_fps` pins an
// exact rate (snapped to the ladder) and stops autoscaling, 0 returns to
// autoscale. An effect that can't hold the floor (or a pinned rate) keeps
// running as fast as it can — the player never parks or blanks an effect for
// being slow; fps_state reports it `lagging`. The pin is runtime-only and
// survives effect reloads. Reply: fps_state.
message SetFps {
  uint32 target_fps = 1;
  // Deprecated, ignored: it held off the old "park a slow effect" abort, which
  // no longer exists (every effect now runs at whatever rate it achieves).
  bool no_abort = 2 [deprecated = true];
}

// -- Sensor core (docs/design/sensor-core.md) ---------------------------------
// Ask for the on-board motion sensor's live state: what was detected on the I2C
// bus at boot, the latest calibrated sample, the fused orientation and the
// gesture counters. Firmware advertising the "sensors" feature answers it (also
// with no sensor attached: status SENSOR_STATUS_ABSENT). Reply: sensor_state.
message GetSensors {}

// Run a calibration action on the motion sensor. Applied by the sensor task at
// its next poll (~20 ms), persisted to NVS, survives reboots. GYRO_BIAS and
// LEVEL require the fixture to be held still (state.at_rest). Reply:
// sensor_state, whose calibration_result reports the outcome once applied —
// poll get_sensors until calibration_seq advances.
message CalibrateSensors {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // Store the gyro zero-rate bias learned while still (+ the learned accel
    // scale): the next boot starts calibrated instead of re-learning.
    ACTION_GYRO_BIAS = 1;
    // "The fixture is upright now": rotate the sensor mount so the measured
    // gravity is the fixture's -z (zero tilt). Yaw stays arbitrary.
    ACTION_LEVEL = 2;
    // Forget the stored calibration (defaults; re-learn at rest).
    ACTION_RESET = 3;
  }
  Action action = 1;
}

// -- Driver VM (FUG-107, docs/design/sensor-core.md §8) ------------------------
// Probe every 7-bit address on the sensor I2C bus (bringing the bus up if no
// native sensor did). Firmware advertising "drivers" answers. Reply:
// i2c_scan_result.
message ScanI2c {}

message I2cScanResult {
  repeated uint32 addresses = 1 [packed = true];  // ACKing 7-bit addresses
}

// Load (replacing any running one) a sensor DRIVER: a .fxb compiled from a
// program with `void poll()` and `export` declarations. The device runs poll()
// every poll_interval_ms on its I2C bus and publishes each export into the
// uniform pool by name (effects bind uniforms of the same name). With
// feed_imu, exports `imu_raw_accel` / `imu_raw_gyro` (MPU-6050 counts) go into
// the native fusion instead — the VM becomes the IMU's driver backend (the
// native sampler stops until reboot). Reply: driver_state (or error:
// bad_fxb / not_a_driver / driver_too_large / no_bus / no_memory).
message SubmitDriver {
  bytes fxb = 1;
  uint32 poll_interval_ms = 2;  // 0 = 10 ms; minimum 5
  bool feed_imu = 3;
}

// Stop and unload the driver (frees its heap). Reply: driver_state.
message RemoveDriver {}

// Reply: driver_state.
message GetDriverState {}

message DriverExport {
  string name = 1;
  repeated float value = 2 [packed = true];
}

message DriverState {
  bool running = 1;
  uint32 poll_interval_ms = 2;
  repeated DriverExport exports = 3;  // current values
  string last_poll = 4;               // "ok" | "budget" | "timeout" | "bus_error"
  uint32 polls = 5;
  uint32 bus_errors = 6;
  uint32 poll_cycles_mean = 7;        // CPU cycles per poll() incl. bus waits
  uint32 poll_cycles_max = 8;
  uint32 poll_instrs_mean = 9;        // VM opcodes per poll()
  uint32 bus_ops = 10;                // I2C transactions in the last poll
  uint32 heap_bytes = 11;             // the driver slot (bytes + VM + exports)
  uint32 jitter_us_max = 12;          // worst lateness vs the poll schedule
  bool feed_imu = 13;
}

// -- IMU extrinsic calibration + capture profile (sensor-core.md §7) ----------
// Install the IMU -> fixture/map rotation R_fi (+Y up, the frame of the LED
// map) solved by the app's post-mapping "Calibrate IMU" flow. Persisted (NVS);
// the fused orientation + every imu_* uniform is then in the map frame, yaw
// included. Redoing the map clears yaw_resolved (tilt stays valid). Reply:
// sensor_state.
message SetSensorMount {
  repeated float quat = 1 [packed = true];  // R_fi, w,x,y,z
  float residual_deg = 2;                   // solve RMS residual
  uint32 poses = 3;                         // still poses it was solved from
  bool yaw_resolved = 4;                    // >= 2 non-parallel poses
  uint64 calibrated_at_ms = 5;              // unix ms (app clock)
}

// The capture parameters that produced the stored map, so re-localisation and
// later re-/supplemental captures reuse them instead of re-asking/re-probing.
// Stored on the device next to the map; dropped when a new map is uploaded.
message CaptureProfile {
  string map_id = 1;            // the map these belong to
  bool diffuse = 2;
  uint32 stride_spacing = 3;    // LED stride (1 = every LED lit each epoch)
  uint32 anchor_density = 4;
  uint32 symbols = 5;           // code symbols (2/4)
  uint32 bit_period_ms = 6;
  float brightness = 7;         // LED brightness the servo settled on, 0..1
  float detect_threshold = 8;
  uint32 downscale = 9;
  float lc_gain = 10;
  uint64 captured_at_ms = 11;
  float exposure = 12;          // camera exposure 0..1 that worked (0 = servo chose)
}

// Store the profile (after a successful capture). Reply: capture_profile.
message SetCaptureProfile {
  CaptureProfile profile = 1;
}

// Reply: capture_profile (empty map_id = none stored, e.g. a fixture mapped
// before this existed).
message GetCaptureProfile {}

enum SensorStatus {
  SENSOR_STATUS_UNSPECIFIED = 0;  // sensor core not started
  SENSOR_STATUS_ABSENT = 1;       // nothing answered at 0x68/0x69
  SENSOR_STATUS_UNKNOWN_DEVICE = 2; // something answered; WHO_AM_I unrecognized
  SENSOR_STATUS_STARTING = 3;     // reset/config in progress
  SENSOR_STATUS_RUNNING = 4;
  SENSOR_STATUS_FAULT = 5;        // bus errors (unplugged?); re-probing every 1 s
  SENSOR_STATUS_DISABLED = 6;     // disabled by config or pin conflict
}

// The motion sensor's state. Frames: "fixture" = the sensor axes after the
// stored mount rotation (identity until calibrated with ACTION_LEVEL); "world"
// = z up, yaw arbitrary (no magnetometer yet: heading drifts slowly).
message SensorState {
  SensorStatus status = 1;
  string part = 2;                 // e.g. "MPU-6050"
  uint32 i2c_address = 3;          // 0x68 (AD0 low) / 0x69 (AD0 high)
  uint32 who_am_i = 4;
  int32 sda_gpio = 5;
  int32 scl_gpio = 6;
  repeated float accel = 7 [packed = true];        // m/s^2, fixture frame, incl. gravity (3)
  repeated float gyro = 8 [packed = true];         // rad/s, fixture frame, bias-corrected (3)
  repeated float quat = 9 [packed = true];         // w,x,y,z fixture->world (4)
  repeated float gravity = 10 [packed = true];     // unit DOWN vector, fixture frame (3)
  repeated float linear_accel = 11 [packed = true]; // m/s^2, world frame, gravity removed (3)
  repeated float gyro_bias = 12 [packed = true];   // rad/s, fixture frame (3)
  float temperature_c = 13;
  float shake = 14;                // 0..1
  uint32 tap_count = 15;           // increments per tap (compare, don't edge-detect)
  uint32 shake_count = 16;         // increments per shake episode
  bool at_rest = 17;
  float sample_rate_hz = 18;       // measured fused-sample rate
  uint32 samples = 19;
  uint32 fifo_overflows = 20;
  uint32 bus_errors = 21;
  bool fifo = 22;                  // batching via the on-chip FIFO (else direct reads)
  bool calibrated = 23;            // a stored calibration record is in use
  bool accel_scale_corrected = 24; // first-second |a| was >5% off 1 g; re-scaled
  uint32 fusion_cycles = 25;       // CPU cycles per fused sample (device-measured mean)
  uint32 calibration_seq = 26;     // advances when a CalibrateSensors is applied
  string calibration_result = 27;  // "ok" | "not_running" | "not_at_rest" | ""
  int32 int_gpio = 28;             // MPU INT pin (-1 = none); recorded, polled today
  // Extrinsic calibration (sensor-core.md §7): the settled up in the RAW IMU
  // body frame while at_rest (one side of a calibration pose) ...
  repeated float rest_up_imu = 29 [packed = true];
  float rest_up_sigma_deg = 30;
  uint32 rest_samples = 31;
  // ... and the installed mount: R_fi (IMU -> map frame, w,x,y,z).
  repeated float mount_quat = 32 [packed = true];
  bool mount_extrinsic = 33;      // a full extrinsic (not just "level")
  bool mount_yaw_resolved = 34;
  uint32 mount_poses = 35;
  float mount_residual_deg = 36;
  uint64 mount_calibrated_at_ms = 37;
}

// List the effects the device holds: one per FX deck (deck A's is the last
// submit_effect, persisted and auto-resumed on boot; deck B's is runtime-only),
// so the reply has at most two entries. Reply: effect_list.
message ListEffects {}

message StoredEffect {
  string effect_id = 1;
  // Bytecode (.fxb) size in bytes.
  uint32 fxb_bytes = 2;
  // Whether it is the active (rendering) effect.
  bool active = 3;
  // The FX deck it is loaded on (0 = A, 1 = B).
  uint32 deck = 4;
}

message EffectList {
  repeated StoredEffect effects = 1;
}

// Where this fixture sits in a shared ROOM frame (multi-fixture agents): the
// room-frame position of a LED is translation + rotation * (scale * led.pos).
// Effects read it as `led.room` (== led.pos while unposed).
message FixturePose {
  // Room / group name the fixture belongs to ("" = none).
  string room = 1;
  // Translation, metres (x, y, z).
  repeated float translation = 2;
  // Unit quaternion (x, y, z, w); empty = identity.
  repeated float rotation = 3;
  // Uniform scale; 0 = 1.
  float scale = 4;
  // Optional room bounding box (the union over every fixture, which only the host
  // knows). Empty = this fixture's own room-frame bounding box. Effects read it as
  // `room.min` / `room.max`.
  repeated float room_min = 5;
  repeated float room_max = 6;
}

// Set (or clear) this fixture's room pose. Persisted unless commit=false (like
// set_color_correction); echoed in welcome.pose. Reply: welcome.
message SetFixturePose {
  FixturePose pose = 1;
  // Remove the pose (back to unposed: led.room == led.pos).
  bool clear = 2;
  // Unset = persist; false = apply live only.
  optional bool commit = 3;
}

// Align effect time to a shared epoch so several fixtures animate in step: the
// effect's `time` becomes (now - epoch_ms) / 1000, in the DEVICE's clock (the
// millis() domain time_sync_pong reports). Runtime only (a reboot returns to
// time-since-effect-start). Reply: welcome.
message SetTimeBase {
  int64 epoch_ms = 1;
  // Drop the time base (back to time since effect start).
  bool clear = 2;
}

// Request an effect's uniform manifest + current live values for UI hydration.
// Unset `effect_id` = the active effect. Reply: effect_uniforms (or error
// `no_effect`).
message GetEffectUniforms {
  optional string effect_id = 1;
  // FX deck to describe: 0 = A (default), 1 = B.
  uint32 deck = 2;
}

// Global FX crossfade. The device runs two effect decks (A and B) concurrently
// and blends their per-LED output. `position` is 0.0 (all deck A) .. 1.0 (all
// deck B); `mode` selects the colour space of the blend: 0 = linear RGB, 1 =
// linear HSV (shortest-hue path). Runtime-only, echoed in `welcome` for UI
// hydration. Reply: welcome.
message SetCrossfade {
  double position = 1;
  // 0 = linear RGB, 1 = linear HSV.
  uint32 mode = 2;
}

// -- Uniform keypoints (docs/design/uniform-keypoints.md) --------------------
// A keypoint is a NAMED set of uniform values for one effect, stored on the
// device (littlefs) under the effect's id, so the app and agents share it.
// Values are kept by uniform NAME, so a recompiled effect still recalls them.
// Bounds: 16 keypoints per effect, names <= 32 bytes, <= 32 uniforms / 64 floats
// per keypoint.

// One stored value: a uniform by name + its 1..4 floats.
message KeypointValue {
  string uniform = 1;
  repeated float value = 2 [packed = true];
}

// Save (or overwrite, by name) a keypoint for the effect loaded on `deck`.
// Empty `values` = the deck's current live uniforms; otherwise the slot-addressed
// values (as in set_uniforms) are resolved to names via the deck's manifest.
// Reply: keypoint_list (or error `no_effect`, `keypoint_full`,
// `too_many_uniforms`, `bad_keypoint`).
message SaveKeypoint {
  uint32 deck = 1;
  string name = 2;
  repeated UniformValue values = 3;
}

// Delete a keypoint by name. `effect_id` unset = the effect on `deck`.
// Reply: keypoint_list.
message DeleteKeypoint {
  uint32 deck = 1;
  string name = 2;
  optional string effect_id = 3;
}

// List an effect's keypoints. `effect_id` unset = the effect on `deck`.
// Reply: keypoint_list.
message ListKeypoints {
  uint32 deck = 1;
  optional string effect_id = 2;
}

// Read one keypoint's values. Reply: keypoint (or error `no_keypoint`).
message GetKeypoint {
  uint32 deck = 1;
  string name = 2;
  optional string effect_id = 3;
}

message KeypointWeight {
  string name = 1;
  float weight = 2;
}

// Move a deck's uniforms to a weighted blend of its effect's keypoints, in
// parameter space, on the device. One weight = recall. Weights are normalised;
// at most 4 keypoints. `seconds` > 0 morphs there from the current values
// (smoothstep, per frame); 0 applies at once (fader / MIDI path; cached, no flash
// read while the set of names is unchanged). Per-uniform rules follow the
// manifest: sliders lerp (snapped to step, clamped), colours blend per
// `color_mode` (0 linear RGB, 1 HSV shortest hue), toggles/dropdowns take the
// heaviest keypoint's value. Live-only unless `commit` (deck A: persist the
// blend's target like set_uniforms). A set_uniforms on the deck cancels a morph.
// Reply: playback_state (or error `no_effect`, `no_keypoint`).
message BlendKeypoints {
  uint32 deck = 1;
  repeated KeypointWeight weights = 2;
  float seconds = 3;
  uint32 color_mode = 4;
  optional bool commit = 5;
}

// ---------------------------------------------------------------------------
// Perf monitoring (§ perf-monitoring): device execution-time/memory telemetry
// ---------------------------------------------------------------------------

// Toggle perf telemetry. OFF: no stream. BASIC: cheap cycle/heap spans (Tier 0).
// FULL: also per-opcode instruction counts + stack high-water (Tier 1), only
// while a perf panel is open. `interval_ms` throttles the push cadence.
message SetPerf {
  enum Mode {
    OFF = 0;
    BASIC = 1;
    FULL = 2;
  }
  Mode mode = 1;
  uint32 interval_ms = 2;
}

// Request the rolled-up perf report for the active effect. Reply: perf_report.
message GetPerfReport {}

// Toggle the on-device RV32IM JIT (FUG-125). Debug/bench control, not a normal
// app path: the HITL fx_bench flips this to measure the interpreter golden (off)
// vs the JIT golden (on) against the SAME flashed firmware. Takes effect on the
// NEXT effect load, so callers re-submit the effect after toggling.
// Fire-and-forget (no reply).
message SetJit {
  bool enabled = 1;
}

// One rendered frame's timing/memory sample (all integers; cycles at cpu_hz).
message PerfFrame {
  uint32 seq = 1;
  uint32 update_cycles = 2;
  uint32 shade_cycles = 3;
  uint32 frame_cycles = 4;
  uint32 show_cycles = 5;
  uint32 led_count = 6;
  uint32 instr_update = 7;   // Tier 1 only (0 otherwise)
  uint32 instr_shade = 8;    // Tier 1 only
  uint32 stack_max = 9;      // Tier 1 only
}

// Rolled-up perf over a recent window + the raw tail. Sent unsolicited while a
// perf mode is active (throttled) and as the reply to get_perf_report.
message PerfReport {
  string effect_id = 1;
  uint32 fxb_hash = 2;
  uint32 cpu_hz = 3;
  uint32 budget_cycles = 4;
  // The framerate autoscaler's live target FPS (FUG-82; 0 = firmware without
  // it, whose budget is a fixed 1/30 s). budget_cycles tracks it (cpu_hz /
  // current_fps), so the headroom is against the rate the effect actually runs at.
  uint32 current_fps = 5;
  uint32 frame_cycles_min = 10;
  uint32 frame_cycles_mean = 11;
  uint32 frame_cycles_max = 12;
  uint32 update_cycles_mean = 13;
  uint32 shade_cycles_mean = 14;
  uint32 show_cycles_mean = 15;
  uint32 overruns = 20;
  uint32 dropped_frames = 21;
  uint32 samples_dropped = 22;
  uint32 heap_free = 30;
  uint32 heap_min_free = 31;
  // Largest allocatable contiguous block (heap_caps_get_largest_free_block):
  // free heap can be ample yet fragmented, so this is what actually bounds a
  // single big allocation (TLS buffers, the map record, a render buffer).
  uint32 heap_largest_free = 32;
  repeated PerfFrame ticks = 40;
}

message ClientMessage {
  // Arm names equal the pre-protobuf "type" discriminator values.
  oneof msg {
    Hello hello = 1;
    TimeSyncPing time_sync_ping = 2;
    StartMapping start_mapping = 3;
    Configure configure = 4;
    StopMapping stop_mapping = 5;
    Detections detections = 6;
    ImuBatch imu_batch = 7;
    ExposureReport exposure_report = 8;
    GetStatus get_status = 9;
    GetPattern get_pattern = 10;
    GetLiveMap get_live_map = 11;
    GetSolveStatus get_solve_status = 12;
    SubmitMap submit_map = 13;
    SetCountingPattern set_counting_pattern = 14;
    SetLedCount set_led_count = 15;
    SubmitTopology submit_topology = 16;
    SetPlayback set_playback = 17;
    GetPlayback get_playback = 18;
    GetFrameTiming get_frame_timing = 19;
    GetStoredMap get_stored_map = 20;
    SubmitEffect submit_effect = 21;
    SetEffect set_effect = 22;
    SetUniforms set_uniforms = 23;
    GetEffectUniforms get_effect_uniforms = 24;
    SetPerf set_perf = 25;
    GetPerfReport get_perf_report = 26;
    SetDeviceName set_device_name = 27;
    SetTexture set_texture = 28;
    UploadChunk upload_chunk = 29;
    SetColorCorrection set_color_correction = 30;
    SetBrightness set_brightness = 31;
    SetJit set_jit = 32;
    SetHardwareConfig set_hardware_config = 33;
    GetHardwareConfig get_hardware_config = 34;
    GetColorCorrection get_color_correction = 35;
    ListEffects list_effects = 36;
    SetFixturePose set_fixture_pose = 37;
    SetTimeBase set_time_base = 38;
    SetCrossfade set_crossfade = 39;
    SaveKeypoint save_keypoint = 40;
    DeleteKeypoint delete_keypoint = 41;
    ListKeypoints list_keypoints = 42;
    GetKeypoint get_keypoint = 43;
    BlendKeypoints blend_keypoints = 44;
    GetTlsInfo get_tls_info = 45;
    SetFps set_fps = 46;
    // 47: unused (left free while FUG-82 was in flight; it took 46).
    GetSensors get_sensors = 48;
    CalibrateSensors calibrate_sensors = 49;
    ScanI2c scan_i2c = 50;
    SubmitDriver submit_driver = 51;
    RemoveDriver remove_driver = 52;
    GetDriverState get_driver_state = 53;
    SetSensorMount set_sensor_mount = 54;
    SetCaptureProfile set_capture_profile = 55;
    GetCaptureProfile get_capture_profile = 56;
    // 57-69: left free for in-flight branches (#325's firmware ramps take 60-62).
    // Firmware update over the air (docs/design/ota.md).
    OtaBegin ota_begin = 70;
    OtaChunk ota_chunk = 71;
    OtaFinish ota_finish = 72;
    OtaAbort ota_abort = 73;
    GetOtaStatus get_ota_status = 74;
    OtaReboot ota_reboot = 75;
  }
}

// --- Firmware update over the air (docs/design/ota.md) ----------------------
//
// Flow: get_ota_status (mode APP) -> ota_begin -> ota_status{REBOOTING}; the
// device restarts into its loader. Reconnect (welcome.ota.mode == MODE_LOADER),
// ota_begin again -> ota_status{RECEIVING, offset} -> ota_chunk{offset, data}
// ... (stop-and-wait: each answered by ota_status with the next offset) ->
// ota_finish -> ota_status{INSTALLED}; the device restarts into the new app,
// which must prove healthy or the bootloader rolls it back to the loader
// (ota_status.last_result says which). A dropped link or power cut resumes:
// ota_begin with the same manifest answers the offset to continue from.

// Start (or resume) an update.
message OtaBegin {
  // The signed manifest, 108 bytes (the swarm loader's format): version u32le,
  // size u32le, sha256[32] of the image, flags u32le, then ECDSA P-256 r||s over
  // SHA-256 of those 44 bytes. A release's `.ota` asset is this manifest followed
  // by the image.
  bytes manifest = 1;
  // Install even when manifest.version is older than the installed app. (Never
  // below the device's security floor: see OtaStatus.security_floor.)
  bool allow_downgrade = 2;
  // Optional: the newest signed key-epoch record (80 bytes, docs/design/ota.md "Key
  // rotation"), applied before the manifest is checked — how a revocation reaches
  // the fleet. Ignored when not newer than the device's.
  bytes key_epoch = 3;
}

// One piece of the image, in order.
message OtaChunk {
  // Byte offset into the image: the last ota_status.offset.
  uint32 offset = 1;
  // At most ota_status.max_chunk (4096) bytes.
  bytes data = 2;
}

// Every byte sent: verify the image against the signed digest and boot it.
message OtaFinish {}

// End the session (the loader keeps what arrived; a later ota_begin with the same
// manifest resumes).
message OtaAbort {}

message GetOtaStatus {}

// Restart into the app or the loader (recovery, without an update).
message OtaReboot {
  enum Target {
    TARGET_APP = 0;
    TARGET_LOADER = 1;
  }
  Target target = 1;
}

message OtaStatus {
  enum Mode {
    MODE_UNKNOWN = 0;
    // The player app: answers status/begin/reboot; images go to the loader.
    MODE_APP = 1;
    // The update loader (recovery).
    MODE_LOADER = 2;
  }
  enum State {
    STATE_IDLE = 0;
    // The app accepted ota_begin and is restarting into the loader: reconnect.
    STATE_REBOOTING = 1;
    STATE_RECEIVING = 2;
    STATE_VERIFYING = 3;
    // Verified and selected: the device restarts into the new app.
    STATE_INSTALLED = 4;
    // The request was refused; `error` says why.
    STATE_FAILED = 5;
  }
  Mode mode = 1;
  State state = 2;
  // The session's manifest version / image size / next byte wanted (also a
  // transfer left behind by a power cut, while no session is open).
  uint32 version = 3;
  uint32 size = 4;
  uint32 offset = 5;
  // Machine code when a request is refused: bad_manifest, bad_signature, too_large,
  // downgrade, wrong_chip, bad_image, out_of_order (resume at `offset`), bad_chunk,
  // overflow, incomplete, verify_failed, flash_error, no_session, no_app,
  // not_in_loader, legacy_layout (the device needs the one-time USB migration),
  // unknown_key, revoked_key, security_floor, bad_epoch, bad_revocation.
  string error = 6;
  // Manifest version of the installed app (0 = unknown, e.g. flashed over USB).
  uint32 app_version = 7;
  // The app's build version string (e.g. "1.9.0"), from the app.
  string app_fw_version = 8;
  // Why the loader is up: update, requested, incomplete, no_app, rolled_back,
  // crash_loop. Empty in the app.
  string loader_reason = 9;
  // Outcome of the last install: "installed" (booting it), "ok" (it proved
  // healthy), "rolled_back", "verify_failed".
  string last_result = 10;
  // The loader's own version number (manifest-style), 0 = unknown.
  uint32 loader_version = 11;
  // Largest ota_chunk.data the device takes.
  uint32 max_chunk = 12;
  // Bytes in the app slot (the largest image that fits).
  uint32 slot_size = 13;
  // The loader's key state: accepted key epoch, revoked key ids (bit n = id n),
  // and the security-version floor (the lowest installable manifest security version).
  uint32 key_epoch = 14;
  uint32 revoked_keys = 15;
  uint32 security_floor = 16;
}

// ---------------------------------------------------------------------------
// Server -> client messages (§7.2)
// ---------------------------------------------------------------------------

message Welcome {
  string session_id = 1;
  CodeParams code_params = 2;
  // Host score on the canned solver benchmark (ms); unset while measuring.
  optional double solver_bench_ms = 3;
  // Stable hardware MAC (factory-programmed; same address the BLE advertisement
  // uses), colon-separated uppercase hex. Lets the app match a player across the
  // BLE-onboarding and LAN paths. Empty on older firmware.
  string mac = 4;
  // Current display / Bluetooth-advertised name (default "Led Widget <6-hex>"
  // from the MAC, or a user-customized name). Empty on older firmware.
  string device_name = 5;
  // Current global output brightness (0.0 .. 1.0), so the app can hydrate its
  // master-dimmer control on connect. Runtime-only on the device (defaults to
  // 1.0 after a reboot); unset on older firmware.
  optional double brightness = 6;
  // Git commit the firmware was built from (full 40-char hash), stamped in at
  // build time (FUG-126). Lets the app show + link the device's exact build.
  // Empty on older firmware or an unstamped build.
  string fw_git_commit = 7;
  // True when the firmware was built from a dirty working tree (uncommitted
  // changes). Always false on older firmware.
  bool fw_git_dirty = 8;
  // Release version the firmware was built at, from the nearest firmware-v* tag
  // (e.g. "1.2.0", or "1.2.0-<n>-g<sha>" ahead of it, or "0.0.0-dev"). Stamped in
  // at build time alongside the commit. Empty on older firmware / an unstamped build.
  string fw_version = 9;
  // Protocol features this firmware serves, so a client (the agent bridge) needn't
  // infer them from fw_version: "effects", "perf", "textures", "stored_map",
  // "uniform_commit" (SetUniforms.commit), "list_effects" (ListEffects), "decks"
  // (the `deck` fields), "crossfade" (SetCrossfade), "keypoints" (the *_keypoint
  // arms). The same list is in the /.well-known/splanc.json manifest. Empty on
  // older firmware.
  repeated string features = 10;
  // The .fxb bytecode format version the device's VM accepts (the version byte of
  // the .fxb header). 0 on older firmware (which accepts 1).
  uint32 fxb_format = 11;
  // This fixture's room pose (set_fixture_pose); absent = unposed.
  FixturePose pose = 12;
  // The active shared time base (set_time_base), device-clock ms; absent = none.
  optional int64 time_base_ms = 13;
  // Current global FX crossfade position (0.0 .. 1.0) and mode (0 = linear RGB,
  // 1 = linear HSV), so a client can hydrate its crossfader on connect.
  // Runtime-only (0.0 / RGB after a reboot); unset on older firmware.
  optional double crossfade = 14;
  optional uint32 crossfade_mode = 15;
  // Set by the OTA LOADER only (docs/design/ota.md): the device is in its update
  // loader (ota.mode == MODE_LOADER), not the player — offer recovery/update, not the
  // player UI. Absent on the player (ask it with get_ota_status).
  OtaStatus ota = 16;
}

// One LED output channel's hardware config, carried in hardware_config_state.
message HardwareChannel {
  int32 channel = 1;
  int32 gpio = 2;
  string led_type = 3;
  // Wire color order, a permutation of "RGB" (see SetHardwareConfig.color_order).
  string color_order = 4;
  // LEDs wired to this channel (see SetHardwareConfig.led_count); 0 = not set.
  int32 led_count = 5;
}

// Request the per-channel hardware config (GPIO / LED type / wire color order),
// so the Hardware Setup page can hydrate on open. Reply: hardware_config_state.
message GetHardwareConfig {}

// Request the device's CURRENT color correction (the resolved per-channel gamma
// + relative luminance built into its LUTs), so the Color Correction page can
// hydrate on open and a HITL journey can assert the device reports the gamma it
// was set to (not just that set_color_correction ack'd). The device always has
// a concrete profile (the WS2812B default after a reboot), so the reply carries
// resolved values, never a profile name. Reply: color_correction_state.
message GetColorCorrection {}

// Stream a frame into a loaded effect's 2D `texture` (video textures). `data` is
// the frame quantized to `format` (row-major, `width`*`height` texels),
// optionally XOR-delta'd against the previous frame (flags bit0 = DELTA — the
// device keeps the last quantized frame; a keyframe with DELTA unset resets that
// buffer first), then run-length coded (flags bit1 = RLE, a zero-run scheme:
// repeated [varint zero_run][varint literal_run][literal bytes...]). `tex_index`
// selects which declared texture (buffer id, kind=1) in the active effect; the
// texture's w/h/elem must match. No reply (fire-and-forget for high frame rates).
message SetTexture {
  uint32 tex_index = 1;
  uint32 format = 2; // 0 RGB888, 1 RGB565, 2 RGB332, 3 GRAY8, 4 INDEXED8
  uint32 width = 3;
  uint32 height = 4;
  uint32 flags = 5; // bit0 DELTA (XOR vs previous frame), bit1 RLE
  bytes data = 6;
  repeated uint32 palette = 7 [packed = true]; // INDEXED8 only: 0x00RRGGBB entries
}

// Set the player's display name; it becomes the Bluetooth-advertised name too
// and is persisted on the device. Reply: welcome (echoing the new device_name).
message SetDeviceName {
  string name = 1;
}

// Configure per-channel color correction. LEDs render washed out without gamma
// compensation; the player builds per-channel LUTs (gamma curve + white balance
// to the dimmest channel), persists them to flash, and applies them on the
// strip write path. Either name a built-in profile, or give explicit per-channel
// gamma + relative luminance. Reply: welcome.
message SetColorCorrection {
  // Built-in profile name (e.g. "ws2812b"). When set, the explicit fields below
  // are ignored. Empty/unset -> use the explicit gamma/luminance fields.
  optional string profile = 1;
  // Per-channel gamma exponent (WS2812B datasheet-typical is 2.8).
  optional float gamma_r = 2;
  optional float gamma_g = 3;
  optional float gamma_b = 4;
  // Per-channel relative luminance for white balance (datasheet mcd; only the
  // ratios matter). The brightest channels are scaled down so full-white renders
  // neutral.
  optional float lum_r = 5;
  optional float lum_g = 6;
  optional float lum_b = 7;
  // Whether to persist the generated LUT to flash. Unset/true commits (writes
  // littlefs); false applies from RAM only — used for live preview while the UI
  // drags curves, so a rapid stream of updates doesn't hammer the flash. The UI
  // sends one commit=true when it's done (e.g. the panel closes).
  optional bool commit = 8;
}

// Reply to get_color_correction: the per-channel color correction the device is
// CURRENTLY applying — the resolved gamma exponents + relative luminance it
// built its LUTs from (a set_color_correction resolves a profile name or the
// explicit fields down to these concrete values). The Color Correction page
// hydrates its curves from this on open, and a HITL gamma journey asserts the
// device reports the gamma it was set to. Non-optional: the device always has a
// concrete profile (the WS2812B default after a reboot), so every field is set.
message ColorCorrectionState {
  // Per-channel gamma exponent currently applied (WS2812B default 2.8).
  float gamma_r = 1;
  float gamma_g = 2;
  float gamma_b = 3;
  // Per-channel relative luminance used for white balance (datasheet mcd; only
  // the ratios matter — the brightest channels are scaled down for neutral white).
  float lum_r = 4;
  float lum_g = 5;
  float lum_b = 6;
}

// Global output brightness — a single scalar applied to every LED's rendered
// colour just before the strip write (0.0 = fully dark, 1.0 = the effect's own
// output, the default). Runtime-only (NOT persisted): a reboot returns to full
// brightness, so a device can never get stuck dark. Two uses: a user "master
// dimmer" in the device settings, and the phone's performance-measurement
// driver, which sets it to 0 while it runs the calibration effects (so a fixture
// on a low-ampacity supply — e.g. USB from the phone — doesn't brown out and
// drop its wireless link on the changing pattern) and restores the user setpoint
// when done. Does NOT affect the camera-calibration patterns (gray-code /
// counting probe), which must reach the camera unscaled.
message SetBrightness {
  // Output scale in 0.0 .. 1.0 (clamped by the player). 1.0 is unattenuated.
  double brightness = 1;
}

// Configure an LED output channel's HARDWARE wiring: which GPIO drives its data
// line, the LED chip family, and the wire color order. Persisted to flash (NVS)
// and applied to the RMT driver. Every field is optional so the UI can nudge one
// setting at a time; an unset field leaves that setting unchanged. Reply:
// hardware_config_state (the resulting per-channel config).
message SetHardwareConfig {
  // Output channel index; unset -> 0. The ESP32-C6 drives up to two parallel RMT
  // channels; the Pi has one.
  optional int32 channel = 1;
  // GPIO number driving this channel's data line (any output-capable pin — the
  // RMT peripheral routes through the GPIO matrix). Unset -> leave unchanged.
  optional int32 gpio = 2;
  // LED chip family. "ws281x" (WS2811/WS2812/WS2812B/SK6812 clockless) is the
  // only type supported today. Unset -> leave unchanged.
  optional string led_type = 3;
  // Wire color order: a permutation of "RGB" naming which logical channel each
  // of the three wire bytes carries (e.g. "GRB" for WS2812B — byte0=green). The
  // driver maps logical R,G,B to this order on every strip write. Unset -> leave
  // unchanged.
  optional string color_order = 4;
  // Persist to flash (unset/true) or apply from RAM only (false). The color-order
  // confirmation test streams commit=false previews (forcing identity "RGB" so
  // the raw wire bytes reach the strip) and commits once the user picks the match.
  optional bool commit = 5;
  // How many LEDs are wired to this channel; 0 clears it. The channels' LEDs
  // form ONE global index space in channel order (channel 0's LEDs are
  // [0, n0), channel 1's are [n0, n0 + n1), ...), which mapping and effects
  // address; the player splits a frame across the outputs at these
  // boundaries. The sum across channels must not exceed
  // BoardCapabilities.max_leds. Unset -> leave unchanged.
  optional int32 led_count = 6;
}

// Reply to set_hardware_config / get_hardware_config: the per-channel hardware
// config the device is running (defaults filled in), for the UI to hydrate.
message HardwareConfigState {
  repeated HardwareChannel channels = 1;
  // Static, board-specific capabilities (pin catalog + LED modes). Unset on
  // older firmware — the app falls back to a built-in default catalog.
  BoardCapabilities board = 2;
  // The change just applied needs more LED buffer than this boot allocated: the
  // config is persisted and the player restarts in a moment to resize (expect the
  // connection to drop). Only ever set on the reply to a change.
  bool reboot_required = 3;
  // LEDs (summed across channels) this boot's per-LED buffers hold: the
  // persisted configured counts (512 when none is set), sized once at boot.
  // 0 = not reported (older firmware: the whole board.max_leds).
  uint32 led_capacity = 4;
}

// How safe a GPIO is to repurpose for LED data on a given board. Drives how the
// app groups the pin picker and whether picking it needs a confirmation.
enum PinSafety {
  PIN_SAFETY_UNSPECIFIED = 0;
  // Clean general-purpose pin: no boot / flash / USB / JTAG duty. Default choice.
  PIN_SAFETY_RECOMMENDED = 1;
  // Overloaded but usable (strapping / USB-JTAG / JTAG-debug): pick with care.
  PIN_SAFETY_CAUTION = 2;
  // Actively dangerous (e.g. wired to internal flash): driving it can hang the board.
  PIN_SAFETY_AVOID = 3;
}

// One selectable GPIO for LED data output.
message GpioPin {
  // GPIO number.
  uint32 gpio = 1;
  // Safety category — grouping in the picker + whether a confirm is shown.
  PinSafety safety = 2;
  // Optional board-specific reason shown in the confirm dialog (e.g. "JTAG debug
  // pin; flash clock on internal-flash models"). Empty -> the app uses default
  // wording for the safety level.
  string note = 3;
}

// One LED driver mode (chip family) this firmware build supports.
message LedMode {
  // Stable id echoed back in set_hardware_config.led_type (e.g. "ws281x").
  string id = 1;
  // Human-readable label for the dropdown (e.g. "WS281x (WS2811/2812/SK6812)").
  string label = 2;
}

// Static per-board hardware capabilities the firmware reports so the app can
// build its pin picker and LED-type list from what THIS board actually supports
// (different ESP32-C6 boards expose different pins / driver modes). Authored per
// board as a checked-in textproto, compiled to a binaryproto at build time and
// embedded in the firmware image (see firmware/player_app board_caps).
message BoardCapabilities {
  // Human-readable board identifier (e.g. "ESP32-C6 SuperMini"), for display/debug.
  string board = 1;
  // Selectable GPIOs for LED data output, each tagged with how safe it is.
  repeated GpioPin gpio_pins = 2;
  // LED driver modes (chip families) this firmware build supports.
  repeated LedMode led_modes = 3;
  // Parallel LED output channels this firmware drives (0 = not reported; treat
  // as 1). Filled in by the player at runtime when the descriptor leaves it 0.
  uint32 led_channels = 4;
  // Most LEDs the player can drive, summed across all channels (0 = not
  // reported). Filled in by the player at runtime when the descriptor leaves it 0.
  uint32 max_leds = 5;
  // Most LEDs ONE channel can carry (0 = not reported: only max_leds bounds a
  // channel). Both channels at this length still clock out in parallel, so the
  // frame's wire time is ~30 us per LED of the longest channel. Filled in by the
  // player at runtime when the descriptor leaves it 0.
  uint32 max_leds_per_channel = 6;
}

// Reply to stop_mapping(solve_on_host=false): stopped + persisted, no host
// solve; counts echo what the server logged.
message MappingStopped {
  int32 detections = 1;
  int32 imu_samples = 2;
}

message TimeSyncPong {
  double t0 = 1;
  double t1 = 2;
  double t2 = 3;
}

message MappingStarted {
  double pattern_clock_epoch = 1;
  CodeParams code_params = 2;
}

message Status {
  int32 identified = 1;
  int32 total = 2;
  int32 low_parallax = 3;
}

message PatternState {
  bool active = 1;
  // Unset when no capture is active (JSON null).
  optional double pattern_clock_epoch = 2;
  CodeParams code_params = 3;
}

message LiveMap {
  bool active = 1;
  // Unset before the first interim solve (JSON null).
  optional OutputMap map = 2;
}

message SolveStatus {
  bool running = 1;
  optional double progress = 2;
  optional double rms_px = 3;
  repeated SolveLed leds = 4;
  repeated Vec3 trajectory = 5;
}

message ResultReady {
  string map_id = 1;
}

// Reply to a non-final UploadChunk: the player has accumulated `seq` and is
// ready for the next window. Echoes `upload_id`/`seq` so the client can pace
// its sends (one small TLS record each) and detect a lost/stale sequence.
message ChunkAck {
  uint32 upload_id = 1;
  uint32 seq = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

// Reply to set_counting_pattern: whether a counting pattern is displayed and
// the server-clock time it latched (the phone's read-valid time).
message CountingState {
  bool active = 1;
  // Unset when inactive (JSON null).
  optional double epoch_ms = 2;
}

// Reply to set_led_count: echo of the persisted per-channel strip length.
message LedCountState {
  int32 led_count = 1;
  int32 channel = 2;
  // As HardwareConfigState.reboot_required: the new count needs a bigger LED
  // buffer, so it is persisted and the player restarts in a moment to resize.
  bool reboot_required = 3;
}

// Reply to set_playback / get_playback: the effective configuration (the
// player echoes what it actually runs, defaults filled into params).
message PlaybackState {
  bool active = 1;
  // The running effect; "off" when inactive.
  string effect = 2;
  PlaybackParams params = 3;
  // Unset when no stored map is selected (JSON null).
  optional string map_id = 4;
}

// One rendered mapping-pattern frame: the player's monotonic-clock time
// (MICROSECONDS, raw micros()) at which the firmware pushed absolute frame
// `seq` to the LEDs. `seq` is the frame index since the pattern epoch BEFORE
// the cycle-length modulo, so the cycle is seq / cycle_frames and the expected
// emit time is pattern_clock_epoch_ms*1000 + seq * bit_period_us — the gap
// between that and t_mono_us is the render stutter. Integer µs (not double ms)
// because the player is a 32-bit RISC-V core with a single-precision-only FPU;
// keeping this path integer avoids software-emulated f64 on the firmware. NOTE
// micros() wraps ~every 71 min; the analysis only uses deltas, so a single
// wrap-straddling gap is simply ignored.
message FrameTick {
  uint32 seq = 1;
  uint32 t_mono_us = 2;
}

// Reply to get_frame_timing: a drained batch of rendered-frame timestamps
// plus the number of samples dropped to ring-buffer overflow since the last
// poll. Even bit_period_us spacing between successive t_mono_us = smooth
// generation; gaps = the pattern render loop stalled that long. All integer
// (see FrameTick) — this message is firmware↔phone only, so it carries the
// player's native integer units rather than the wire's usual double ms.
message FrameTiming {
  // Active-capture context; pattern_clock_epoch_ms is unset (and the rest 0)
  // when no capture is running, so the phone can skip a no-op batch. uint32
  // (not 64-bit): a millis() epoch fits (< 50 days) AND proto3 JSON keeps
  // 32-bit ints as numbers, where int64 would stringify.
  optional uint32 pattern_clock_epoch_ms = 1;
  uint32 bit_period_us = 2;
  uint32 cycle_frames = 3;
  uint32 dropped = 4;
  repeated FrameTick ticks = 5;
}

// Reply to get_stored_map: a slice of the encoded MappingBundle. total_len is
// the full bundle length (so the phone knows when it has all of it); data is
// bytes [offset, offset+len) of it; has_topology flags whether the bundle
// carries a topology (vs. just the point cloud).
message StoredMapChunk {
  int32 total_len = 1;
  int32 offset = 2;
  bytes data = 3;
  bool has_topology = 4;
}

// A declared 2D texture input (buffer kind=1) of the active effect. Lets a
// texture source (e.g. the TouchDesigner TOP) learn the exact dimensions it
// must send: set_texture silently drops any frame whose width/height don't
// match the declared texture, so a client with no way to read these back is
// left guessing. `elem` is the shader's components-per-texel (1=scalar,
// 3=vec3, …); the wire `format` in set_texture is independent of it.
message TexturePort {
  uint32 index = 1;  // tex_index used in set_texture
  uint32 width = 2;  // declared texture width (texels)
  uint32 height = 3; // declared texture height (texels)
  uint32 elem = 4;   // components per texel the shader samples
}

// The active/named effect's uniform manifest (compiler JSON) plus current live
// values. Reply to get_effect_uniforms.
message EffectUniforms {
  string effect_id = 1;
  // JSON array: [{name, slot, width, ui:{kind,...}, default:[...]}], exactly
  // the manifest fx_compiler emits (see docs/design/effects-compiler.md).
  bytes manifest = 2;
  repeated UniformValue current = 3;
  // Declared 2D texture inputs of the active effect (empty on older firmware).
  repeated TexturePort textures = 4;
  // FX deck this manifest describes: 0 = A (default), 1 = B.
  uint32 deck = 5;
}

message KeypointInfo {
  // Stable storage index (0..capacity-1).
  uint32 index = 1;
  string name = 2;
  // Saved against a different build of the effect (manifest hash differs); its
  // values still apply by uniform name.
  bool stale = 3;
}

// Reply to save/delete/list_keypoints.
message KeypointList {
  string effect_id = 1;
  uint32 deck = 2;
  repeated KeypointInfo keypoints = 3;
  // Max keypoints per effect (16).
  uint32 capacity = 4;
}

// Reply to get_keypoint.
message Keypoint {
  string effect_id = 1;
  uint32 index = 2;
  string name = 3;
  bool stale = 4;
  // By uniform name (as stored).
  repeated KeypointValue values = 5;
  // The same values resolved to slots of the effect loaded on the deck (empty
  // when the effect isn't loaded; names it no longer declares are dropped).
  repeated UniformValue slots = 6;
}

// Reply to get_tls_info: the device's own TLS identity (each device generates its own
// EC P-256 key + self-signed certificate on first boot; nothing secret ships in the
// firmware image).
message TlsInfo {
  // "generating" (first-boot key generation not finished: wss:443 is closed — wait and
  // retry) or "ready" (wss:443 is serving cert_sha256).
  string state = 1;
  // SHA-256 of the served certificate's DER, lowercase hex; empty while generating.
  // Stable for the device's life (no IP in the cert, so DHCP changes don't rotate it);
  // only a factory reset (flash erase) generates a new one. Clients pin it per device id.
  string cert_sha256 = 2;
  // False when the identity could not be written to flash this boot (it will change on
  // the next reboot) — a client should not treat that change as an attack.
  bool persisted = 3;
}

// Framerate autoscaler state (FUG-82). Reply to set_fps, and pushed
// unsolicited when the effect starts or stops lagging (an advisory).
// `target_fps` is the pinned rate (0 = autoscaling); `current_fps` the rate the
// effect runs at now (the ladder rung, or what it really achieves while
// lagging); `min_fps`/`max_fps` the autoscaler's lowest/highest rung for this
// strip (25/80 for up to 512 LEDs). A slow effect is never parked: below
// `min_fps` (or a pinned rate) it keeps rendering as fast as it can, with the
// render task's duty cycle bounded so the network, sensors and control stay
// responsive.
message FpsState {
  uint32 target_fps = 1;
  uint32 current_fps = 2;
  uint32 min_fps = 3;
  uint32 max_fps = 4;
  bool auto = 5;
  // Deprecated, always false: the player no longer parks a slow effect.
  bool aborted = 6 [deprecated = true];
  // Deprecated, always false (SetFps.no_abort is ignored).
  bool no_abort = 7 [deprecated = true];
  // The effect can't hold min_fps (or the pinned rate) and is running below it,
  // as fast as it can (current_fps = achieved_fps). Advisory: nothing stops.
  bool lagging = 8;
  // The frame rate the last ~30-frame window really ran at (0 = not measured yet).
  uint32 achieved_fps = 9;
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    TimeSyncPong time_sync_pong = 2;
    MappingStarted mapping_started = 3;
    Status status = 4;
    PatternState pattern_state = 5;
    LiveMap live_map = 6;
    SolveStatus solve_status = 7;
    ResultReady result_ready = 8;
    Error error = 9;
    MappingStopped mapping_stopped = 10;
    CountingState counting_state = 11;
    LedCountState led_count_state = 12;
    PlaybackState playback_state = 13;
    FrameTiming frame_timing = 14;
    StoredMapChunk stored_map_chunk = 15;
    EffectUniforms effect_uniforms = 16;
    PerfReport perf_report = 17;
    ChunkAck chunk_ack = 18;
    HardwareConfigState hardware_config_state = 19;
    ColorCorrectionState color_correction_state = 20;
    EffectList effect_list = 21;
    KeypointList keypoint_list = 22;
    Keypoint keypoint = 23;
    TlsInfo tls_info = 24;
    FpsState fps_state = 25;
    // 26: unused (left free while FUG-82 was in flight; it took 25).
    SensorState sensor_state = 27;
    I2cScanResult i2c_scan_result = 28;
    DriverState driver_state = 29;
    CaptureProfile capture_profile = 30;
    // 31: left free for in-flight branches (#325's ramp_state takes 40).
    // Reply to every OTA arm (docs/design/ota.md).
    OtaStatus ota_status = 32;
  }
}
