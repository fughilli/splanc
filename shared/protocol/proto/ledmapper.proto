// LED Mapper wire protocol (design doc §7) — protocol-buffer contract.
//
// This is the WIRE format for all host <-> phone communication: binary
// protobuf frames over the /ws WebSocket, wrapped in the ClientMessage /
// ServerMessage envelopes (one oneof arm per §7 message type).
//
// JSON parity: field names and shapes are chosen so the proto3 JSON mapping
// of every message matches the pre-protobuf JSON wire exactly (the server's
// internal models and the web app's TypeScript types predate this file and
// are generated from the JSON Schemas in ../schemas/). That parity is what
// keeps the migration boundary thin — each end converts envelope <-> flat
// JSON object at the socket and nothing else changes. Notes:
//   - vectors are FLAT `repeated double` (JSON: [x, y, z]), matching the
//     schema's fixed-arity arrays; `K` carries an explicit json_name;
//   - enum-like fields (encoding, fec, units, frame, syncPattern) are
//     STRINGS, because the JSON wire uses "gray-hue"-style values that
//     proto enum JSON names cannot reproduce;
//   - nullable-on-the-wire fields are `optional` (unset <-> null);
//   - trajectories are `repeated Vec3` and need a tiny shape conversion at
//     the boundary ([[x,y,z], ...] <-> [{v: [x,y,z]}, ...]) — the one spot
//     proto3 JSON cannot express nested arrays. Segment polylines (Topology)
//     get the same conversion.
//
// PLAYER PROFILES (docs/esp32-led-mapping-plan.md): two player targets
// implement this protocol behind one wire. Which envelope arms each supports:
//
//   CORE (every player — the stable player protocol):
//     client: hello, time_sync_ping, start_mapping, configure, stop_mapping,
//             submit_map, get_pattern, set_counting_pattern, set_led_count,
//             submit_topology, set_playback, get_playback
//     server: welcome, time_sync_pong, mapping_started, mapping_stopped,
//             pattern_state, result_ready, error, counting_state,
//             led_count_state, playback_state
//
//   PI ONLY (host-solve + live-map + telemetry paths — the Pi serves the
//   webapp and can run the solver):
//     client: detections, imu_batch, exposure_report, get_status,
//             get_live_map, get_solve_status
//     server: status, live_map, solve_status
//     The Pi's welcome carries solverBenchMs; an ESP32 never sets it, which
//     already makes the phone's placement decision "solve on phone"
//     (web/src/solver/placement.ts).
//
//   Unknown/unsupported arms on a player MUST produce a bounded reply, never
//   a crash: REQUEST arms (those with a defined reply) get
//   error{code: "unsupported"}; fire-and-forget arms (detections, imu_batch,
//   exposure_report) MAY be silently dropped so a chatty phone cannot flood
//   the error channel.

syntax = "proto3";

package ledmapper.v1;

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// 3-vector; used only where nesting forces a message type (trajectories).
message Vec3 {
  repeated double v = 1 [packed = true];
}

// Camera pose: position [x,y,z] (meters) + quaternion [x,y,z,w],
// camera-to-world (§7.4).
message Pose {
  repeated double p = 1 [packed = true];
  repeated double q = 2 [packed = true];
}

// Code-book parameters describing the temporal blink pattern (§7.6).
message CodeParams {
  int32 led_count = 1;
  // Coded BITS per cycle (data + FEC parity), sent log2(symbols) per frame.
  int32 bits = 2;
  // "hue" (the only carrier: constant-brightness color code).
  string encoding = 3;
  // Hold time per frame (symbol window), ms.
  double bit_period_ms = 4;
  // "on_off".
  string sync_pattern = 5;
  // 2 (sync delimiter) + ceil(bits / log2(symbols)) data frames.
  int32 cycle_frames = 6;
  // "none" | "secded".
  string fec = 7;
  // Data-symbol alphabet size: 2 (red/blue) or 4 (Gray-ordered bit pairs).
  int32 symbols = 8;
  // LED output brightness scale in [0,1]; unset = 1.0. Servoed by the phone
  // against measured bloom/wash-out (exposure.ts planLedBrightness).
  optional double brightness = 9;
  // Diffuse-capture striding (design: diffuse_capture; stride_lit in
  // firmware/pattern ↔ web/src/code/stride.ts). Unset/<=1 stride_spacing = every
  // LED lit every frame (legacy). Otherwise only a sparse, ≥ stride_spacing-
  // separated subset of LEDs lights in the active `stride_phase`; the phone
  // rotates the phase across epochs to cover the fixture.
  optional int32 stride_spacing = 10;
  optional int32 anchor_density = 11;
  optional int32 stride_phase = 12;
}

// One labeled observation of one LED in one frame (§7.4).
message DetectionRecord {
  int32 led_id = 1;
  double t_capture_ms = 2;
  double u = 3;
  double v = 4;
  int32 img_w = 5;
  int32 img_h = 6;
  // fx, fy, cx, cy.
  repeated double k = 7 [json_name = "K", packed = true];
  // Unset on the WebXR-free capture path (poses solved server-side).
  optional Pose pose = 8;
  double confidence = 9;
}

// One inertial sample, camera frame (§7.1 imu_batch).
message ImuSample {
  double t = 1;
  repeated double gyro = 2 [packed = true];
  repeated double accel = 3 [packed = true];
}

// Camera/exposure telemetry (§7.1 exposure_report).
message ExposureStats {
  double t_capture_ms = 1;
  double frame_interval_ms = 2;
  double mean_luma = 3;
  double p95_luma = 4;
  double clip_frac = 5;
  int32 blob_count = 6;
  double detector_threshold = 7;
  optional double iso = 8;
  optional double exposure_time_ms = 9;
  optional double ambient_intensity = 10;
}

// Per-LED entry of a reconstructed map (§7.5).
message LedEntry {
  int32 id = 1;
  repeated double xyz = 2 [packed = true];
  double confidence = 3;
  int32 n_views = 4;
  double rms_reproj_px = 5;
  double parallax_deg = 6;
}

message OutputMapStats {
  double rms_reproj_px_global = 1;
  double median_parallax_deg = 2;
}

// A reconstructed LED map (§7.5).
message OutputMap {
  string map_id = 1;
  string created_at = 2;
  // "meters".
  string units = 3;
  // "webxr_session_ref" | "gravity_leveled".
  string frame = 4;
  int32 led_count = 5;
  repeated LedEntry leds = 6;
  repeated int32 unmapped = 7 [packed = true];
  // Solved camera path (visual-inertial solves), same frame as leds.
  repeated Vec3 trajectory = 8;
  OutputMapStats stats = 9;
}

// Interim LED position during a running solve (lightweight preview).
message SolveLed {
  int32 id = 1;
  repeated double xyz = 2 [packed = true];
}

// A contiguous run of same-color LEDs in a counting pattern (§7.9).
message ColorBlock {
  int32 start = 1;
  int32 count = 2;
  // [r, g, b] in [0,1].
  repeated double rgb = 3 [packed = true];
}

// Skeletonized fixture topology (§7.7, Phase F output) — drives the O(N)
// pulse illuminate on players. Keyed to the OutputMap it skeletonizes.
message BranchPoint {
  int32 id = 1;
  // Meters, same frame as the OutputMap.
  repeated double xyz = 2 [packed = true];
}

message TopologySegment {
  int32 id = 1;
  // Endpoint branch-point ids; -1 = free end. Arclength runs from a to b.
  int32 a = 2;
  int32 b = 3;
  // Polyline from a to b (JSON: [[x,y,z], ...] — converted like trajectory).
  repeated Vec3 polyline = 4;
  // Total polyline arclength, meters.
  double length = 5;
}

message LedAssociation {
  int32 led_id = 1;
  int32 segment_id = 2;
  // Arclength of the LED's foot point along the segment, meters from a.
  double foot_arclength = 3;
  // Perpendicular distance LED -> foot point, meters.
  double d_perp = 4;
}

message Topology {
  string map_id = 1;
  repeated BranchPoint branch_points = 2;
  repeated TopologySegment segments = 3;
  repeated LedAssociation associations = 4;
}

// A solved fixture bundled for OFFLINE use: the point cloud + its skeleton
// topology, as one self-contained binaryproto file (.binpb). Exported by the
// phone (post-solve) or dumped from a player, and imported into the host
// effects-simulator workspace to preview effects on real captured data. Not an
// envelope arm — a standalone file format.
message MappingBundle {
  OutputMap map = 1;
  Topology topology = 2;
}

// Effect tunables (§7.8), mirroring the pulse reference's controls. All
// fields are optional overlays: unset keeps the player's current/default.
message PlaybackParams {
  // Global output brightness scale in [0,1].
  optional double intensity = 1;
  // Soft-falloff radius around a pulse agent, meters ('soft').
  optional double glow_radius = 2;
  // Concurrent pulse agents traversing the topology.
  optional int32 agent_count = 3;
  // Agent travel speed along the topology, m/s.
  optional double speed = 4;
  // Palette as 0xRRGGBB ints; empty keeps the player default.
  repeated uint32 palette = 5 [packed = true];
  // Pulse lead-in/out ramp distance at termini, meters (0 = derive from glow).
  optional double lead_in = 6;
  // Probability [0,1] a pulse splits at a junction.
  optional double split_prob = 7;
  // Flood fade length behind the wavefront, meters (0 = derive from glow).
  optional double decay = 8;
}

// ---------------------------------------------------------------------------
// Client -> server messages (§7.1)
// ---------------------------------------------------------------------------

message Hello {
  string client = 1;
  string app_version = 2;
}

message TimeSyncPing {
  double t0 = 1;
}

message StartMappingOptions {
  int32 led_count = 1;
  optional int32 symbols = 2;
  optional double bit_period_ms = 3;
  optional double brightness = 4;
  // Diffuse-capture striding (see CodeParams.stride_spacing). Unset/<=1 =
  // legacy all-lit. `anchor_density` (>=3, default 3) sets the shared-LED
  // overlap that fuses the per-phase partials; `stride_phase` (default 0) is
  // the initial phase the phone advances via Configure.
  optional int32 stride_spacing = 5;
  optional int32 anchor_density = 6;
  optional int32 stride_phase = 7;
}

message StartMapping {
  StartMappingOptions options = 1;
}

message ConfigureOptions {
  optional int32 led_count = 1;
  optional int32 symbols = 2;
  optional double bit_period_ms = 3;
  optional double brightness = 4;
  // Diffuse-capture striding (see StartMappingOptions). The phone re-sends this
  // each epoch to ADVANCE the phase (Configure restamps the pattern epoch).
  optional int32 stride_spacing = 5;
  optional int32 anchor_density = 6;
  optional int32 stride_phase = 7;
}

// Mid-capture renegotiation; reply is PatternState with the new epoch.
message Configure {
  ConfigureOptions options = 1;
}

message StopMapping {
  // Solver placement (client benchmark decision): unset/true -> host
  // reconstructs (reply result_ready); false -> stop + persist only (reply
  // mapping_stopped), the client solves locally and uploads via submit_map.
  optional bool solve_on_host = 1;
}

// Client-solved OutputMap upload (phone-side final solve, wasm).
message SubmitMap {
  OutputMap map = 1;
}

message Detections {
  repeated DetectionRecord batch = 1;
}

message ImuBatch {
  repeated ImuSample samples = 1;
}

message ExposureReport {
  ExposureStats report = 1;
}

message GetStatus {}

message GetPattern {}

message GetLiveMap {}

message GetSolveStatus {}

// LED-counting handshake (§7.9): display a static color-block pattern.
// Blocks paint [start, start+count); uncovered LEDs are off; painting past
// the physical strip end IS the probe (the phone binary-searches the strip
// length by observing which blocks light). Empty blocks = all off.
// Reply: counting_state.
message SetCountingPattern {
  repeated ColorBlock blocks = 1;
  // Player output channel; unset -> 0 (the Pi has one channel; the ESP32
  // may drive several RMT outputs).
  optional int32 channel = 2;
  // Wire color order for THIS probe's pixels (a permutation of "RGB", e.g.
  // "GRB"), applied ONLY to the counting pattern and independent of the
  // channel's committed color order. Lets the color-order test preview a
  // candidate order (or drive raw during identify) WITHOUT mutating the
  // persisted hardware config. Unset -> identity "RGB" (raw wire bytes).
  optional string color_order = 3;
}

// Persist the detected strip length for a channel (defaults future
// codeParams.ledCount, bounds playback buffers). Reply: led_count_state.
message SetLedCount {
  int32 led_count = 1;
  optional int32 channel = 2;
}

// Upload the skeletonized topology for a stored map (Phase F). The player
// persists it next to the map and replies result_ready (mirrors submit_map).
message SubmitTopology {
  Topology topology = 1;
}

// Playback control (§7.8): select the effect and overlay params. "off" is
// universal; other effects are player-capability-dependent (reply: error
// code="unsupported_effect" when not shipped). Reply: playback_state.
message SetPlayback {
  string effect = 1;
  PlaybackParams params = 2;
  // Stored map/topology to play on; unset keeps the current selection.
  optional string map_id = 3;
}

message GetPlayback {}

// Poll rendered-frame timing. The player samples its monotonic clock as it
// pushes each mapping-pattern frame to the LEDs; this drains the accumulated
// samples so the phone can forward them to the trace server and pattern-
// generator stutter becomes visible offline. Reply: frame_timing.
message GetFrameTiming {}

// Pull the player's stored map + topology back off the device as a
// MappingBundle, streamed in chunks (a map is far larger than one control
// frame). Request bytes [offset, offset+max_len) of the encoded bundle; the
// reply carries the total length so the phone knows when it has it all. Lets a
// phone recover a previously-mapped fixture without re-mapping and preview /
// export it. Reply: stored_map_chunk (or error `no_map`).
message GetStoredMap {
  int32 offset = 1;
  int32 max_len = 2;
}

// Sharded upload of a large submit_map / submit_topology, so no single frame
// forces the player's mbedtls to allocate a big contiguous TLS record buffer
// on its fragmented heap (a full ~150-LED map is one ~15 KB record; the C6
// OOMs the handshake/read trying to alloc it — see docs). The client slices
// the encoded frame into `payload` windows and streams them in `seq` order;
// the player reassembles and decodes on `last`. Each non-final chunk is
// ack'd with chunk_ack so the browser flushes one small TLS record per send
// (queued writes would otherwise re-coalesce into a big record). `upload_id`
// groups one sequence — a new id resets the player's accumulator.
// Reply: chunk_ack per chunk; result_ready (or error) on the last.
message UploadChunk {
  enum Kind {
    MAP = 0;       // payload windows reassemble a SubmitMap frame
    TOPOLOGY = 1;  // payload windows reassemble a SubmitTopology frame
  }
  uint32 upload_id = 1;
  uint32 seq = 2;     // 0-based; strictly increasing within an upload_id
  bool last = 3;      // the final window — reassemble + decode after this one
  Kind kind = 4;
  bytes payload = 5;  // a byte slice of the encoded frame (order = seq)
}

// ---------------------------------------------------------------------------
// Effects (§ effects-runtime): user shader bytecode (.fxb) execution
// ---------------------------------------------------------------------------

// A single uniform's live value. `slot` indexes the effect's uniform manifest;
// `value` carries 1..4 floats (scalar or vecN) interpreted per the manifest.
message UniformValue {
  uint32 slot = 1;
  repeated float value = 2 [packed = true];
}

// Upload a compiled effect: `.fxb` = bytecode + embedded uniform manifest.
// Stored to LittleFS keyed by `effect_id`, like submit_map. Set `activate` to
// make it the active effect on receipt. Reply: result_ready (id=effect_id) or
// error (`effect_too_large`, `bad_fxb`).
message SubmitEffect {
  string effect_id = 1;
  bytes fxb = 2;
  bool activate = 3;
}

// Select the active effect by id. "" or "off" clears it (back to the built-in
// idle/playback). Reply: playback_state.
message SetEffect {
  string effect_id = 1;
}

// Set live uniform values on the active effect (slider drags). Coalesced and
// persisted like set_playback. Reply: playback_state.
message SetUniforms {
  repeated UniformValue values = 1;
}

// Request an effect's uniform manifest + current live values for UI hydration.
// Unset `effect_id` = the active effect. Reply: effect_uniforms (or error
// `no_effect`).
message GetEffectUniforms {
  optional string effect_id = 1;
}

// ---------------------------------------------------------------------------
// Perf monitoring (§ perf-monitoring): device execution-time/memory telemetry
// ---------------------------------------------------------------------------

// Toggle perf telemetry. OFF: no stream. BASIC: cheap cycle/heap spans (Tier 0).
// FULL: also per-opcode instruction counts + stack high-water (Tier 1), only
// while a perf panel is open. `interval_ms` throttles the push cadence.
message SetPerf {
  enum Mode {
    OFF = 0;
    BASIC = 1;
    FULL = 2;
  }
  Mode mode = 1;
  uint32 interval_ms = 2;
}

// Request the rolled-up perf report for the active effect. Reply: perf_report.
message GetPerfReport {}

// Toggle the on-device RV32IM JIT (FUG-125). Debug/bench control, not a normal
// app path: the HITL fx_bench flips this to measure the interpreter golden (off)
// vs the JIT golden (on) against the SAME flashed firmware. Takes effect on the
// NEXT effect load, so callers re-submit the effect after toggling.
// Fire-and-forget (no reply).
message SetJit {
  bool enabled = 1;
}

// One rendered frame's timing/memory sample (all integers; cycles at cpu_hz).
message PerfFrame {
  uint32 seq = 1;
  uint32 update_cycles = 2;
  uint32 shade_cycles = 3;
  uint32 frame_cycles = 4;
  uint32 show_cycles = 5;
  uint32 led_count = 6;
  uint32 instr_update = 7;   // Tier 1 only (0 otherwise)
  uint32 instr_shade = 8;    // Tier 1 only
  uint32 stack_max = 9;      // Tier 1 only
}

// Rolled-up perf over a recent window + the raw tail. Sent unsolicited while a
// perf mode is active (throttled) and as the reply to get_perf_report.
message PerfReport {
  string effect_id = 1;
  uint32 fxb_hash = 2;
  uint32 cpu_hz = 3;
  uint32 budget_cycles = 4;
  uint32 frame_cycles_min = 10;
  uint32 frame_cycles_mean = 11;
  uint32 frame_cycles_max = 12;
  uint32 update_cycles_mean = 13;
  uint32 shade_cycles_mean = 14;
  uint32 show_cycles_mean = 15;
  uint32 overruns = 20;
  uint32 dropped_frames = 21;
  uint32 samples_dropped = 22;
  uint32 heap_free = 30;
  uint32 heap_min_free = 31;
  // Largest allocatable contiguous block (heap_caps_get_largest_free_block):
  // free heap can be ample yet fragmented, so this is what actually bounds a
  // single big allocation (TLS buffers, the map record, a render buffer).
  uint32 heap_largest_free = 32;
  repeated PerfFrame ticks = 40;
}

message ClientMessage {
  // Arm names equal the pre-protobuf "type" discriminator values.
  oneof msg {
    Hello hello = 1;
    TimeSyncPing time_sync_ping = 2;
    StartMapping start_mapping = 3;
    Configure configure = 4;
    StopMapping stop_mapping = 5;
    Detections detections = 6;
    ImuBatch imu_batch = 7;
    ExposureReport exposure_report = 8;
    GetStatus get_status = 9;
    GetPattern get_pattern = 10;
    GetLiveMap get_live_map = 11;
    GetSolveStatus get_solve_status = 12;
    SubmitMap submit_map = 13;
    SetCountingPattern set_counting_pattern = 14;
    SetLedCount set_led_count = 15;
    SubmitTopology submit_topology = 16;
    SetPlayback set_playback = 17;
    GetPlayback get_playback = 18;
    GetFrameTiming get_frame_timing = 19;
    GetStoredMap get_stored_map = 20;
    SubmitEffect submit_effect = 21;
    SetEffect set_effect = 22;
    SetUniforms set_uniforms = 23;
    GetEffectUniforms get_effect_uniforms = 24;
    SetPerf set_perf = 25;
    GetPerfReport get_perf_report = 26;
    SetDeviceName set_device_name = 27;
    SetTexture set_texture = 28;
    UploadChunk upload_chunk = 29;
    SetColorCorrection set_color_correction = 30;
    SetBrightness set_brightness = 31;
    SetJit set_jit = 32;
    SetHardwareConfig set_hardware_config = 33;
    GetHardwareConfig get_hardware_config = 34;
  }
}

// ---------------------------------------------------------------------------
// Server -> client messages (§7.2)
// ---------------------------------------------------------------------------

message Welcome {
  string session_id = 1;
  CodeParams code_params = 2;
  // Host score on the canned solver benchmark (ms); unset while measuring.
  optional double solver_bench_ms = 3;
  // Stable hardware MAC (factory-programmed; same address the BLE advertisement
  // uses), colon-separated uppercase hex. Lets the app match a player across the
  // BLE-onboarding and LAN paths. Empty on older firmware.
  string mac = 4;
  // Current display / Bluetooth-advertised name (default "Led Widget <6-hex>"
  // from the MAC, or a user-customized name). Empty on older firmware.
  string device_name = 5;
  // Current global output brightness (0.0 .. 1.0), so the app can hydrate its
  // master-dimmer control on connect. Runtime-only on the device (defaults to
  // 1.0 after a reboot); unset on older firmware.
  optional double brightness = 6;
  // Git commit the firmware was built from (full 40-char hash), stamped in at
  // build time (FUG-126). Lets the app show + link the device's exact build.
  // Empty on older firmware or an unstamped build.
  string fw_git_commit = 7;
  // True when the firmware was built from a dirty working tree (uncommitted
  // changes). Always false on older firmware.
  bool fw_git_dirty = 8;
  // Release version the firmware was built at, from the nearest firmware-v* tag
  // (e.g. "1.2.0", or "1.2.0-<n>-g<sha>" ahead of it, or "0.0.0-dev"). Stamped in
  // at build time alongside the commit. Empty on older firmware / an unstamped build.
  string fw_version = 9;
}

// One LED output channel's hardware config, carried in hardware_config_state.
message HardwareChannel {
  int32 channel = 1;
  int32 gpio = 2;
  string led_type = 3;
  // Wire color order, a permutation of "RGB" (see SetHardwareConfig.color_order).
  string color_order = 4;
}

// Request the per-channel hardware config (GPIO / LED type / wire color order),
// so the Hardware Setup page can hydrate on open. Reply: hardware_config_state.
message GetHardwareConfig {}

// Stream a frame into a loaded effect's 2D `texture` (video textures). `data` is
// the frame quantized to `format` (row-major, `width`*`height` texels),
// optionally XOR-delta'd against the previous frame (flags bit0 = DELTA — the
// device keeps the last quantized frame; a keyframe with DELTA unset resets that
// buffer first), then run-length coded (flags bit1 = RLE, a zero-run scheme:
// repeated [varint zero_run][varint literal_run][literal bytes...]). `tex_index`
// selects which declared texture (buffer id, kind=1) in the active effect; the
// texture's w/h/elem must match. No reply (fire-and-forget for high frame rates).
message SetTexture {
  uint32 tex_index = 1;
  uint32 format = 2; // 0 RGB888, 1 RGB565, 2 RGB332, 3 GRAY8, 4 INDEXED8
  uint32 width = 3;
  uint32 height = 4;
  uint32 flags = 5; // bit0 DELTA (XOR vs previous frame), bit1 RLE
  bytes data = 6;
  repeated uint32 palette = 7 [packed = true]; // INDEXED8 only: 0x00RRGGBB entries
}

// Set the player's display name; it becomes the Bluetooth-advertised name too
// and is persisted on the device. Reply: welcome (echoing the new device_name).
message SetDeviceName {
  string name = 1;
}

// Configure per-channel color correction. LEDs render washed out without gamma
// compensation; the player builds per-channel LUTs (gamma curve + white balance
// to the dimmest channel), persists them to flash, and applies them on the
// strip write path. Either name a built-in profile, or give explicit per-channel
// gamma + relative luminance. Reply: welcome.
message SetColorCorrection {
  // Built-in profile name (e.g. "ws2812b"). When set, the explicit fields below
  // are ignored. Empty/unset -> use the explicit gamma/luminance fields.
  optional string profile = 1;
  // Per-channel gamma exponent (WS2812B datasheet-typical is 2.8).
  optional float gamma_r = 2;
  optional float gamma_g = 3;
  optional float gamma_b = 4;
  // Per-channel relative luminance for white balance (datasheet mcd; only the
  // ratios matter). The brightest channels are scaled down so full-white renders
  // neutral.
  optional float lum_r = 5;
  optional float lum_g = 6;
  optional float lum_b = 7;
  // Whether to persist the generated LUT to flash. Unset/true commits (writes
  // littlefs); false applies from RAM only — used for live preview while the UI
  // drags curves, so a rapid stream of updates doesn't hammer the flash. The UI
  // sends one commit=true when it's done (e.g. the panel closes).
  optional bool commit = 8;
}

// Global output brightness — a single scalar applied to every LED's rendered
// colour just before the strip write (0.0 = fully dark, 1.0 = the effect's own
// output, the default). Runtime-only (NOT persisted): a reboot returns to full
// brightness, so a device can never get stuck dark. Two uses: a user "master
// dimmer" in the device settings, and the phone's performance-measurement
// driver, which sets it to 0 while it runs the calibration effects (so a fixture
// on a low-ampacity supply — e.g. USB from the phone — doesn't brown out and
// drop its wireless link on the changing pattern) and restores the user setpoint
// when done. Does NOT affect the camera-calibration patterns (gray-code /
// counting probe), which must reach the camera unscaled.
message SetBrightness {
  // Output scale in 0.0 .. 1.0 (clamped by the player). 1.0 is unattenuated.
  double brightness = 1;
}

// Configure an LED output channel's HARDWARE wiring: which GPIO drives its data
// line, the LED chip family, and the wire color order. Persisted to flash (NVS)
// and applied to the RMT driver. Every field is optional so the UI can nudge one
// setting at a time; an unset field leaves that setting unchanged. Reply:
// hardware_config_state (the resulting per-channel config).
message SetHardwareConfig {
  // Output channel index; unset -> 0. The ESP32-C6 drives up to two parallel RMT
  // channels; the Pi has one.
  optional int32 channel = 1;
  // GPIO number driving this channel's data line (any output-capable pin — the
  // RMT peripheral routes through the GPIO matrix). Unset -> leave unchanged.
  optional int32 gpio = 2;
  // LED chip family. "ws281x" (WS2811/WS2812/WS2812B/SK6812 clockless) is the
  // only type supported today. Unset -> leave unchanged.
  optional string led_type = 3;
  // Wire color order: a permutation of "RGB" naming which logical channel each
  // of the three wire bytes carries (e.g. "GRB" for WS2812B — byte0=green). The
  // driver maps logical R,G,B to this order on every strip write. Unset -> leave
  // unchanged.
  optional string color_order = 4;
  // Persist to flash (unset/true) or apply from RAM only (false). The color-order
  // confirmation test streams commit=false previews (forcing identity "RGB" so
  // the raw wire bytes reach the strip) and commits once the user picks the match.
  optional bool commit = 5;
}

// Reply to set_hardware_config / get_hardware_config: the per-channel hardware
// config the device is running (defaults filled in), for the UI to hydrate.
message HardwareConfigState {
  repeated HardwareChannel channels = 1;
  // Static, board-specific capabilities (pin catalog + LED modes). Unset on
  // older firmware — the app falls back to a built-in default catalog.
  BoardCapabilities board = 2;
}

// How safe a GPIO is to repurpose for LED data on a given board. Drives how the
// app groups the pin picker and whether picking it needs a confirmation.
enum PinSafety {
  PIN_SAFETY_UNSPECIFIED = 0;
  // Clean general-purpose pin: no boot / flash / USB / JTAG duty. Default choice.
  PIN_SAFETY_RECOMMENDED = 1;
  // Overloaded but usable (strapping / USB-JTAG / JTAG-debug): pick with care.
  PIN_SAFETY_CAUTION = 2;
  // Actively dangerous (e.g. wired to internal flash): driving it can hang the board.
  PIN_SAFETY_AVOID = 3;
}

// One selectable GPIO for LED data output.
message GpioPin {
  // GPIO number.
  uint32 gpio = 1;
  // Safety category — grouping in the picker + whether a confirm is shown.
  PinSafety safety = 2;
  // Optional board-specific reason shown in the confirm dialog (e.g. "JTAG debug
  // pin; flash clock on internal-flash models"). Empty -> the app uses default
  // wording for the safety level.
  string note = 3;
}

// One LED driver mode (chip family) this firmware build supports.
message LedMode {
  // Stable id echoed back in set_hardware_config.led_type (e.g. "ws281x").
  string id = 1;
  // Human-readable label for the dropdown (e.g. "WS281x (WS2811/2812/SK6812)").
  string label = 2;
}

// Static per-board hardware capabilities the firmware reports so the app can
// build its pin picker and LED-type list from what THIS board actually supports
// (different ESP32-C6 boards expose different pins / driver modes). Authored per
// board as a checked-in textproto, compiled to a binaryproto at build time and
// embedded in the firmware image (see firmware/player_app board_caps).
message BoardCapabilities {
  // Human-readable board identifier (e.g. "ESP32-C6 SuperMini"), for display/debug.
  string board = 1;
  // Selectable GPIOs for LED data output, each tagged with how safe it is.
  repeated GpioPin gpio_pins = 2;
  // LED driver modes (chip families) this firmware build supports.
  repeated LedMode led_modes = 3;
}

// Reply to stop_mapping(solve_on_host=false): stopped + persisted, no host
// solve; counts echo what the server logged.
message MappingStopped {
  int32 detections = 1;
  int32 imu_samples = 2;
}

message TimeSyncPong {
  double t0 = 1;
  double t1 = 2;
  double t2 = 3;
}

message MappingStarted {
  double pattern_clock_epoch = 1;
  CodeParams code_params = 2;
}

message Status {
  int32 identified = 1;
  int32 total = 2;
  int32 low_parallax = 3;
}

message PatternState {
  bool active = 1;
  // Unset when no capture is active (JSON null).
  optional double pattern_clock_epoch = 2;
  CodeParams code_params = 3;
}

message LiveMap {
  bool active = 1;
  // Unset before the first interim solve (JSON null).
  optional OutputMap map = 2;
}

message SolveStatus {
  bool running = 1;
  optional double progress = 2;
  optional double rms_px = 3;
  repeated SolveLed leds = 4;
  repeated Vec3 trajectory = 5;
}

message ResultReady {
  string map_id = 1;
}

// Reply to a non-final UploadChunk: the player has accumulated `seq` and is
// ready for the next window. Echoes `upload_id`/`seq` so the client can pace
// its sends (one small TLS record each) and detect a lost/stale sequence.
message ChunkAck {
  uint32 upload_id = 1;
  uint32 seq = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

// Reply to set_counting_pattern: whether a counting pattern is displayed and
// the server-clock time it latched (the phone's read-valid time).
message CountingState {
  bool active = 1;
  // Unset when inactive (JSON null).
  optional double epoch_ms = 2;
}

// Reply to set_led_count: echo of the persisted per-channel strip length.
message LedCountState {
  int32 led_count = 1;
  int32 channel = 2;
}

// Reply to set_playback / get_playback: the effective configuration (the
// player echoes what it actually runs, defaults filled into params).
message PlaybackState {
  bool active = 1;
  // The running effect; "off" when inactive.
  string effect = 2;
  PlaybackParams params = 3;
  // Unset when no stored map is selected (JSON null).
  optional string map_id = 4;
}

// One rendered mapping-pattern frame: the player's monotonic-clock time
// (MICROSECONDS, raw micros()) at which the firmware pushed absolute frame
// `seq` to the LEDs. `seq` is the frame index since the pattern epoch BEFORE
// the cycle-length modulo, so the cycle is seq / cycle_frames and the expected
// emit time is pattern_clock_epoch_ms*1000 + seq * bit_period_us — the gap
// between that and t_mono_us is the render stutter. Integer µs (not double ms)
// because the player is a 32-bit RISC-V core with a single-precision-only FPU;
// keeping this path integer avoids software-emulated f64 on the firmware. NOTE
// micros() wraps ~every 71 min; the analysis only uses deltas, so a single
// wrap-straddling gap is simply ignored.
message FrameTick {
  uint32 seq = 1;
  uint32 t_mono_us = 2;
}

// Reply to get_frame_timing: a drained batch of rendered-frame timestamps
// plus the number of samples dropped to ring-buffer overflow since the last
// poll. Even bit_period_us spacing between successive t_mono_us = smooth
// generation; gaps = the pattern render loop stalled that long. All integer
// (see FrameTick) — this message is firmware↔phone only, so it carries the
// player's native integer units rather than the wire's usual double ms.
message FrameTiming {
  // Active-capture context; pattern_clock_epoch_ms is unset (and the rest 0)
  // when no capture is running, so the phone can skip a no-op batch. uint32
  // (not 64-bit): a millis() epoch fits (< 50 days) AND proto3 JSON keeps
  // 32-bit ints as numbers, where int64 would stringify.
  optional uint32 pattern_clock_epoch_ms = 1;
  uint32 bit_period_us = 2;
  uint32 cycle_frames = 3;
  uint32 dropped = 4;
  repeated FrameTick ticks = 5;
}

// Reply to get_stored_map: a slice of the encoded MappingBundle. total_len is
// the full bundle length (so the phone knows when it has all of it); data is
// bytes [offset, offset+len) of it; has_topology flags whether the bundle
// carries a topology (vs. just the point cloud).
message StoredMapChunk {
  int32 total_len = 1;
  int32 offset = 2;
  bytes data = 3;
  bool has_topology = 4;
}

// A declared 2D texture input (buffer kind=1) of the active effect. Lets a
// texture source (e.g. the TouchDesigner TOP) learn the exact dimensions it
// must send: set_texture silently drops any frame whose width/height don't
// match the declared texture, so a client with no way to read these back is
// left guessing. `elem` is the shader's components-per-texel (1=scalar,
// 3=vec3, …); the wire `format` in set_texture is independent of it.
message TexturePort {
  uint32 index = 1;  // tex_index used in set_texture
  uint32 width = 2;  // declared texture width (texels)
  uint32 height = 3; // declared texture height (texels)
  uint32 elem = 4;   // components per texel the shader samples
}

// The active/named effect's uniform manifest (compiler JSON) plus current live
// values. Reply to get_effect_uniforms.
message EffectUniforms {
  string effect_id = 1;
  // JSON array: [{name, slot, width, ui:{kind,...}, default:[...]}], exactly
  // the manifest fx_compiler emits (see docs/design/effects-compiler.md).
  bytes manifest = 2;
  repeated UniformValue current = 3;
  // Declared 2D texture inputs of the active effect (empty on older firmware).
  repeated TexturePort textures = 4;
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    TimeSyncPong time_sync_pong = 2;
    MappingStarted mapping_started = 3;
    Status status = 4;
    PatternState pattern_state = 5;
    LiveMap live_map = 6;
    SolveStatus solve_status = 7;
    ResultReady result_ready = 8;
    Error error = 9;
    MappingStopped mapping_stopped = 10;
    CountingState counting_state = 11;
    LedCountState led_count_state = 12;
    PlaybackState playback_state = 13;
    FrameTiming frame_timing = 14;
    StoredMapChunk stored_map_chunk = 15;
    EffectUniforms effect_uniforms = 16;
    PerfReport perf_report = 17;
    ChunkAck chunk_ack = 18;
    HardwareConfigState hardware_config_state = 19;
  }
}
