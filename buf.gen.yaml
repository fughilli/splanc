# TypeScript bindings for the wire protocol (shared/protocol/proto).
# Regenerate after editing ledmapper.proto:
#     ./shared/protocol/proto/gen_ts.sh
version: v2
inputs:
  - directory: shared/protocol/proto
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
