<text x='498.0' y='114.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>LED 8 (block 0, class 2) has been</text>
<text x='498.0' y='130.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>lit since its dwell began.</text>
<text x='498.0' y='146.0' font-size='11' fill='#6b7180' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'></text>
<text x='498.0' y='162.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>Block 1 steps to class 0 one cycle</text>
<text x='498.0' y='178.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>earlier, so LED 9 would light 1 LED</text>
<text x='498.0' y='194.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>away from LED 8 (closer than S=3).</text>
<text x='498.0' y='210.0' font-size='11' fill='#6b7180' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'></text>
<text x='498.0' y='226.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>LED 9's interval started LATER: it</text>
<text x='498.0' y='242.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>stays dark for each own cycle that</text>
<text x='498.0' y='258.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>overlaps the other's interval (red),</text>
<text x='498.0' y='274.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>then lights on its next own cycle.</text>
<text x='498.0' y='290.0' font-size='11' fill='#6b7180' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'></text>
<text x='498.0' y='306.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>The earlier LED is never cut, so no</text>
<text x='498.0' y='322.0' font-size='11' fill='#1f2430' text-anchor='start' font-weight='normal' font-family='Inter, system-ui, -apple-system, Segoe UI, sans-serif'>live track is interrupted.</text>
