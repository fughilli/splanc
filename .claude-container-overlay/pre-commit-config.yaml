# Presubmit hooks (adapted from fughilli/volumetric-display).
#
# Generated files are byte-pinned by //shared/protocol:codegen_freshness —
# formatters must never touch them, hence the global exclude. `ledmapper_pb.ts`
# is likewise generated (protobuf-es, via shared/protocol/proto/gen_ts.sh).
# docs/design/ are long-form specs (like led-mapper-design.md, already exempt in
# .markdownlintignore) — kept out of the auto-reflow/line-length hooks.
exclude: |
  (?x)^(
    \.claude-container-overlay/skills/.*|
    shared/protocol/python/ledmapper_protocol/_generated\.py|
    shared/protocol/ts/generated/.*|
    web/src/gen/ledmapper_pb\.ts|
    docs/design/.*\.md|
    web/tests/golden_.*\.json|
    patches/.*\.patch|
    pnpm-lock\.yaml|
    requirements\.lock
  )$

repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        types: [python]
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203]

  # Shell script linting (shellcheck-py: no docker dependency, runs anywhere)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # BUILD file formatting (Bazel)
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # Nix formatting (pi/provisioning)
  - repo: https://github.com/nix-community/nixpkgs-fmt
    rev: v1.3.0
    hooks:
      - id: nixpkgs-fmt

  # Markdown/JSON/YAML formatting and linting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^pi/provisioning/.*\.nix$
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: (pytest_main|gen_golden)\.py$

  # Container image freshness: the agent container bakes prek's hook
  # environments into an image layer, built from a copy of THIS file at
  # .claude-container-overlay/pre-commit-config.yaml (the overlay directory is
  # the docker build context; /workspace isn't mounted at build time). The copy
  # doubles as the cache key — the launcher hashes it into the image tag — so it
  # has to move whenever this file does, or a container starts with a stale
  # baked cache and rebuilds the drifted hooks at startup.
  - repo: local
    hooks:
      - id: prek-overlay-config-copy
        name: sync container overlay prek config copy
        language: script
        entry: tools/sync_prek_overlay_config.sh
        files: ^(\.pre-commit-config\.yaml|\.claude-container-overlay/pre-commit-config\.yaml)$
        pass_filenames: false
