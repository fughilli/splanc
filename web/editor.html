<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>LED Mapper — Effects Editor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c10;
        color: #e8e8ea;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #app {
        display: flex;
        height: 100vh;
        min-height: 0;
      }
      #stage {
        flex: 1 1 auto;
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #view {
        width: 100%;
        flex: 1 1 auto;
        display: block;
        min-height: 0;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 12px;
        font: 12px/1.4 ui-monospace, monospace;
        color: #9fd8ff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        white-space: pre;
      }
      #editor-wrap {
        flex: 0 0 40%;
        display: flex;
        flex-direction: column;
        border-top: 1px solid #26262e;
        min-height: 0;
      }
      #code {
        flex: 1 1 auto;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        background: #101016;
        color: #e8e8ea;
        border: 0;
        padding: 0.6rem 0.8rem;
        font: 13px/1.5 ui-monospace, monospace;
        tab-size: 2;
        outline: none;
      }
      #status {
        flex: 0 0 auto;
        padding: 0.35rem 0.8rem;
        font: 12px/1.4 ui-monospace, monospace;
        border-top: 1px solid #26262e;
        background: #14141a;
        min-height: 1.4em;
      }
      #status.ok {
        color: #9fe6a0;
      }
      #status.err {
        color: #ff9d9d;
      }
      #panel {
        flex: 0 0 320px;
        overflow-y: auto;
        background: #14141a;
        border-left: 1px solid #26262e;
        padding: 0.75rem 0.9rem 2rem;
      }
      h1 {
        font-size: 1.05rem;
        margin: 0 0 0.15rem;
      }
      .sub {
        color: #8a8a94;
        margin: 0 0 1rem;
        font-size: 0.82rem;
      }
      .muted {
        color: #8a8a94;
        font-size: 0.82rem;
      }
      fieldset {
        border: 1px solid #26262e;
        border-radius: 8px;
        margin: 0 0 0.8rem;
        padding: 0.5rem 0.7rem 0.7rem;
      }
      legend {
        color: #9fd8ff;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0 0.3rem;
      }
      label {
        display: block;
        margin: 0.3rem 0;
        color: #c4c4cc;
      }
      .uni {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.35rem 0;
      }
      .uni-name {
        flex: 0 0 6.5rem;
        color: #c4c4cc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .uni-slider {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .uni-slider input[type="range"] {
        flex: 1 1 auto;
      }
      .uni-val {
        flex: 0 0 3rem;
        text-align: right;
        color: #8a8a94;
        font-variant-numeric: tabular-nums;
      }
      select,
      input[type="number"],
      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        background: #1d1d25;
        color: #e8e8ea;
        border: 1px solid #33333d;
        border-radius: 5px;
        padding: 0.25rem 0.4rem;
        box-sizing: border-box;
        font: inherit;
      }
      button {
        background: #23232c;
        color: #e8e8ea;
        border: 1px solid #3a3a46;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button:hover {
        background: #2c2c38;
      }
      button.primary {
        background: #1c4a6e;
        border-color: #2a6ea3;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 0.4rem;
      }
      .row > * {
        flex: 1 1 auto;
      }
      #diags {
        list-style: none;
        margin: 0.3rem 0 0;
        padding: 0;
        font: 12px/1.4 ui-monospace, monospace;
      }
      #diags li {
        color: #ff9d9d;
        margin: 0.15rem 0;
      }
      #ai-notes,
      #dev-status {
        color: #8a8a94;
        font-size: 0.82rem;
        margin-top: 0.3rem;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="view"></canvas>
        <div id="hud"></div>
        <div id="editor-wrap">
          <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
          <div id="status"></div>
        </div>
      </div>
      <div id="panel">
        <h1>Effects Editor</h1>
        <p class="sub">
          Write a GLSL-ish effect, watch it compile in the browser and preview on your map.
          The same manifest drives sliders here and on a connected device.
        </p>

        <fieldset>
          <legend>Map</legend>
          <label>fixture <select id="fx-kind"></select></label>
          <div class="row">
            <button id="gen" class="primary">Generate</button>
            <button id="import">Import .binpb…</button>
          </div>
          <input id="file" type="file" accept=".binpb,application/octet-stream" hidden />
        </fieldset>

        <fieldset>
          <legend>AI (bring your own key)</legend>
          <label>Anthropic API key
            <input id="ai-key" type="password" placeholder="sk-ant-…" /></label>
          <label>Describe an effect
            <textarea id="ai-ask" rows="2" placeholder="gentle blue breathing along the trunk"></textarea></label>
          <div class="row">
            <button id="ai-gen" class="primary">Generate script</button>
          </div>
          <div id="ai-notes"></div>
        </fieldset>

        <fieldset>
          <legend>Uniforms</legend>
          <div id="uniforms"><p class="muted">Compile a script to see its controls.</p></div>
        </fieldset>

        <fieldset>
          <legend>Diagnostics</legend>
          <ul id="diags"></ul>
        </fieldset>

        <fieldset>
          <legend>Device</legend>
          <div class="row">
            <button id="dev-send" disabled>Send to device</button>
            <button id="dev-hydrate" disabled>Load uniforms</button>
          </div>
          <div id="dev-status">Not connected.</div>
        </fieldset>
      </div>
    </div>
    <script type="module" src="/src/effects/editor/main.ts"></script>
  </body>
</html>
