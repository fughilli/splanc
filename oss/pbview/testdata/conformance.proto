// Every field shape pbview generates code for. Golden encodings come from
// protoc itself (`protoc --encode`, see BUILD.bazel), not from pbview.
syntax = "proto3";

package pbview.test;

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Inner {
  int32 a = 1;
  string label = 2;
  Inner child = 3;
}

message All {
  double f_double = 1;
  float f_float = 2;
  int64 f_int64 = 3;
  uint64 f_uint64 = 4;
  int32 f_int32 = 5;
  fixed64 f_fixed64 = 6;
  fixed32 f_fixed32 = 7;
  bool f_bool = 8;
  string f_string = 9;
  Inner f_inner = 11;
  bytes f_bytes = 12;
  uint32 f_uint32 = 13;
  Color f_color = 14;
  sfixed32 f_sfixed32 = 15;
  sfixed64 f_sfixed64 = 16;
  sint32 f_sint32 = 17;
  sint64 f_sint64 = 18;

  optional int32 opt_int32 = 20;
  optional string opt_string = 21;

  repeated int32 r_packed = 30;
  repeated sint64 r_sint64 = 31;
  repeated double r_double = 32;
  repeated string r_string = 33;
  repeated Inner r_inner = 34;
  repeated bytes r_bytes = 35;
  repeated Color r_color = 36;

  map<string, int32> counts = 40;

  oneof choice {
    Inner c_inner = 50;
    string c_text = 51;
    uint32 c_num = 52;
  }

  // Rust keywords as field names.
  int32 type = 60;
  string match = 61;

  enum Mode {
    MODE_OFF = 0;
    MODE_ON = 1;
  }
  Mode mode = 62;

  message Nested {
    fixed32 x = 1;
  }
  Nested nested = 63;
}

message Empty {}
