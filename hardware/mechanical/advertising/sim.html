<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splanc · Zero gravity</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#fafafa;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:pan-y;width:100%;height:100%}main{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#20252f,#080a0e 72%)}header{position:fixed;top:30px;left:32px;pointer-events:none}h1{font-weight:500;font-size:28px;letter-spacing:-1px;margin:0 0 6px}header p{color:#9cabb8;margin:0}#controls{position:fixed;bottom:24px;left:24px;right:24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,label{background:#151b24e8;color:#fff;border:1px solid #4a5563;border-radius:8px;padding:10px 14px;font:inherit}button{cursor:pointer}button:hover{border-color:#ffe38b}input{accent-color:#ffe38b;width:100px;vertical-align:middle}#hint{margin-left:auto;color:#a3afbb}#message{position:absolute;inset:45% 12%;text-align:center;pointer-events:none}#fallback{position:absolute;width:100%;height:100%;object-fit:contain;display:none}.embed header,.embed #hint,.embed #restart,.embed #count,.embed #speed-label{display:none}.embed #controls{left:auto;right:14px;bottom:14px}.embed button{font-size:12px;padding:7px 11px;opacity:.65}button:focus-visible{outline:2px solid #ffe38b;outline-offset:3px}@media(max-width:600px){header{top:20px;left:20px}h1{font-size:22px}#hint{display:none}#controls{left:12px;right:12px;bottom:12px}label{padding:8px}button,select{padding:9px}}
</style></head><body><main id="stage" aria-label="Interactive 3D Splanc products floating in zero gravity"><img id="fallback" src="poster.jpg" alt="Splanc Mini, Splanc and Splanc MAX"><div id="message" role="status">Loading the family…</div></main><header><h1>Splanc, in free flight.</h1><p>Three forms. One family.</p></header><div id="controls"><button id="pause" aria-pressed="false">Pause</button><button id="restart">Reset</button><select id="count" aria-label="Number of products"><option value="5">Up to 5 products</option><option value="8" selected>Up to 8 products</option><option value="12">Up to 12 products</option></select><label id="speed-label">Speed <input id="speed" aria-label="Simulation speed" type="range" min="0.2" max="2" step="0.1" value="0.7"></label><span id="hint">Drag a product to throw it · Space to pause</span></div><script type="module" src="sim.js"></script></body></html>
