<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splanc · Zero gravity</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%23ffe38b%27/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#fafafa;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none;width:100%;height:100%}main{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#20252f,#080a0e 72%)}#perimeter-leds{position:absolute;inset:0;pointer-events:none}header{position:fixed;top:30px;left:32px;pointer-events:none}h1{font-weight:500;font-size:28px;letter-spacing:-1px;margin:0 0 6px}header p{color:#9cabb8;margin:0}#controls{position:fixed;bottom:24px;left:24px;right:24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,label{background:#151b24e8;color:#fff;border:1px solid #4a5563;border-radius:8px;padding:10px 14px;font:inherit}button{cursor:pointer}button:hover{border-color:#ffe38b}input{accent-color:#ffe38b;width:100px;vertical-align:middle}#hint{margin-left:auto;color:#a3afbb}#message{position:absolute;inset:45% 12%;text-align:center;pointer-events:none}#fallback{position:absolute;width:100%;height:100%;object-fit:contain;display:none}.embed header,.embed #hint,.embed #restart,.embed #count,.embed #speed-label{display:none}.embed #controls{left:auto;right:30px;bottom:30px}.embed button{font-size:12px;padding:7px 11px;opacity:.65}button:focus-visible{outline:2px solid #ffe38b;outline-offset:3px}@media(max-width:600px){header{top:30px;left:30px}h1{font-size:22px}#hint{display:none}#controls{left:28px;right:28px;bottom:28px}label{padding:8px}button,select{padding:9px}}

#port-labels{position:fixed;inset:0;pointer-events:none}.port-leaders{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.port-leaders line{stroke:#badacbcc;stroke-width:1;stroke-dasharray:3 3}.port-callout{position:absolute;top:0;left:0;max-width:240px;pointer-events:auto;filter:drop-shadow(0 3px 12px #0009)}.port-callout button{display:block;position:relative;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;opacity:1}.port-callout button::before{content:"";position:absolute;inset:8px;border:1px solid #accfc3;border-radius:50%;background:#152923ee}.port-callout button:hover::before,.port-callout button[aria-expanded="true"]::before{background:#aaddc9;border-color:#e6fff5}.port-callout p strong{display:block;margin-bottom:5px;color:#fff;font-weight:600}.port-callout p{margin:6px 0 0;padding:12px;border:1px solid #617c72;border-radius:10px;background:#0c1513f5;color:#d8eee5;width:240px;font-size:13px;line-height:1.45}.port-callout[hidden]{display:none}@media(max-width:600px){.port-callout,.port-callout p{max-width:210px}}

#scale-reference-labels{position:fixed;inset:0;pointer-events:none;color:#a9c6d8}#scale-reference-labels svg{position:absolute;inset:0;width:100%;height:100%}#scale-reference-labels path{fill:none;stroke:#9db8c680;stroke-width:1}.dimension-label{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;letter-spacing:.02em;padding:3px 5px;border-radius:4px;background:#101c25e8;color:#cbdee9}.dimension-summary{position:absolute;left:0;right:0;bottom:42px;text-align:center;font-size:12px;color:#bed1dd;text-shadow:0 1px 4px #000}#scale-reference-labels[hidden],.dimension-label[hidden]{display:none}
</style></head><body><main id="stage" aria-label="Interactive 3D Splanc products floating in zero gravity"><img id="fallback" src="poster.jpg" alt="Splanc Mini, Splanc and Splanc MAX"><div id="message" role="status">Loading the family…</div></main><header><h1>Splanc, in free flight.</h1><p>Three forms. One family.</p></header><div id="controls"><button id="pause" aria-pressed="false">Pause</button><button id="restart">Reset</button><select id="count" aria-label="Number of products"><option value="5">Up to 5 products</option><option value="8" selected>Up to 8 products</option><option value="12">Up to 12 products</option></select><label id="speed-label">Speed <input id="speed" aria-label="Simulation speed" type="range" min="0.2" max="2" step="0.1" value="0.7"></label><span id="hint">Drag to throw · Double-tap to inspect · Space to pause</span></div><section id="inspection" aria-label="Product inspection" hidden><div id="inspection-copy"><h2 id="inspection-title"></h2><p>Drag to orbit · Pinch or scroll to zoom<br>Tap the background or press Esc to return</p></div><div id="inspection-tools"><button id="sensor-toggle" aria-pressed="false">Sensors</button><button id="scale-toggle" aria-pressed="true" aria-controls="scale-reference-labels">Size reference</button></div><div id="inspection-note" hidden></div><button id="close-inspection" aria-label="Close product inspection">×</button></section><script type="module" src="sim.js"></script></body></html>
