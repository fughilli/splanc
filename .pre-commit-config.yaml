# Presubmit hooks (adapted from fughilli/volumetric-display).
#
# Generated files are byte-pinned by //shared/protocol:codegen_freshness —
# formatters must never touch them, hence the global exclude.
exclude: |
  (?x)^(
    shared/protocol/python/ledmapper_protocol/_generated\.py|
    shared/protocol/ts/generated/.*|
    web/tests/golden_.*\.json|
    pnpm-lock\.yaml|
    requirements\.lock
  )$

repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        types: [python]
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203]

  # Shell script linting (shellcheck-py: no docker dependency, runs anywhere)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # BUILD file formatting (Bazel)
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # Nix formatting (pi/provisioning)
  - repo: https://github.com/nix-community/nixpkgs-fmt
    rev: v1.3.0
    hooks:
      - id: nixpkgs-fmt

  # Markdown/JSON/YAML formatting and linting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^pi/provisioning/.*\.nix$
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: (pytest_main|gen_golden)\.py$
