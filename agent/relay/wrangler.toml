# The Splanc cloud relay (docs/design/cloud-relay.md): one Worker + two
# SQLite-backed Durable Object classes, all on the Workers Free plan.
#
#   local:   pnpm dlx wrangler@4 dev --config agent/relay/wrangler.toml
#   deploy:  agent/relay/deploy.sh   (needs a token with Workers Scripts: Edit)
#
# Served at https://splanc-relay.<account subdomain>.workers.dev (no custom
# domain: splanc.io's DNS stays at its current registrar).

name = "splanc-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "BRIDGE"
class_name = "BridgeObject"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# Splanc AI credits: one object per credit account (agent/relay/src/billing,
# docs/design/ai-billing.md). Inert unless the AI_BILLING secret is "sandbox"
# or "production" (docs/ops/billing-go-live.md).
[[durable_objects.bindings]]
name = "BILLING"
class_name = "BillingAccount"

# Free plan: SQLite-backed Durable Objects only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BridgeObject", "Directory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BillingAccount"]

# Plain vars (deploy.sh ships them with the code; secrets stay in `wrangler secret`).
[vars]
# Web checkout is open only where the seller is set up for sales tax / VAT: the
# United States first (owner decision, D-608). Comma-separated ISO codes; remove
# the line (or leave it empty) to open checkout everywhere.
BILLING_WEB_COUNTRIES = "US"

[observability]
enabled = true
head_sampling_rate = 0.05
