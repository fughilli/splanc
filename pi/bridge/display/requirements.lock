# Pi-side Python lockfile for splanc-display (installed by pi/bridge/install.sh):
#
#   pip install --isolated --index-url https://pypi.org/simple \
#       --no-deps --require-hashes --only-binary :all: -r requirements.lock
#
# Only pure-Python wheels live here (py3-none-any: identical on armhf/arm64/x86).
# Their compiled dependencies come from Debian/Raspberry Pi OS Bookworm apt
# packages, built for the board's architecture with no compiler on the Pi:
#   python3-pil (luma.core: pillow>=9.2), python3-cbor2, python3-smbus2,
#   python3-spidev, python3-gpiozero + python3-lgpio (Pi 5 / RP1 GPIO).
# --isolated ignores /etc/pip.conf, which on Pi OS adds piwheels.org: its
# rebuilt wheels have different hashes from PyPI's.
#
# To bump: change a version, then take the wheel's sha256 from
# https://pypi.org/pypi/<name>/<version>/json (urls[].digests.sha256).
