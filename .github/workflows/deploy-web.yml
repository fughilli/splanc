# Publish a successful main-branch Test artifact without cutting an iOS/firmware
# release. App source and compiler/VM come from one successful build. A relay-only
# update may replace the independent Worker after strict diff and runtime gates.
name: Deploy tested web app
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test workflow run on main
        required: true
        type: string
      worker_only:
        description: Update only the relay; retain tested static app and matching WASM
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Deploy environment
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested main artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          jq -e '.head_branch == "main" and .event == "push" and .conclusion == "success" and .path == ".github/workflows/test.yaml"' /tmp/run.json
          TESTED_SHA="$(jq -r .head_sha /tmp/run.json)"
          gh api "repos/$GITHUB_REPOSITORY/compare/$TESTED_SHA...$GITHUB_SHA" | jq -e '.status == "ahead" or .status == "identical"'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name site --dir _site
          test -f _site/_worker.js
          test -f _site/fx-compiler/fx_compiler_wasm_pkg_bg.wasm
          test -f _site/fx-vm/fx_vm_wasm_pkg_bg.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent relay update
        if: inputs.worker_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED_SHA="$(jq -r .head_sha /tmp/run.json)"
          git fetch --depth=1 origin "$TESTED_SHA"
          git diff --name-only "$TESTED_SHA" HEAD > /tmp/relay-changes.txt
          # No app, compiler, VM, native source or dependency changes may be overlaid.
          python3 - <<'PYCODE'
          from pathlib import Path
          allowed = {'web/_worker.js', 'web/tests/demoAiWorker.test.mjs',
                     'web/tests/demoAiWorker.runtime.mjs', '.github/workflows/deploy-web.yml',
                     'docs/design/effects-demo.md'}
          unexpected = set(Path('/tmp/relay-changes.txt').read_text().splitlines()) - allowed
          if unexpected:
              raise SystemExit('Relay-only deployment rejected: ' + ', '.join(sorted(unexpected)))
          PYCODE
          node --test web/tests/demoAiWorker.test.mjs
          npm install --prefix "$RUNNER_TEMP/relay-runtime" --no-save --ignore-scripts miniflare@4.20260730.0
          MINIFLARE_MODULE="$RUNNER_TEMP/relay-runtime/node_modules/miniflare/dist/src/index.js" node web/tests/demoAiWorker.runtime.mjs
          cp web/_worker.js _site/_worker.js
          jq -n --arg app "$TESTED_SHA" --arg worker "$GITHUB_SHA" '{static_revision:$app,worker_revision:$worker}' > _site/worker-deployment.json
      # Whatever path built it, the Worker about to ship must start in the Workers
      # runtime (2026-10-31: a bare string export passed node but not workerd).
      - name: Validate the Worker in the Workers runtime
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/relay-runtime/node_modules/miniflare" ]; then
            npm install --prefix "$RUNNER_TEMP/relay-runtime" --no-save --ignore-scripts miniflare@4.20260730.0
          fi
          MINIFLARE_MODULE="$RUNNER_TEMP/relay-runtime/node_modules/miniflare/dist/src/index.js" \
            DEMO_WORKER="$PWD/_site/_worker.js" node web/tests/demoAiWorker.runtime.mjs
      - uses: pnpm/action-setup@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          # Wrangler can discover the account from the existing scoped token.
          for project in ledmapper splanc; do
            pnpm dlx wrangler@4 pages deploy _site --project-name "$project" --branch main --commit-dirty=true
          done
      - name: Deploy to GitHub Pages
        if: ${{ !inputs.worker_only }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
            traceability/
