# Release publishing — the ONLY path that ships artifacts to users. Everything is
# gated on per-component version tags (deploys never happen on a plain push to main;
# see test.yaml / macos.yaml, which only build + preview per commit):
#
#   firmware-vX.Y.Z  -> build both ESP32-C6 flashbundles, attach as Release assets;
#                       then (job `max`) the signed Splanc MAX over-the-air images
#                       (docs/design/max-ota.md), one per board, on the same release.
#   pi-vX.Y.Z        -> build the Pi 3 player SD image (.img.zst) + wiring README,
#                       attach as Release assets.
#   app-vX.Y.Z       -> deploy the webapp to GitHub Pages + Cloudflare (iOS/TestFlight
#                       is gated on the same tag in macos.yaml).
#
# The webapp's flash tool enumerates the firmware Releases live from the GitHub API
# (web/src/flash/githubReleaseRepo.ts), so a firmware release becomes selectable in
# the UI the moment it's published — no webapp redeploy needed.
#
# Cut a release by tagging a commit, e.g.:
#   git tag firmware-v1.0.0 <sha> && git push origin firmware-v1.0.0
name: Release

on:
  push:
    tags:
      - 'app-v*'
      - 'firmware-v*'
      - 'pi-v*'

permissions:
  contents: write # create GitHub Releases + push gh-pages (webapp)

jobs:
  # --- firmware-v* : both ESP32-C6 variants as release assets ------------------
  firmware:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so status.sh `git describe` stamps the version

      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-firmware-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-

      # The agent bundle for this firmware (MCP bridge + matching compiler/simulator
      # wasm + skill; agent/BUILD.bazel), versioned by the tag. Built BEFORE the
      # firmware: the tarball is reproducible, so its sha256 is known up front, and
      # the firmware's discovery manifest advertises bundle.url + bundle.sha256.
      # AGENT_BUNDLE_URL / _SHA256 are exported for that handoff (agent/README.md
      # "Release"): the device side passes them as
      #   --//firmware/player_app:agent_bundle_url=... / :agent_bundle_sha256=...
      - name: Build the agent bundle
        run: |
          VER="${GITHUB_REF_NAME#firmware-v}"
          bazel build -c opt --disk_cache="$HOME/.cache/bazel-disk" \
            --//agent:bundle_version="${VER}" //agent:bundle
          echo "AGENT_BUNDLE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/splanc-agent-${VER}.tgz" >> "$GITHUB_ENV"
          echo "AGENT_BUNDLE_SHA256=$(cut -d' ' -f1 "bazel-bin/agent/splanc-agent-${VER}.tgz.sha256")" >> "$GITHUB_ENV"

      # Diagnostic: the tracked-file changes the workspace status command sees.
      # A dirty stamp drops the agent bundle from the firmware's manifest, so log
      # what (if anything) would make it dirty (tools/build_info/status.sh ignores
      # MODULE.bazel.lock, which Bazel itself rewrites).
      - name: Show tracked-file changes (dirty-stamp diagnostic)
        run: git status --porcelain --untracked-files=no

      # The vendor player firmware was deprecated/removed; only the heapless-netstack
      # variant ships now. (The webapp's release source still recognizes an
      # esp32c6-vendor-*.tar for OLD releases; new releases carry only -netstack-.)
      - name: Build the netstack flashbundle
        run: |
          # The discovery manifest names this release's agent bundle (built above).
          bazel build -c opt --disk_cache="$HOME/.cache/bazel-disk" \
            --//firmware/player_app:agent_bundle_url="${AGENT_BUNDLE_URL}" \
            --//firmware/player_app:agent_bundle_sha256="${AGENT_BUNDLE_SHA256}" \
            //firmware/player_app:esp32c6_netstack_flashbundle \
            //firmware/player_app:esp32c6_ota_flashbundle \
            //firmware/ota:ota_sign

      # Rename to a versioned, variant-tagged asset name the webapp's release source
      # matches (web/src/flash/githubReleaseRepo.ts ASSET_RE = esp32c6-<variant>-*.tar).
      - name: Stage release assets
        run: |
          VER="${GITHUB_REF_NAME#firmware-v}"
          mkdir -p _assets
          cp bazel-bin/firmware/player_app/esp32c6_netstack_flashbundle.tar "_assets/esp32c6-netstack-${VER}.tar"
          cp "bazel-bin/agent/splanc-agent-${VER}.tgz" "bazel-bin/agent/splanc-agent-${VER}.tgz.sha256" _assets/

      # Over-the-air updates (docs/design/ota.md): sign the app with the release key
      # (the loader in esp32c6-ota-<ver>.tar trusts only firmware/ota/keys/release.pub)
      # -> esp32c6-netstack-<ver>.ota (what update_firmware / "Update over Wi-Fi"
      # stream) + esp32c6-ota-<ver>.tar (the loader + app USB bundle, package inside).
      # A release without the key can't ship an OTA layout nobody could update, so
      # this fails loudly instead of skipping.
      # Fail before anything is published if the secret isn't the key whose public
      # half the loaders trust (firmware/ota/keys/release.pub): images signed with any
      # other key would be refused by every loader in the field.
      - name: Check the OTA signing key matches release.pub
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "${OTA_SIGNING_KEY}" ]; then
            echo "::error::the OTA_SIGNING_KEY repository secret is not set (docs/design/ota.md \"Signing\")"
            exit 1
          fi
          derived="$(bazel-bin/firmware/ota/ota_sign pubkey --key-env OTA_SIGNING_KEY)"
          committed="$(bazel-bin/firmware/ota/ota_sign check-pub --in firmware/ota/keys/release.pub)"
          if [ "${derived}" != "${committed}" ]; then
            echo "::error::OTA_SIGNING_KEY's public key (${derived}) is not firmware/ota/keys/release.pub (${committed})"
            exit 1
          fi
          echo "OTA signing key matches release.pub"

      - name: Sign the OTA package
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          VER="${GITHUB_REF_NAME#firmware-v}"
          if [ -z "${OTA_SIGNING_KEY}" ]; then
            echo "::error::the OTA_SIGNING_KEY secret is not set (docs/design/ota.md \"Signing\")"
            exit 1
          fi
          python3 tools/ota_release.py \
            --bundle bazel-bin/firmware/player_app/esp32c6_ota_flashbundle.tar \
            --version "${VER}" --signer bazel-bin/firmware/ota/ota_sign \
            --pubkey firmware/ota/keys/release.pub --key-epoch firmware/ota/keys/epoch.bin \
            --out-dir _assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _assets/*.tar
            _assets/*.ota
            _assets/key-epoch.bin
            _assets/*.tgz
            _assets/*.tgz.sha256
          generate_release_notes: true
          # Record the exact tagged commit so the webapp can show + link the build
          # each firmware asset was cut from (githubReleaseRepo reads this).
          target_commitish: ${{ github.sha }}

  # --- firmware-v* : Splanc MAX over-the-air images (docs/design/max-ota.md) ---
  # One signed image per board, on the SAME release as the C6 firmware, so "latest"
  # means the same version for every fixture. A MAX downloads its image itself from
  # this release (max-<board>-<ver>.nixclosure); clients only send the 108-byte
  # max-<board>-<ver>.manifest. Signed with the MAX key (key id 3, the
  # MAX_OTA_SIGNING_KEY secret), never the C6 loader ring's keys. Until that key
  # exists (firmware/ota/keys/max.pub is UNSET) or while the secret is missing, the
  # job SKIPS signing with a warning instead of failing the firmware release.
  # The MAX ring's other key, id 4 `max_backup` (firmware/ota/keys/max_backup.pub),
  # is OFFLINE: there is no secret for it and nothing here signs with it
  # (max_ota_release.py refuses --key-id 4 without --key-file). The owner uses it by
  # hand, on an offline machine, only to rotate away from a compromised max key: the
  # max_epoch.bin record and one bridge image (docs/design/max-ota.md "Key rotation").
  max:
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    needs: firmware # publish onto the release the firmware job created
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Board -> sbc_application. Pi 3 is the released fleet; add a board here once
        # its trial boot is wired (Pi 4 / Zero 2W: same U-Boot path, need their
        # sbc_application targets; Pi 5: tryboot, docs/design/max-ota.md).
        include:
          - board: pi3
            app: ledmapper_pi3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is the MAX signing key provisioned?
        id: key
        env:
          MAX_OTA_SIGNING_KEY: ${{ secrets.MAX_OTA_SIGNING_KEY }}
        run: |
          if grep -qx UNSET firmware/ota/keys/max.pub; then
            echo "::warning::firmware/ota/keys/max.pub is UNSET: no Splanc MAX OTA images this release (docs/design/max-ota.md \"Signing\")"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${MAX_OTA_SIGNING_KEY}" ]; then
            echo "::warning::the MAX_OTA_SIGNING_KEY secret is not set: no Splanc MAX OTA images this release"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk space
        if: steps.key.outputs.ok == 'true'
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      - name: Install Nix
        if: steps.key.outputs.ok == 'true'
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        if: steps.key.outputs.ok == 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-pi-${{ hashFiles('MODULE.bazel.lock', 'pi/provisioning/nix/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-pi-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-pi-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        if: steps.key.outputs.ok == 'true'
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        if: steps.key.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-pi-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-pi-${{ runner.os }}-

      # The system closure, stamped with the release version (ota.nix reads
      # SPLANC_MAX_VERSION into /etc/splanc-max/version, which is what the Pi reports
      # and compares). The image_sd launcher builds `images.maxOtaSystem`, whose
      # toplevel.img names the system's store path.
      - name: Build the ${{ matrix.board }} system
        if: steps.key.outputs.ok == 'true'
        run: |
          VER="${GITHUB_REF_NAME#firmware-v}"
          SPLANC_MAX_VERSION="${VER}" bazel run //pi/provisioning:${{ matrix.app }}.image_sd \
            --disk_cache="$HOME/.cache/bazel-disk" -- --no-write --attr images.maxOtaSystem 2>&1 | tee /tmp/max-system.log
          TOP="$(sed -n 's/^==> Built image: //p' /tmp/max-system.log | tail -n1)"
          test -n "$TOP" && test -f "$TOP" || { echo "::error::no system built"; exit 1; }
          echo "MAX_TOPLEVEL_FILE=${TOP}" >> "$GITHUB_ENV"
          bazel build --disk_cache="$HOME/.cache/bazel-disk" //firmware/ota:ota_sign

      - name: Pack and sign the ${{ matrix.board }} image
        if: steps.key.outputs.ok == 'true'
        env:
          MAX_OTA_SIGNING_KEY: ${{ secrets.MAX_OTA_SIGNING_KEY }}
        run: |
          VER="${GITHUB_REF_NAME#firmware-v}"
          nix shell nixpkgs#zstd -c python3 tools/max_ota_release.py \
            --toplevel "${MAX_TOPLEVEL_FILE}" --board ${{ matrix.board }} --version "${VER}" \
            --signer bazel-bin/firmware/ota/ota_sign --pubkey firmware/ota/keys/max.pub \
            --key-env MAX_OTA_SIGNING_KEY --out-dir _assets
          if [ -f firmware/ota/keys/max_epoch.bin ]; then cp firmware/ota/keys/max_epoch.bin _assets/max-key-epoch.bin; fi
          ls -l _assets

      - name: Publish onto the release
        if: steps.key.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _assets/max-*.nixclosure
            _assets/max-*.manifest
            _assets/max-key-epoch.bin
          fail_on_unmatched_files: false

  # --- pi-v* : Pi 3 player SD image + wiring README ---------------------------
  # Native aarch64 build on GitHub's arm64 Linux runner (the SD image is an
  # aarch64-linux NixOS closure; an x86 runner would need --cross/QEMU). image_sd
  # --no-write builds the .img.zst without flashing a device (sbc_deploy.sh).
  pi:
    if: startsWith(github.ref, 'refs/tags/pi-v')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-pi-${{ hashFiles('MODULE.bazel.lock', 'pi/provisioning/nix/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-pi-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-pi-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-pi-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-pi-${{ runner.os }}-

      # image_sd prints "==> Built image: <store-path>.img.zst" on stdout; copy it
      # out under a versioned name. --no-write skips the dd-to-device step.
      - name: Build Pi 3 SD image
        run: |
          VER="${GITHUB_REF_NAME#pi-v}"
          bazel run //pi/provisioning:ledmapper_pi3.image_sd \
            --disk_cache="$HOME/.cache/bazel-disk" -- --no-write 2>&1 | tee /tmp/pi-image.log
          IMG="$(sed -n 's/^==> Built image: //p' /tmp/pi-image.log | tail -n1)"
          test -n "$IMG" && test -f "$IMG" || { echo "::error::no .img.zst produced"; exit 1; }
          mkdir -p _assets
          cp "$IMG" "_assets/ledmapper-pi3-${VER}.img.zst"
          cp pi/provisioning/README.md "_assets/README.md"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _assets/ledmapper-pi3-*.img.zst
            _assets/README.md
          generate_release_notes: true

  # --- app-v* : webapp to GitHub Pages + Cloudflare ---------------------------
  # (iOS/TestFlight is gated on app-v* in macos.yaml.) Firmware is NOT bundled here:
  # production selects firmware from Releases; the same-commit "This build (dev)"
  # bundle is a PR-preview affordance (test.yaml), so stage_site skips /firmware/.
  webapp:
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    environment: Deploy environment
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so status.sh `git describe` stamps the version

      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-deploy-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-deploy-${{ runner.os }}-
            bazel-disk-site-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build developer docs
        run: bazel run //docs:build --disk_cache="$HOME/.cache/bazel-disk"

      - name: Stage site
        env:
          LEDMAPPER_DOCS_SITE: ${{ github.workspace }}/docs/site/html
        run: bazel run //web:stage_site --disk_cache="$HOME/.cache/bazel-disk" -- "$GITHUB_WORKSPACE/_site"

      # splanc.io/app consumes this exact release tree, including its version
      # stamp and matching compiler/VM/solver bundles.
      - name: Upload released webapp
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 90
          if-no-files-found: error

      # A durable copy of the same tree as a Release asset: workflow artifacts
      # expire (90 days), and splanc.io/app follows the newest app-v* release by
      # downloading this asset (Studio-Fug/splanc.io scripts/stage-app.mjs).
      # make_latest=false keeps releases/latest pointing at firmware.
      - name: Package released webapp
        run: |
          VER="${GITHUB_REF_NAME#app-v}"
          mkdir -p _assets
          tar -C _site -czf "_assets/splanc-webapp-${VER}.tar.gz" .
          (cd _assets && sha256sum "splanc-webapp-${VER}.tar.gz" > "splanc-webapp-${VER}.tar.gz.sha256")

      - name: Publish app Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _assets/splanc-webapp-*.tar.gz
            _assets/splanc-webapp-*.tar.gz.sha256
          generate_release_notes: true
          make_latest: false
          target_commitish: ${{ github.sha }}

      - name: Deploy to GitHub Pages (main site)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
            traceability/

      - name: Deploy to Cloudflare Pages (production)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          LEDMAPPER_DOCS_SITE: ${{ github.workspace }}/docs/site/html
        run: bazel run //web:deploy_cloudflare --disk_cache="$HOME/.cache/bazel-disk"
