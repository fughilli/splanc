name: Test
on:
  # `closed` is needed so the per-PR Pages preview is torn down when the PR is
  # merged/closed (see the deploy-preview / cleanup-preview jobs). The build
  # jobs below skip that event.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
# CI-observability sink credentials (FUG-128), inherited by every job in this
# workflow. Set them as *repository* secrets (Settings → Secrets and variables →
# Actions) so all jobs — with or without an environment — can read them; fork
# PRs get empty values and the sinks/report no-op. The Loki keys are the same
# ones FUG-117 uses; the CLICKHOUSE_* keys are the optional columnar backend.
# See tools/ci_observability/README.md.
env:
  GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
  GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
  GRAFANA_CLOUD_LOKI_KEY: ${{ secrets.GRAFANA_CLOUD_LOKI_KEY }}
  CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
  CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
  CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
  CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
  CLICKHOUSE_TABLE: ${{ secrets.CLICKHOUSE_TABLE }}
  CLICKHOUSE_TOKEN: ${{ secrets.CLICKHOUSE_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
jobs:
  test:
    # Don't run the (heavy) build on a PR-close event — that only tears down the
    # preview (cleanup-preview job).
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Free ~20-30GB of runner disk before the heavy Nix/Bazel build (FUG-76):
      # ubuntu-latest gives only ~14GB free on /, but the /nix store + Bazel disk
      # cache exhaust it. This deletes the ~25GB of preinstalled SDKs we never use
      # (Android, .NET, GHC, browsers, …) in place — no remount — so the caches
      # under ~/.cache keep working unchanged. Every toolchain we do need (Nix,
      # Bazel) is installed by the steps below, after this cleanup.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      # Nix is a system requirement for this repo (see MODULE.bazel): the M4
      # provisioning targets shell out to it and `bazel test //...` realizes
      # nixpkgs-provided build tools (e.g. the HTML minifier). Single-user nix
      # install so the whole /nix store is cacheable below — otherwise every run
      # re-evaluates the pinned nixpkgs snapshot and re-realizes those tools from
      # scratch, which dominated this job's wall-clock.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Share repository cache between workflows.
          repository-cache: true

      # Explicit, restore-key'd Bazel disk cache (compiled action outputs). This
      # replaces setup-bazel's workflow-keyed disk-cache, which only persisted on
      # a successful run and had no graceful fallback when its key rotated. The
      # restore-keys prefix means even a key miss restores the newest prior cache.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-test-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-test-${{ runner.os }}-

      - name: Test
        id: test
        # `--test_output=errors` (not `streamed`): streamed serializes test
        # execution and suppresses caching of test actions; errors still surfaces
        # failing-test logs. --build_event_json_file records the BEP the
        # CI-observability step parses below (FUG-128).
        run: |
          bazel test //... \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --test_output=errors \
            --build_event_json_file="$RUNNER_TEMP/bep-test.json"

      # Parse the BEP into a CI-failure HTML report, upload it, link it from the
      # job summary, and push per-test-case records to the telemetry sinks.
      # always() so a failing test run is still reported.
      - name: CI report
        if: always()
        uses: ./.github/actions/bep-report
        with:
          bep-file: ${{ runner.temp }}/bep-test.json
          job: test
          runner: github:linux
          artifact-name: ci-report-test

  # The ESP32-C6 firmware image is tags=manual (kept out of the `//...` wildcard
  # so the `test` job above — and dev on small containers — stays light: it
  # compiles mbedtls + the Arduino core from source). Build it explicitly here so
  # firmware compile/link breakage is still caught in CI. Needs the same Nix
  # toolchains as the test job.
  firmware:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Free runner disk before the heavy Nix/Bazel build — see the `test` job
      # above (FUG-76). This job compiles mbedtls + the Arduino core from source,
      # the most disk-hungry of the lot.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      # Single-user nix install so the whole /nix store is cacheable below. This
      # job realizes the ESP32-C6 toolchain + mbedtls + the Arduino core from
      # source — the dominant CI cost — so caching /nix across runs is the win.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-firmware-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Bazel's *disk cache* (compiled action outputs) is the dominant cost: the
      # mbedtls / Arduino-core / firmware cc_library compiles, which setup-bazel
      # wasn't persisting. Cache it explicitly, keyed on the toolchain inputs so
      # the (invariant) mbedtls/core objects stay cached across commits.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-

      # Build the image AND the self-describing flash bundle (flash.json + bins).
      # The bundle is the same-revision firmware the webapp flashes over USB
      # (FUG-60); build-site downloads this artifact and stages it under
      # /firmware/, so the heavy ESP toolchain lives only in this job.
      - name: Build firmware image + flash bundle (esp32c6)
        id: fw
        run: |
          bazel build -c opt --disk_cache="$HOME/.cache/bazel-disk" \
            --build_event_json_file="$RUNNER_TEMP/bep-firmware.json" \
            //firmware/player_app:esp32c6 \
            //firmware/player_app:esp32c6_flashbundle

      # Report build-event outcomes (captures firmware compile/link failures).
      - name: CI report
        if: always()
        uses: ./.github/actions/bep-report
        with:
          bep-file: ${{ runner.temp }}/bep-firmware.json
          job: firmware
          runner: github:linux
          artifact-name: ci-report-firmware

      - name: Upload flash bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-flashbundle
          path: bazel-bin/firmware/player_app/esp32c6_flashbundle.tar
          retention-days: 3
          if-no-files-found: error

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # prek is the presubmit lint runner (FUG-63): the same single binary the
      # agent containers install as a git pre-commit hook (see
      # .claude-container-overlay/), reading the same .pre-commit-config.yaml.
      # Running it here — rather than pre-commit/action — keeps the local commit
      # gate and CI byte-for-byte identical, so lints can't pass in one and fail
      # in the other. Version pinned to match the container overlay.
      - name: Install prek
        run: python -m pip install 'prek==0.4.12'

      # prek keeps its hook environments under ~/.cache/prek; cache them keyed on
      # the config so CI doesn't rebuild every hook toolchain each run.
      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run lints (prek)
        run: prek run --all-files --show-diff-on-failure --color=always

  # ---------------------------------------------------------------------------
  # Deploy the PWA to GitHub Pages (FUG-26).
  #
  # Hosting model: the gh-pages branch is the Pages source. The main site lives
  # at its root (https://fughilli.github.io/splanc/) and every open PR gets a
  # staging copy under pr-preview/pr-N/. The web bundle is built base-relative
  # (web/vite.config.ts), so the same tree works at both the root and a subpath.
  #
  # Repo setup (one-time): Settings → Pages → "Deploy from a branch" → gh-pages
  # / (root). Cloudflare secrets (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
  # live in the "Deploy environment" GitHub Actions environment — the
  # deploy-production job declares `environment:` so it can read them.
  # ---------------------------------------------------------------------------

  # Build the complete static site tree (app bundle + the solver/pulse/fx-vm/
  # fx-compiler wasm bundles) once, and hand it to the deploy jobs as an
  # artifact — so the (heavy) Bazel/wasm build runs a single time per pipeline.
  # Gated on the tests passing.
  build-site:
    if: github.event.action != 'closed'
    # Also needs `firmware`: the site bundles that job's same-revision flash
    # bundle under /firmware/ for in-browser USB flashing (FUG-60).
    needs: [test, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Free runner disk before the heavy Nix/Bazel build — see the `test` job
      # above (FUG-76). This job also builds the wasm bundles.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      # The esp32c6 flash bundle built by the `firmware` job (same revision).
      - name: Download flash bundle
        uses: actions/download-artifact@v4
        with:
          name: esp32c6-flashbundle
          path: ${{ github.workspace }}/_flashbundle

      # Same caching rationale as the `test` job: cache /nix so the pinned
      # nixpkgs snapshot + build tools aren't re-realized every run. This job is
      # on the PR critical path (needs: test) and builds the wasm bundles.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Own disk-cache namespace, with the `test` job's prefix as a fallback
      # restore key so a fresh run starts from test's just-built outputs (the two
      # jobs share much of the Bazel action graph; build-site runs after test).
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-site-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-site-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      # Build the developer docs (Sphinx) so the publish tree can carry them at
      # /docs/ (FUG-104). `bazel run` sets BUILD_WORKSPACE_DIRECTORY to the
      # checkout, so the site lands at $GITHUB_WORKSPACE/docs/site/html.
      - name: Build developer docs
        run: bazel run //docs:build --disk_cache="$HOME/.cache/bazel-disk"

      # Materialize the publish tree into ./_site (bundle at /, wasm bundles at
      # /solver /pulse /fx-compiler /fx-vm, docs at /docs — same layout
      # Cloudflare/the Pi serve).
      - name: Stage site
        # LEDMAPPER_FLASHBUNDLE points stage_site.lib.sh at the downloaded flash
        # bundle so it's staged under /firmware/ (FUG-60); LEDMAPPER_DOCS_SITE
        # points it at the docs built above so they're staged under /docs/.
        id: stage
        env:
          LEDMAPPER_FLASHBUNDLE: ${{ github.workspace }}/_flashbundle/esp32c6_flashbundle.tar
          LEDMAPPER_DOCS_SITE: ${{ github.workspace }}/docs/site/html
        run: |
          bazel run //web:stage_site \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --build_event_json_file="$RUNNER_TEMP/bep-site.json" \
            -- "$GITHUB_WORKSPACE/_site"

      # Report build-event outcomes (captures wasm/site build failures).
      - name: CI report
        if: always()
        uses: ./.github/actions/bep-report
        with:
          bep-file: ${{ runner.temp }}/bep-site.json
          job: build-site
          runner: github:linux
          artifact-name: ci-report-build-site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
          if-no-files-found: error

  # Per-PR staging preview: publish _site under pr-preview/pr-N/ on gh-pages and
  # drop a sticky comment on the PR with the link. Same-repo PRs only (fork PRs
  # get a read-only token and can't push gh-pages — the step just no-ops).
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize gh-pages writes across concurrent pipelines so pushes don't race.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      # pr-preview-action wraps JamesIves/github-pages-deploy-action, which does
      # its git work in $GITHUB_WORKSPACE — so the repo must be checked out first.
      # It MUST precede the artifact download: actions/checkout defaults to
      # clean:true (git clean -ffdx), which would wipe the untracked _site/.
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # PR closed/merged: remove its pr-preview/pr-N/ directory and update the
  # comment. Runs without a build — hence a separate, cheap job.
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      # Needs the repo checked out for the same reason as deploy-preview (the
      # action operates on the git repo in $GITHUB_WORKSPACE). No artifact here.
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  # master merge: publish _site to the gh-pages root (the main site), preserving
  # the pr-preview/ subtree, AND publish the same tree to Cloudflare production.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the "Deploy environment" GitHub Actions
    # environment; a job only sees environment-scoped secrets if it declares
    # the environment here (otherwise secrets.CLOUDFLARE_* resolve to empty and
    # the Cloudflare step below no-ops). GitHub Pages needs no environment.
    environment: Deploy environment
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    # Job-level env so the Cloudflare step's `if:` can test whether the secret
    # is set (a step can't read its own step-level env in `if:`).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Free runner disk before the heavy Nix/Bazel build — see the `test` job
      # above (FUG-76). This job runs the //web:deploy_cloudflare Bazel build.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      # The Cloudflare deploy re-stages the site from source (below), so it needs
      # the same-revision flash bundle to bundle firmware under /firmware/ too.
      - name: Download flash bundle
        uses: actions/download-artifact@v4
        with:
          name: esp32c6-flashbundle
          path: ${{ github.workspace }}/_flashbundle

      # Publish to the gh-pages root. clean-exclude keeps the open PRs' previews
      # (pr-preview/) from being wiped by the root deploy.
      - name: Deploy to GitHub Pages (main site)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/

      # Cloudflare production deploy via the existing //web:deploy_cloudflare
      # target. It shells out to `pnpm dlx wrangler@4`, so node + pnpm need to be
      # on PATH. Same caching rationale as the test/build-site jobs — this is the
      # merge-to-main deploy path, so keeping it warm matters for iteration.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # The //web:deploy_cloudflare build overlaps build-site's action graph, so
      # fall back to the site (then test) disk cache for a warm start.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-deploy-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-deploy-${{ runner.os }}-
            bazel-disk-site-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      # Node 22: package.json pins `packageManager: pnpm@11.8.0`, which
      # pnpm/action-setup honors, and pnpm 11 needs Node >= 22.13 (it imports the
      # `node:sqlite` builtin, absent in Node 20). Node 20 here made the deploy
      # crash with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The Cloudflare deploy re-stages from source, so build the developer docs
      # here too (the GitHub Pages deploy above already carries them via the
      # _site artifact). FUG-104.
      - name: Build developer docs
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bazel run //docs:build --disk_cache="$HOME/.cache/bazel-disk"

      # Skips cleanly (rather than failing this whole job, which also did the
      # GitHub Pages deploy above) until the Cloudflare secrets are configured.
      - name: Deploy to Cloudflare Pages (production)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          LEDMAPPER_FLASHBUNDLE: ${{ github.workspace }}/_flashbundle/esp32c6_flashbundle.tar
          LEDMAPPER_DOCS_SITE: ${{ github.workspace }}/docs/site/html
        run: bazel run //web:deploy_cloudflare --disk_cache="$HOME/.cache/bazel-disk"
