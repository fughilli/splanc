name: Test
on:
  # `closed` is needed so the per-PR Pages preview is torn down when the PR is
  # merged/closed (see the deploy-preview / cleanup-preview jobs). The build
  # jobs below skip that event.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
jobs:
  test:
    # Don't run the (heavy) build on a PR-close event — that only tears down the
    # preview (cleanup-preview job).
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Nix is a system requirement for this repo (see MODULE.bazel): the M4
      # provisioning targets shell out to it and `bazel test //...` realizes
      # nixpkgs-provided build tools (e.g. the HTML minifier). Single-user nix
      # install so the whole /nix store is cacheable below — otherwise every run
      # re-evaluates the pinned nixpkgs snapshot and re-realizes those tools from
      # scratch, which dominated this job's wall-clock.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Share repository cache between workflows.
          repository-cache: true

      # Explicit, restore-key'd Bazel disk cache (compiled action outputs). This
      # replaces setup-bazel's workflow-keyed disk-cache, which only persisted on
      # a successful run and had no graceful fallback when its key rotated. The
      # restore-keys prefix means even a key miss restores the newest prior cache.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-test-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-test-${{ runner.os }}-

      - name: Test
        # `--test_output=errors` (not `streamed`): streamed serializes test
        # execution and suppresses caching of test actions; errors still surfaces
        # failing-test logs.
        run: bazel test --config=ci //... --disk_cache="$HOME/.cache/bazel-disk" --test_output=errors

  # The HITL suite is tags=["manual","hitl"], so it's kept out of the `//...`
  # wildcard above (the on-hardware e2e can't run here; the unit layer just wants
  # its own lane). Collect the `hitl`-tagged *test* targets with a bazel query
  # and run them explicitly — the pure-logic ones (Improv codec / SNTP sync /
  # runner-pool picker) run fine in CI; the on-hardware e2e is a py_binary, so
  # `tests(...)` filters it out and it stays in the manual hitl.yaml workflow.
  hitl-tests:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      # Share the `test` job's /nix cache — same MODULE-keyed toolchains.
      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Own disk-cache namespace, falling back to the `test` job's (shared action
      # graph) for a warm start.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-hitl-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-hitl-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      - name: Run HITL-tagged tests
        run: |
          targets=$(bazel query 'attr(tags, "\bhitl\b", tests(//...))')
          echo "collected HITL tests:"; echo "$targets"
          if [ -z "$targets" ]; then echo "no HITL-tagged tests found"; exit 1; fi
          bazel test --config=ci $targets --disk_cache="$HOME/.cache/bazel-disk" --test_output=errors

  # The ESP32-C6 firmware image is tags=manual (kept out of the `//...` wildcard
  # so the `test` job above — and dev on small containers — stays light: it
  # compiles mbedtls + the Arduino core from source). Build it explicitly here so
  # firmware compile/link breakage is still caught in CI. Needs the same Nix
  # toolchains as the test job.
  firmware:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Single-user nix install so the whole /nix store is cacheable below. This
      # job realizes the ESP32-C6 toolchain + mbedtls + the Arduino core from
      # source — the dominant CI cost — so caching /nix across runs is the win.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-firmware-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Bazel's *disk cache* (compiled action outputs) is the dominant cost: the
      # mbedtls / Arduino-core / firmware cc_library compiles, which setup-bazel
      # wasn't persisting. Cache it explicitly, keyed on the toolchain inputs so
      # the (invariant) mbedtls/core objects stay cached across commits.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-

      - name: Build firmware image (esp32c6)
        run: bazel build --config=ci -c opt --disk_cache="$HOME/.cache/bazel-disk" //firmware/player_app:esp32c6

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # ---------------------------------------------------------------------------
  # Deploy the PWA to GitHub Pages (FUG-26).
  #
  # Hosting model: the gh-pages branch is the Pages source. The main site lives
  # at its root (https://fughilli.github.io/splanc/) and every open PR gets a
  # staging copy under pr-preview/pr-N/. The web bundle is built base-relative
  # (web/vite.config.ts), so the same tree works at both the root and a subpath.
  #
  # Repo setup (one-time): Settings → Pages → "Deploy from a branch" → gh-pages
  # / (root). Cloudflare secrets (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
  # live in the "Deploy environment" GitHub Actions environment — the
  # deploy-production job declares `environment:` so it can read them.
  # ---------------------------------------------------------------------------

  # Build the complete static site tree (app bundle + the solver/pulse/fx-vm/
  # fx-compiler wasm bundles) once, and hand it to the deploy jobs as an
  # artifact — so the (heavy) Bazel/wasm build runs a single time per pipeline.
  # Gated on the tests passing.
  build-site:
    if: github.event.action != 'closed'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Same caching rationale as the `test` job: cache /nix so the pinned
      # nixpkgs snapshot + build tools aren't re-realized every run. This job is
      # on the PR critical path (needs: test) and builds the wasm bundles.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Own disk-cache namespace, with the `test` job's prefix as a fallback
      # restore key so a fresh run starts from test's just-built outputs (the two
      # jobs share much of the Bazel action graph; build-site runs after test).
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-site-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-site-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      # Materialize the publish tree into ./_site (bundle at /, wasm bundles at
      # /solver /pulse /fx-compiler /fx-vm — same layout Cloudflare/the Pi serve).
      - name: Stage site
        run: bazel run --config=ci //web:stage_site --disk_cache="$HOME/.cache/bazel-disk" -- "$GITHUB_WORKSPACE/_site"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
          if-no-files-found: error

  # Per-PR staging preview: publish _site under pr-preview/pr-N/ on gh-pages and
  # drop a sticky comment on the PR with the link. Same-repo PRs only (fork PRs
  # get a read-only token and can't push gh-pages — the step just no-ops).
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize gh-pages writes across concurrent pipelines so pushes don't race.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      # pr-preview-action wraps JamesIves/github-pages-deploy-action, which does
      # its git work in $GITHUB_WORKSPACE — so the repo must be checked out first.
      # It MUST precede the artifact download: actions/checkout defaults to
      # clean:true (git clean -ffdx), which would wipe the untracked _site/.
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # PR closed/merged: remove its pr-preview/pr-N/ directory and update the
  # comment. Runs without a build — hence a separate, cheap job.
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      # Needs the repo checked out for the same reason as deploy-preview (the
      # action operates on the git repo in $GITHUB_WORKSPACE). No artifact here.
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  # master merge: publish _site to the gh-pages root (the main site), preserving
  # the pr-preview/ subtree, AND publish the same tree to Cloudflare production.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the "Deploy environment" GitHub Actions
    # environment; a job only sees environment-scoped secrets if it declares
    # the environment here (otherwise secrets.CLOUDFLARE_* resolve to empty and
    # the Cloudflare step below no-ops). GitHub Pages needs no environment.
    environment: Deploy environment
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    # Job-level env so the Cloudflare step's `if:` can test whether the secret
    # is set (a step can't read its own step-level env in `if:`).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      # Publish to the gh-pages root. clean-exclude keeps the open PRs' previews
      # (pr-preview/) from being wiped by the root deploy.
      - name: Deploy to GitHub Pages (main site)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/

      # Cloudflare production deploy via the existing //web:deploy_cloudflare
      # target. It shells out to `pnpm dlx wrangler@4`, so node + pnpm need to be
      # on PATH. Same caching rationale as the test/build-site jobs — this is the
      # merge-to-main deploy path, so keeping it warm matters for iteration.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-test-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-test-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-test-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # The //web:deploy_cloudflare build overlaps build-site's action graph, so
      # fall back to the site (then test) disk cache for a warm start.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-deploy-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-deploy-${{ runner.os }}-
            bazel-disk-site-${{ runner.os }}-
            bazel-disk-test-${{ runner.os }}-

      # Node 22: package.json pins `packageManager: pnpm@11.8.0`, which
      # pnpm/action-setup honors, and pnpm 11 needs Node >= 22.13 (it imports the
      # `node:sqlite` builtin, absent in Node 20). Node 20 here made the deploy
      # crash with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Skips cleanly (rather than failing this whole job, which also did the
      # GitHub Pages deploy above) until the Cloudflare secrets are configured.
      - name: Deploy to Cloudflare Pages (production)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bazel run --config=ci //web:deploy_cloudflare --disk_cache="$HOME/.cache/bazel-disk"
