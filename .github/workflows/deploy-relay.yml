# Deploy the Splanc cloud relay Worker (agent/relay, docs/design/cloud-relay.md) to
# workers.dev from main. Needs the CLOUDFLARE_API_TOKEN secret to carry
# Account > Workers Scripts > Edit (the Pages deploy only needs Pages > Edit).
name: Deploy cloud relay
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Deploy environment
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Deploy + smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: agent/relay/deploy.sh
