# On-hardware HITL test suite (FUG-33).
#
# Runs on every (same-repo) PR and on demand: it needs a live rig on the tailnet
# and a real ESP32-C6. It joins the tailnet with an ephemeral Tailscale auth key
# and runs the WHOLE //pi/hitl/harness on-hardware suite against the runner pool —
# e2e (flash + improv + time-sync + rename), map_upload (wss sharding), the
# mapping-sequence trigger, the fx benchmark, and rename_wss (the wss cert-restart
# regression). Each reserves a FREE rig from $HITL_SERVERS (the checkout
# mechanism), flashes it, and provisions it over ImprovBLE. Fork PRs are skipped
# (no secret access). The pure-logic units run in the normal `test` workflow
# (bazel test //...); this workflow is the hardware lane.
#
# Config lives in the "HITL" GitHub Actions environment (Settings → Environments
# → HITL). The job declares `environment: HITL` below so these resolve — an
# environment's secrets/vars are invisible to jobs that don't opt in (same
# pattern as the deploy-production job's "Deploy environment" in test.yaml):
#   secrets.TS_AUTHKEY       Tailscale auth key (ephemeral + tagged recommended)
#                            so the runner can reach the rigs over the tailnet.
#   vars.HITL_SERVERS        pool of rig base URLs / hostnames, e.g.
#                            "hitl-rig-1, hitl-rig-2" (comma/space separated).
#   secrets.HITL_WIFI_SSID   OPTIONAL override of the network the DUT is
#   secrets.HITL_WIFI_PASS   provisioned onto. Unset by default: the DUT is
#                            provisioned onto the rig's OWN AP (creds served by
#                            the daemon), so no external WiFi is needed.
name: HITL tests
on:
  # Runs on PRs (full flash + improv + ws against a real rig) and on demand. The
  # job below is guarded to same-repo events only — fork PRs can't read the HITL
  # environment's secrets, and the tailnet join would fail.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      server:
        description: 'Target a specific rig base URL (else pick a free one from HITL_SERVERS)'
        required: false
        default: ''
# Run HITL in parallel across PRs (FUG-102). The fleet opens many PRs at once,
# and there are enough runners + Actions minutes to service them, so don't gate
# HITL runs against each other at the CI layer. Bench contention is resolved a
# layer down: each target `hitl reserve`s a FREE DUT from the pool
# ($HITL_SERVERS), and the managerd FIFO queue (with heartbeat-lease reaping)
# makes any surplus runs wait their turn instead of colliding on the bench.
#
# A single global `group: hitl-tests` (the old value) instead serialized every
# run to one at a time AND — because cancel-in-progress:false keeps only the
# newest pending run per group — silently canceled the HITL check on
# intermediate PRs whenever several queued at once. Scope the group to the
# PR/ref so different PRs run concurrently; a new push to the SAME PR supersedes
# its own in-flight run (the abandoned reservation's lease expires and managerd
# reclaims the rig) rather than spending a bench slot on a stale commit.
concurrency:
  group: hitl-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hitl_tests:
    # Skip on fork PRs (no access to the HITL environment secrets / tailnet).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Opt into the "HITL" environment so its TS_AUTHKEY secret + HITL_SERVERS
    # variable (and the HITL_WIFI_* secrets, if set) are visible to this job.
    environment: HITL
    env:
      HITL_SERVERS: ${{ vars.HITL_SERVERS }}
      HITL_WIFI_SSID: ${{ secrets.HITL_WIFI_SSID }}
      HITL_WIFI_PASS: ${{ secrets.HITL_WIFI_PASS }}
      # `server` input only exists on workflow_dispatch; empty on pull_request.
      SERVER: ${{ github.event.inputs.server }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Free ~20-30GB of runner disk before the heavy Nix/Bazel build (FUG-76):
      # ubuntu-latest gives only ~14GB free on /, but the flash-bundle build pulls
      # in the esp32c6 image (mbedtls + Arduino core from source) which — with the
      # /nix store + Bazel disk cache — exhausts it. Deletes the ~25GB of unused
      # preinstalled SDKs (Android, .NET, GHC, …) in place; caches under ~/.cache
      # are untouched. Same step as the test.yaml jobs.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      # Reach the rigs over the tailnet. Ephemeral so the node self-reaps after
      # the run; the rigs only accept tailnet peers (DESIGN.md "Security").
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      # Same Nix + Bazel toolchain and caching as the firmware job — the
      # flash-bundle pulls in the esp32c6 image (mbedtls + Arduino core from
      # source), the dominant cost, so we reuse the firmware disk-cache namespace.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-

      # Discover the on-hardware suite the same way the unit lane once did — query
      # the `hitl` tag over tests(//...) — and `bazel test` the set. The targets
      # are py_tests tagged ["manual","hitl"] (//pi/hitl/harness), each of which
      # reserves a free rig from the pool, flashes it (the flash-bundle rides in
      # its runfiles), ImprovBLE-provisions onto the rig's own AP (HITL_WIFI_* only
      # overrides it), and exercises its slice over the player WebSocket.
      #   - We fire the whole set off in parallel and let the bench sort out
      #     contention: each target `hitl reserve`s a free DUT, and managerd's FIFO
      #     queue makes any surplus runs wait their turn instead of colliding (see
      #     the top-of-file note). Bazel caps concurrent tests at min(--jobs,
      #     --local_test_jobs), so we raise BOTH to the target count — the repo-wide
      #     `--jobs=3` (.bazelrc, a dev-container memory guard) would otherwise pin
      #     us to 3 and leave most of the bench idle. Surplus test jobs just block
      #     in `hitl reserve` (I/O-bound, not CPU), and the flash-bundle compile is
      #     a disk-cache hit from the `firmware` job, so the higher --jobs doesn't
      #     add real compile pressure here.
      #     --test_output=streamed can't be used here — it implies
      #     --test_strategy=exclusive, which pins Bazel to one test at a time — so
      #     we use --test_output=all, which surfaces each target's full log once
      #     it finishes.
      #   - Tests get a hermetic env, so forward the HITL knobs with --test_env;
      #     --test_arg passes a pinned --server (all targets accept it) through.
      #   - timeout=eternal on the targets covers the multi-minute flash+provision.
      # -c opt so the firmware build matches the firmware CI job.
      - name: Discover and run the HITL test suite
        # FUG-84: serialize Bazel's repository-rule evaluation for this build.
        # The flash-bundle realizes several Nix-provided toolchains (ESP32-C6 +
        # Arduino core) through rules_nixpkgs *repository rules*, each of which
        # shells out to `nix build`. CI installs Nix single-user (see "Install
        # Nix" above — nix-quick-install-action, no daemon), so nothing
        # serializes writes to the store's SQLite DB. Bazel 7's default async
        # repo fetching (--experimental_worker_for_repo_fetching=auto) runs those
        # repo rules concurrently, so multiple `nix build`s write
        # /nix/var/nix/db/db.sqlite at once and one loses the lock:
        #   error: SQLite database '/nix/var/nix/db/db.sqlite' is busy
        # `=off` makes each fetch block its Skyframe thread, and
        # --loading_phase_threads=1 pins that pool to one thread, so the Nix
        # toolchains realize one at a time — a single writer, no contention. That
        # serializes only the (fast, no-compile) loading/fetch phase, independent
        # of --jobs; the execution phase (compile + tests) still runs in parallel
        # at the --jobs we raise below.
        run: |
          targets=$(bazel query 'attr(tags, "\bhitl\b", tests(//...))')
          echo "collected HITL tests:"; echo "$targets"
          if [ -z "$targets" ]; then echo "no HITL-tagged tests found"; exit 1; fi
          ntargets=$(echo "$targets" | wc -w)
          echo "running $ntargets HITL tests in parallel (queued on the bench)"
          server_arg=()
          if [ -n "$SERVER" ]; then server_arg=("--test_arg=--server=$SERVER"); fi
          bazel test $targets \
            -c opt \
            --experimental_worker_for_repo_fetching=off \
            --loading_phase_threads=1 \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --test_output=all \
            --jobs="$ntargets" \
            --local_test_jobs="$ntargets" \
            --test_env=HITL_SERVERS \
            --test_env=HITL_WIFI_SSID \
            --test_env=HITL_WIFI_PASS \
            --test_env=HITL_OWNER \
            "${server_arg[@]}"
