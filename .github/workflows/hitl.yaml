# On-hardware HITL test suite (FUG-33).
#
# Runs on same-repo PRs that carry the `hitl` label, post-merge on main, and on
# demand (see "When HITL runs" below): it needs a live rig on the tailnet
# and a real ESP32-C6. It joins the tailnet with an ephemeral Tailscale auth key
# and runs the WHOLE //pi/hitl/harness on-hardware suite against the runner pool —
# e2e (flash + improv + time-sync + rename), map_upload (wss sharding), the
# mapping-sequence trigger, the fx benchmark, and rename_wss (the wss cert-restart
# regression). Each reserves a FREE rig from $HITL_SERVERS (the checkout
# mechanism), flashes it, and provisions it over ImprovBLE. Fork PRs are skipped
# (no secret access). The pure-logic units run in the normal `test` workflow
# (bazel test //...); this workflow is the hardware lane.
#
# Config lives in the "HITL" GitHub Actions environment (Settings → Environments
# → HITL). The job declares `environment: HITL` below so these resolve — an
# environment's secrets/vars are invisible to jobs that don't opt in (same
# pattern as the deploy-production job's "Deploy environment" in test.yaml):
#   secrets.TS_AUTHKEY       Tailscale auth key (ephemeral + tagged recommended)
#                            so the runner can reach the rigs over the tailnet.
#   vars.HITL_SERVERS        pool of rig base URLs / hostnames, e.g.
#                            "hitl-rig-1, hitl-rig-2" (comma/space separated).
#   secrets.HITL_WIFI_SSID   OPTIONAL override of the network the DUT is
#   secrets.HITL_WIFI_PASS   provisioned onto. Unset by default: the DUT is
#                            provisioned onto the rig's OWN AP (creds served by
#                            the daemon), so no external WiFi is needed.
#
# When HITL runs. The rigs are a scarce shared bench (queues ran 70+ deep when every
# PR push ran the full suite), so on pull_request it runs ONLY for a PR labelled
# `hitl` — in practice the merge-queue head: the queue runner adds the label when a
# PR reaches the head (unless it's queued `nohitl`), and the PR's full HITL then runs
# at the commit that is about to merge. Adding the label (`labeled`) starts a run;
# later pushes to a labelled PR re-run it. An unlabelled PR gets a skipped
# hitl_tests plus a ~5 s "HITL not requested" marker check — not a pass, just
# "nobody asked"; add the `hitl` label to request a run. push to main and workflow_dispatch
# (the Mac's 6h periodic + manual runs) always run the full suite. hitl_tests is not
# a required status check (main has no branch protection), so the skip never blocks
# a merge by itself; the merge queue enforces HITL-green for non-`nohitl` PRs.
#
# What fails the job (pi/hitl/ci/README.md). An infra outcome — the reservation never
# activated (deadline, stalled queue, unhealthy rig), no rig had a matching unit, the rig's ssh/tunnel failed, the test was
# killed while still queued — is not a test failure: such a test is re-queued once and
# then SKIPPED with a warning. A test in pi/hitl/ci/quarantine.toml runs and reports
# but doesn't gate. Every other failure gates.
name: HITL tests
on:
  # Runs on `hitl`-labelled PRs (full flash + improv + ws against a real rig),
  # post-merge on main, and on demand. The job below is guarded to same-repo events
  # only — fork PRs can't read the HITL environment's secrets, and the tailnet join
  # would fail. `labeled` so adding the `hitl` label starts a run.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Post-merge run against main so there's an authoritative "latest HITL run
  # against main" (FUG-129): the README's HITL badge pins to
  # ?branch=main&event=push, so it reflects THIS run — not whatever PR branch
  # happened to run last. Also feeds the post-merge result into the Grafana CI
  # metrics. Contention with in-flight PR runs is resolved a layer down by the
  # managerd FIFO rig queue (see the concurrency note below).
  push:
    branches:
      - main
  # GitHub's native merge queue: each merge group runs the suite at the exact commit
  # that will land. Harmless until the merge queue is enabled (no event fires).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      server:
        description: 'Target a specific rig base URL (else pick a free one from HITL_SERVERS)'
        required: false
        default: ''
  # NOTE: the periodic "warm the perf-drift dashboards + catch between-merge flakes"
  # run is NO LONGER a GitHub `schedule:` cron — GitHub drops/heavily delays
  # scheduled runs on this repo (last seen 2.7-5.6h late, then skipped entirely). It
  # is driven every 6h (4x/day) by a launchd job on the always-on Mac
  # (pi/hitl/nix/hitl-darwin.nix `hitl-schedule-dispatch`) that POSTs a
  # workflow_dispatch here. fxbench-ingest still picks these runs' logs up into the
  # dashboards; push-ci-metrics reports each run's pass/fail.
# Run HITL in parallel across PRs (FUG-102). The fleet opens many PRs at once,
# and there are enough runners + Actions minutes to service them, so don't gate
# HITL runs against each other at the CI layer. Bench contention is resolved a
# layer down: each target `hitl reserve`s a FREE DUT from the pool
# ($HITL_SERVERS), and the managerd FIFO queue (with heartbeat-lease reaping)
# makes any surplus runs wait their turn instead of colliding on the bench.
#
# A single global `group: hitl-tests` (the old value) instead serialized every
# run to one at a time AND — because cancel-in-progress:false keeps only the
# newest pending run per group — silently canceled the HITL check on
# intermediate PRs whenever several queued at once. Scope the group to the
# PR/ref so different PRs run concurrently; a new push to the SAME PR supersedes
# its own in-flight run (the abandoned reservation's lease expires and managerd
# reclaims the rig) rather than spending a bench slot on a stale commit.
concurrency:
  # Periodic/manual dispatch runs (the Mac 6h cron drives these now) get their own
  # group so they never cancel — or get canceled by — an authoritative push/PR run
  # on the same ref.
  #
  # A pull_request event that WON'T run HITL (an unlabelled PR, or an unrelated label
  # added to a labelled one) gets a throwaway per-run group, so its instant skip can
  # never cancel a real in-flight HITL run for the same PR. The condition is the
  # job-level `if` below, repeated (Actions has no shared expressions).
  group: hitl-tests-${{ !(github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'hitl') && (github.event.action != 'labeled' || contains(fromJSON('["hitl", "hitl-android", "hitl-ios"]'), github.event.label.name)))) && format('noop-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && 'scheduled' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hitl_tests:
    # push (post-merge on main) and workflow_dispatch (the Mac 6h periodic run +
    # manual runs) only fire on this repo, so they always run. A pull_request runs
    # only for a same-repo PR (fork PRs have no access to the HITL environment
    # secrets / tailnet) labelled `hitl`; on a `labeled` event only when the label
    # added is `hitl` (or the hitl-android/-ios lane opt-ins, which re-run the suite
    # with those lanes on), so tagging an unrelated label doesn't re-run the bench.
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'hitl') && (github.event.action != 'labeled' || contains(fromJSON('["hitl", "hitl-android", "hitl-ios"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    # The hard ceiling for the whole run (GitHub's maximum). Reservation waits are
    # progress-driven (see HITL_DEADLINE / HITL_HOLD_MAX below), so this — not a fixed
    # per-reservation timeout — is what bounds a run in a burst.
    timeout-minutes: 360
    # Opt into the "HITL" environment so its TS_AUTHKEY secret + HITL_SERVERS
    # variable (and the HITL_WIFI_* secrets, if set) are visible to this job.
    environment: HITL
    env:
      HITL_SERVERS: ${{ vars.HITL_SERVERS }}
      HITL_WIFI_SSID: ${{ secrets.HITL_WIFI_SSID }}
      HITL_WIFI_PASS: ${{ secrets.HITL_WIFI_PASS }}
      # Screen-lock PIN of the amd-rig bench phone, injected into the in-env phone_e2e
      # run so the Android journeys can unlock it unattended (phone_target._unlock_argv).
      # Set in the HITL environment (Settings → Environments → HITL → secrets). Unset =>
      # the Android journeys fall back to swipe-only unlock (correct only if the phone
      # has NO secure lock); see pi/hitl/phone/README.md "Automated CI reps".
      HITL_ANDROID_PIN: ${{ secrets.HITL_ANDROID_PIN }}
      # Pin for the Android phone bench daemon (amd-rig's SECOND hitl-reserved instance,
      # :8088 — tailnet discovery only reaches :8087). Overridable via the HITL env var
      # if the host/port ever changes; the android_journeys test defaults to it.
      HITL_ANDROID_SERVER: ${{ vars.HITL_ANDROID_SERVER || 'http://amd-rig:8088' }}
      # Every reservation captures its DUT's serial console for the whole test
      # (hitl_client + serial_capture) and saves it here; uploaded below as the
      # hitl-serial-logs artifact. A failing attempt also prints the log's tail inline.
      HITL_SERIAL_LOG_DIR: ${{ github.workspace }}/hitl-serial-logs
      # The Mac mini iOS bench daemon (the `ios-phone` unit: real iPhone + c6-c) and the
      # journeys its rep runs. Overridable via HITL environment vars; see
      # //pi/hitl/phone:ios_journeys.
      HITL_IOS_SERVER: ${{ vars.HITL_IOS_SERVER || 'http://mac-mini:8087' }}
      HITL_IOS_JOURNEYS: ${{ vars.HITL_IOS_JOURNEYS || 'smoke' }}
      HITL_IOS_BLE_MODE: ${{ vars.HITL_IOS_BLE_MODE || 'virtual' }}
      HITL_IOS_FLASH_C6: ${{ vars.HITL_IOS_FLASH_C6 || '' }}
      # `server` input only exists on workflow_dispatch; empty on pull_request.
      SERVER: ${{ github.event.inputs.server }}
      # Reservation scheduling class on the rigs (hitl-reserve priority classes;
      # reservations QUEUE and never preempt — a class only reorders the queue).
      # merge-critical = the merge queue's merge_group runs and the post-merge run on
      # main; everything else CI (labelled PRs, the Mac's periodic dispatch) = pr-ci.
      # Humans/agents outside CI default to dev. Older rig daemons ignore it (FIFO).
      HITL_PRIORITY: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && 'merge-queue' || 'pr-ci' }}
      # Max time ONE test may HOLD a unit once active (the harness SIGTERMs itself and
      # releases). Replaces the old per-test 3600 s Bazel bound on the hold, now that
      # the Bazel timeout is raised to let tests wait in a progressing queue.
      HITL_HOLD_MAX: '3600'
      # Minutes after the suite starts by which a test must have gotten its unit
      # (HITL_DEADLINE below); leaves the rest of the 360 min job for the body.
      HITL_QUEUE_BUDGET_MIN: '240'
      # Optional Grafana Cloud Loki push of the run's pass/fail (FUG-117). Unset
      # in the HITL environment = the push step no-ops; see
      # pi/hitl/observability/README.md ("Reporting from GitHub").
      GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
      GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
      GRAFANA_CLOUD_LOKI_KEY: ${{ secrets.GRAFANA_CLOUD_LOKI_KEY }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Decide whether this run exercises the Android phone-HITL journeys
      # (//pi/hitl/phone:android_journeys, the `hitl_android`-tagged lane). There is
      # exactly ONE Android unit (amd-rig's `android-phone`), so running it on every PR
      # would bottleneck the whole fleet behind it. Policy:
      #   * workflow_dispatch (the Mac 6h cron + manual) → ALWAYS run — this is where the
      #     regular Android reps come from.
      #   * pull_request / push → OPT-IN only, when the change plausibly affects the
      #     phone/BLE/Android path. Opt in three ways (any one triggers it):
      #       - add the `hitl-android` LABEL to the PR, OR
      #       - put a `[hitl-android]` tag in the PR body or the head commit message, OR
      #       - touch an Android-affecting path (auto; globs below).
      # CONVENTION: if you judge your change may have impacted the phone / BLE / Improv /
      # netstack-BLE / Capacitor path and the path globs wouldn't catch it, REQUEST a run
      # by adding the `hitl-android` label (or the `[hitl-android]` tag). See
      # pi/hitl/phone/README.md "Automated CI reps".
      - name: Decide whether to run the Android journeys
        id: android_gate
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass attacker-influenceable text through the environment (NOT interpolated
          # into the script), so a crafted PR body / commit message / label can't break
          # the shell quoting or inject commands.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true
          else
            # 1) opt-in label on the PR
            if printf '%s' "$PR_LABELS" | grep -q '"hitl-android"'; then run=true; fi
            # 2) [hitl-android] tag in the PR body or the head commit message
            if printf '%s\n%s' "$PR_BODY" "$COMMIT_MSG" | grep -qiF '[hitl-android]'; then
              run=true
            fi
            # 3) path filter — did the change touch Android-affecting code? Use the API
            #    (no full git history needed on the shallow checkout).
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                -q '.[].filename' 2>/dev/null || true)
            else
              files=$(gh api \
                "repos/${{ github.repository }}/compare/${{ github.event.merge_group.base_sha || github.event.before }}...${{ github.sha }}" \
                -q '.files[].filename' 2>/dev/null || true)
            fi
            if printf '%s\n' "$files" | grep -Eq \
              '^(pi/hitl/phone/|pi/hitl/reserve/catalog-phone\.json|pi/hitl/nix/hitl-(phone-daemon|amd-ap)\.nix|firmware/player_app/|firmware/netstack/|firmware/blehost/|web/src/net/|web/src/driver/|web/src/ui/screens/(deviceSheet|addDevice)\.ts)'; then
              run=true
            fi
          fi
          echo "run_android=$run" >> "$GITHUB_OUTPUT"
          echo "Android phone-HITL journeys will run this execution: $run"

      # Same policy for the iOS phone-HITL journeys (//pi/hitl/phone:ios_journeys, the
      # `hitl_ios`-tagged lane on the Mac mini's single `ios-phone` unit): ALWAYS on the
      # periodic workflow_dispatch runs; opt-in on PR/push via the `hitl-ios` LABEL, a
      # `[hitl-ios]` tag in the PR body / head commit message, or an iOS-affecting path.
      - name: Decide whether to run the iOS journeys
        id: ios_gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true
          else
            if printf '%s' "$PR_LABELS" | grep -q '"hitl-ios"'; then run=true; fi
            if printf '%s\n%s' "$PR_BODY" "$COMMIT_MSG" | grep -qiF '[hitl-ios]'; then
              run=true
            fi
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                -q '.[].filename' 2>/dev/null || true)
            else
              files=$(gh api \
                "repos/${{ github.repository }}/compare/${{ github.event.merge_group.base_sha || github.event.before }}...${{ github.sha }}" \
                -q '.files[].filename' 2>/dev/null || true)
            fi
            if printf '%s\n' "$files" | grep -Eq \
              '^(pi/hitl/phone/(ios_|phone_e2e|phone_target|driver_server|journey_runner|launcher|journeys/)|pi/hitl/reserve/catalog-mac\.json|pi/hitl/nix/hitl-darwin\.nix|tools/ios_build_server\.py|web/ios-config/|web/capacitor\.config\.ts|web/native-plugins/|web/src/driver/|web/src/net/capacitorImprov\.ts)'; then
              run=true
            fi
          fi
          echo "run_ios=$run" >> "$GITHUB_OUTPUT"
          echo "iOS phone-HITL journeys will run this execution: $run"

      # Free ~20-30GB of runner disk before the heavy Nix/Bazel build (FUG-76):
      # ubuntu-latest gives only ~14GB free on /, but the flash-bundle build pulls
      # in the esp32c6 image (mbedtls + Arduino core from source) which — with the
      # /nix store + Bazel disk cache — exhausts it. Deletes the ~25GB of unused
      # preinstalled SDKs (Android, .NET, GHC, …) in place; caches under ~/.cache
      # are untouched. Same step as the test.yaml jobs.
      - name: Free runner disk space
        uses: justinthelaw/maximize-github-runner-space@v0.10.0

      # Reach the rigs over the tailnet. Ephemeral so the node self-reaps after
      # the run; the rigs only accept tailnet peers (DESIGN.md "Security").
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      # Same Nix + Bazel toolchain and caching as the firmware job — the
      # flash-bundle pulls in the esp32c6 image (mbedtls + Arduino core from
      # source), the dominant cost, so we reuse the firmware disk-cache namespace.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-disk-${{ runner.os }}-

      # Discover the on-hardware suite the same way the unit lane once did — query
      # the `hitl` tag over tests(//...) — and `bazel test` the set. The targets
      # are py_tests tagged ["manual","hitl"] (//pi/hitl/harness), each of which
      # reserves a free rig from the pool, flashes it (the flash-bundle rides in
      # its runfiles), ImprovBLE-provisions onto the rig's own AP (HITL_WIFI_* only
      # overrides it), and exercises its slice over the player WebSocket.
      #   - We fire the whole set off in parallel (--local_test_jobs sized to the
      #     target count) and let the bench sort out contention: each target
      #     `hitl reserve`s a free DUT, and managerd's FIFO queue makes any
      #     surplus runs wait their turn instead of colliding (see the top-of-file
      #     note). --test_output=streamed can't be used here — it implies
      #     --test_strategy=exclusive, which pins Bazel to one test at a time — so
      #     we use --test_output=all, which surfaces each target's full log once
      #     it finishes.
      #   - Tests get a hermetic env, so forward the HITL knobs with --test_env;
      #     --test_arg passes a pinned --server (all targets accept it) through.
      #   - timeout=eternal on the targets covers the multi-minute flash+provision.
      # -c opt so the firmware build matches the firmware CI job.
      - name: Discover and run the HITL test suite
        id: run_hitl
        # FUG-84: serialize Bazel's repository-rule evaluation for this build.
        # The flash-bundle realizes several Nix-provided toolchains (ESP32-C6 +
        # Arduino core) through rules_nixpkgs *repository rules*, each of which
        # shells out to `nix build`. CI installs Nix single-user (see "Install
        # Nix" above — nix-quick-install-action, no daemon), so nothing
        # serializes writes to the store's SQLite DB. Bazel 7's default async
        # repo fetching (--experimental_worker_for_repo_fetching=auto) runs those
        # repo rules concurrently, so multiple `nix build`s write
        # /nix/var/nix/db/db.sqlite at once and one loses the lock:
        #   error: SQLite database '/nix/var/nix/db/db.sqlite' is busy
        # `=off` makes each fetch block its Skyframe thread, and
        # --loading_phase_threads=1 pins that pool to one thread, so the Nix
        # toolchains realize one at a time — a single writer, no contention. Only
        # the (fast, no-compile) loading/fetch phase is serialized; the firmware
        # *compile* still runs in parallel (execution phase, --jobs=3).
        run: |
          all=$(bazel query 'attr(tags, "\bhitl\b", tests(//...))')
          echo "collected HITL tests:"; echo "$all"
          if [ -z "$all" ]; then echo "no HITL-tagged tests found"; exit 1; fi
          # Every HITL-tagged test GATES CI and they run together in ONE pass — no
          # name-based lane split. (The old netstack-vs-vendor grep split existed only
          # to keep the ALLOW-FAIL vendor lane separate from the gating netstack lane;
          # the vendor firmware + lane and the superseded //firmware/hybrid experiment
          # are gone, so every remaining target gates — and grepping by name just risks
          # silently sweeping up unrelated tests, e.g. hybrid_heap_hitl.) The bench
          # reservation system routes each test to a DUT satisfying its caps/sku, so
          # netstack (any C6) and pi-player (led-mapper-pi) fan out correctly from a
          # single bazel invocation.
          server_arg=()
          if [ -n "$SERVER" ]; then server_arg=("--test_arg=--server=$SERVER"); fi
          run_hitl_set() {  # $1 = newline/space-separated bazel targets
            local t="$1" n
            n=$(echo "$t" | wc -w)
            if [ "$n" -eq 0 ]; then echo "(no targets in this set)"; return 0; fi
            echo "running $n HITL tests in parallel (queued on the bench)"
            # Queue waits are progress-driven, not fixed: hitl_client waits while the
            # rig queue drains and gives up only on a stall / unhealthy rig / the
            # HITL_DEADLINE ceiling. So the per-test (eternal) Bazel timeout is raised
            # from 3600 s to 5 h — the queue wait counts against it — while
            # HITL_HOLD_MAX keeps a hung test from holding a board past an hour.
            # --flaky_test_attempts=3: reservations QUEUE (never preempt) — a test holds
            # its DUT until it releases — but a DUT's own bring-up can still flake per
            # boot (e.g. the netstack WSS/TLS server occasionally not accepting a
            # connection after a good WiFi join, a known firmware wedge), and a fresh
            # flash on the retry usually clears it. Bazel re-runs only FAILED tests, so a
            # real regression still fails all 3 attempts and gates while a transient
            # per-boot wedge recovers. (Every target passes deterministically in isolation.)
            bazel test $t \
              -c opt \
              --experimental_worker_for_repo_fetching=off \
              --loading_phase_threads=1 \
              --disk_cache="$HOME/.cache/bazel-disk" \
              --test_output=all \
              --jobs="$n" \
              --local_test_jobs="$n" \
              --flaky_test_attempts=3 \
              --test_timeout=-1,-1,-1,18000 \
              --test_env=HITL_PRIORITY \
              --test_env=HITL_DEADLINE \
              --test_env=HITL_HOLD_MAX \
              --test_env=HITL_SERVERS \
              --test_env=HITL_WIFI_SSID \
              --test_env=HITL_WIFI_PASS \
              --test_env=HITL_OWNER \
              --test_env=HITL_SERIAL_LOG_DIR \
              --test_env=HITL_EXCLUDE_HOSTS \
              --test_env=GITHUB_SHA \
              --build_event_json_file="$BEP" \
              "${server_arg[@]}"
          }
          # rig-3 is fenced fleet-wide (HITL_EXCLUDE_HOSTS): its Pi 3 onboard AP drops the
          # heapless netstack's protected UNICAST frames, so netstack e2e never gets a
          # SYN-ACK there (broadcast/DHCP works; a pre-existing firmware RX bug, tracked
          # for a focused RX fix). No other HITL test needs rig-3, so excluding it globally
          # is harmless. amd-rig needs no fence: its sole DUT (c6-sdr) is SDR-hardwired with
          # no antenna and marked pin_only, and the harness excludes pin_only units from
          # caps-only requests on both selection paths (_unit_serves + _unit_matches), so
          # _pick_server never routes a netstack reservation there (confirmed live:
          # curl amd-rig:8087/status -> c6-sdr pin_only=true).
          # Each lane records its failure instead of exiting, so one lane failing never
          # hides the others' results (the periodic run reports pool + Android + iOS);
          # the step still fails at the end if any lane failed.
          # The CI job's ceiling for getting a unit: every test (and flaky retry)
          # gives up queueing at this epoch, so a burst can't run the job into its
          # 360 min timeout with nothing reported.
          export HITL_DEADLINE=$(( $(date +%s) + HITL_QUEUE_BUDGET_MIN * 60 ))
          echo "HITL class=$HITL_PRIORITY; reservation deadline $(date -u -d @"$HITL_DEADLINE" +%H:%MZ)"
          rc=0
          # The verdict (pi/hitl/ci/hitl_verdict.py) reads the run's build events and
          # each failing attempt's log: a test whose every failing attempt was infra
          # (reservation never activated, no rig with a matching unit, rig ssh/tunnel
          # failure, killed while still queued) is re-queued ONCE, and if it is still
          # infra it is SKIPPED with a warning instead of failing the job. A test listed
          # in pi/hitl/ci/quarantine.toml runs and reports but never fails the job. Any
          # other failure gates, exactly as before. See pi/hitl/ci/README.md.
          echo "::group::HITL tests (GATING)"
          t="$RUNNER_TEMP"
          echo "$all" | tr ' ' '\n' | sed '/^$/d' > "$t/hitl-targets.txt"
          BEP="$t/hitl-bep-1.json" HITL_EXCLUDE_HOSTS="hitl-rig-3" run_hitl_set "$all" && e1=0 || e1=$?
          verdict_args=(--targets "$t/hitl-targets.txt" --bep "$t/hitl-bep-1.json" --bazel-exit "$e1")
          python3 pi/hitl/ci/hitl_verdict.py "${verdict_args[@]}" \
            --requeue-out "$t/hitl-requeue.txt" > /dev/null || true
          # (Not past HITL_DEADLINE: a re-queued test would give up at once.)
          if [ -s "$t/hitl-requeue.txt" ] && [ "$(date +%s)" -lt "$HITL_DEADLINE" ]; then
            echo "re-queueing the infra-only failures once:"; cat "$t/hitl-requeue.txt"
            BEP="$t/hitl-bep-2.json" HITL_EXCLUDE_HOSTS="hitl-rig-3" \
              run_hitl_set "$(cat "$t/hitl-requeue.txt")" && e2=0 || e2=$?
            verdict_args+=(--bep "$t/hitl-bep-2.json" --bazel-exit "$e2")
          fi
          echo "::endgroup::"
          python3 pi/hitl/ci/hitl_verdict.py "${verdict_args[@]}" \
            --json-out "$t/hitl-verdict.json" --summary "$GITHUB_STEP_SUMMARY" || rc=1

          # The Android phone-HITL journeys (amd-rig's `android-phone` unit, the :8088
          # phone daemon). Separate from the pool run above: it reserves ONE named unit
          # on a PINNED server (HITL_ANDROID_SERVER) — NOT the $HITL_SERVERS pool, and
          # NOT via the `--server` dispatch input — so we do NOT forward server_arg here.
          # Gated by the android_gate step (scheduled → always; PR/push → opt-in). The
          # `hitl_android` tag (underscore) is deliberately NOT matched by the `\bhitl\b`
          # query above, so this never rides along on an ordinary PR.
          if [ "${{ steps.android_gate.outputs.run_android }}" = "true" ]; then
            echo "::group::Android phone-HITL journeys (amd-rig :8088, GATING when run)"
            android=$(bazel query 'attr(tags, "hitl_android", tests(//...))')
            echo "collected Android tests:"; echo "$android"
            if [ -z "$android" ]; then echo "no hitl_android-tagged tests found"; exit 1; fi
            na=$(echo "$android" | wc -w)
            # --flaky_test_attempts=2: one re-flash/re-provision retry absorbs a per-boot
            #   wedge or a transient BLE-chooser / WiFi-join hiccup; a real regression
            #   still fails both attempts and gates.
            bazel test $android \
              -c opt \
              --experimental_worker_for_repo_fetching=off \
              --loading_phase_threads=1 \
              --disk_cache="$HOME/.cache/bazel-disk" \
              --test_output=all \
              --jobs="$na" \
              --local_test_jobs="$na" \
              --flaky_test_attempts=2 \
              --test_env=HITL_ANDROID_SERVER \
              --test_env=HITL_ANDROID_PIN \
              --test_env=HITL_PRIORITY \
              --test_env=HITL_OWNER \
              --test_env=HITL_SERIAL_LOG_DIR \
              --test_env=GITHUB_SHA || rc=1
            echo "::endgroup::"
          else
            echo "Android phone-HITL journeys skipped this run (see the android_gate step)."
          fi

          # The iOS phone-HITL journeys (the Mac mini's `ios-phone` unit). Like Android:
          # one named unit on a PINNED server (HITL_IOS_SERVER), gated by ios_gate, and
          # tagged `hitl_ios` so the `\bhitl\b` pool query above never collects it.
          if [ "${{ steps.ios_gate.outputs.run_ios }}" = "true" ]; then
            echo "::group::iOS phone-HITL journeys (mac-mini :8087, GATING when run)"
            ios=$(bazel query 'attr(tags, "hitl_ios", tests(//...))')
            echo "collected iOS tests:"; echo "$ios"
            if [ -z "$ios" ]; then echo "no hitl_ios-tagged tests found"; exit 1; fi
            ni=$(echo "$ios" | wc -w)
            # --flaky_test_attempts=2: one retry absorbs a transient sign/install/launch
            #   or reservation hiccup; a real regression fails both attempts and gates.
            bazel test $ios \
              -c opt \
              --experimental_worker_for_repo_fetching=off \
              --loading_phase_threads=1 \
              --disk_cache="$HOME/.cache/bazel-disk" \
              --test_output=all \
              --jobs="$ni" \
              --local_test_jobs="$ni" \
              --flaky_test_attempts=2 \
              --test_env=HITL_IOS_SERVER \
              --test_env=HITL_IOS_JOURNEYS \
              --test_env=HITL_IOS_BLE_MODE \
              --test_env=HITL_IOS_FLASH_C6 \
              --test_env=HITL_PRIORITY \
              --test_env=HITL_OWNER \
              --test_env=HITL_SERIAL_LOG_DIR \
              --test_env=GITHUB_SHA || rc=1
            echo "::endgroup::"
          else
            echo "iOS phone-HITL journeys skipped this run (see the ios_gate step)."
          fi
          exit $rc

      # The raw JUnit evidence (each test's final attempt, test.xml only) for the
      # published combined report (traceability-site.yaml). Resolved here, once:
      # the HITL tests ran with -c opt, and the `bazel run` of the report below
      # builds in the default configuration, which repoints bazel-testlogs at
      # that configuration's (empty) testlogs.
      - name: Collect HITL JUnit evidence
        if: always()
        run: |
          testlogs="$(readlink -f bazel-testlogs || true)"
          if [ -z "$testlogs" ] || [ ! -d "$testlogs" ]; then
            echo "::warning::no bazel-testlogs: the HITL suite did not run"
            exit 0
          fi
          echo "HITL_TESTLOGS=$testlogs" >> "$GITHUB_ENV"
          cd "$testlogs"
          find . -name test.xml -exec install -D -m 0644 {} "$GITHUB_WORKSPACE/hitl-traceability-evidence/{}" \;
          echo "collected $(find "$GITHUB_WORKSPACE/hitl-traceability-evidence" -name test.xml 2>/dev/null | wc -l) test.xml from $testlogs"

      - name: Upload the HITL verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-verdict
          path: ${{ runner.temp }}/hitl-verdict.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload DUT serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-serial-logs
          path: hitl-serial-logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload HITL JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-traceability-evidence
          path: hitl-traceability-evidence
          retention-days: 14
          if-no-files-found: warn

      # Requirements traceability of the on-hardware run (FUG-89): the HITL
      # harness records each phase as a JUnit case tagged with the PRs it verifies
      # (level hitl) and stamped with the firmware bundle + DUT commit
      # (GITHUB_SHA, forwarded above). Only each test's final attempt counts here
      # (`**/test.xml`): a --flaky_test_attempts retry that passed is what gated.
      # The software-suite report comes from test.yaml's traceability-report job.
      - name: HITL traceability report
        if: always() && env.HITL_TESTLOGS != ''
        run: |
          bazel run @rules_requirements//python:rr \
            --disk_cache="$HOME/.cache/bazel-disk" -- report \
            --model "$GITHUB_WORKSPACE/requirements" \
            --evidence "$HITL_TESTLOGS/**/test.xml" \
            --current-build dut_git_sha="$GITHUB_SHA" \
            --title "splanc HITL traceability" \
            --queue-out "$GITHUB_WORKSPACE/hitl-traceability-queue.json" \
            --json "$GITHUB_WORKSPACE/hitl-traceability-report.json" \
            --md "$GITHUB_WORKSPACE/hitl-traceability-report.md" \
            --html "$GITHUB_WORKSPACE/hitl-traceability-report.html"
          cat "$GITHUB_WORKSPACE/hitl-traceability-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HITL traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitl-traceability-report
          path: |
            hitl-traceability-report.html
            hitl-traceability-report.json
            hitl-traceability-report.md
            hitl-traceability-queue.json
          retention-days: 14
          if-no-files-found: warn

      # Report the run's pass/fail to Grafana Cloud (optional; no-op without the
      # GRAFANA_CLOUD_LOKI_* secrets). always() so a failed suite is reported too.
      - name: Report result to Grafana
        if: always()
        run: |
          result=pass
          [ "${{ steps.run_hitl.outcome }}" = "success" ] || result=fail
          pi/hitl/observability/push-ci-metrics.sh \
            --result "$result" \
            --job hitl-suite \
            --pr "${{ github.event.pull_request.number }}" \
            --commit "${{ github.sha }}"

  # (Kept AFTER hitl_tests: test_ci_orchestration parses the first job's steps.)
  # An unlabelled PR's marker: a ~5 s job whose check is named "HITL not requested",
  # so the PR's checks say plainly that HITL was skipped because nobody asked (the
  # hitl_tests job itself just shows "skipped" — GitHub doesn't evaluate a skipped
  # job's name). It is NOT a HITL result; the merge queue ignores it.
  hitl_not_requested:
    name: HITL not requested
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'hitl')
    runs-on: ubuntu-latest
    steps:
      - name: HITL not requested
        run: |
          msg="HITL not requested: this PR has no 'hitl' label, so the on-hardware suite was skipped. Add the 'hitl' label to run it (the merge queue does this when the PR reaches the head)."
          echo "::notice title=HITL not requested::$msg"
          echo "### HITL not requested" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
