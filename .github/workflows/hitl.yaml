# On-hardware HITL end-to-end test (FUG-33).
#
# Runs on every (same-repo) PR and on demand: it needs a live rig on the tailnet
# and a real ESP32-C6. It joins the tailnet with an ephemeral Tailscale auth key,
# builds the firmware flash-bundle, and runs //pi/hitl/harness:e2e against the
# runner pool — reserving a FREE rig from $HITL_SERVERS (the checkout mechanism),
# flashing it, provisioning it onto WiFi over ImprovBLE, then checking time-sync
# + rename over the player WebSocket. Fork PRs are skipped (no secret access).
#
# Config lives in the "HITL" GitHub Actions environment (Settings → Environments
# → HITL). The job declares `environment: HITL` below so these resolve — an
# environment's secrets/vars are invisible to jobs that don't opt in (same
# pattern as the deploy-production job's "Deploy environment" in test.yaml):
#   secrets.TS_AUTHKEY       Tailscale auth key (ephemeral + tagged recommended)
#                            so the runner can reach the rigs over the tailnet.
#   vars.HITL_SERVERS        pool of rig base URLs / hostnames, e.g.
#                            "hitl-rig-1, hitl-rig-2" (comma/space separated).
#   secrets.HITL_WIFI_SSID   OPTIONAL override of the network the DUT is
#   secrets.HITL_WIFI_PASS   provisioned onto. Unset by default: the DUT is
#                            provisioned onto the rig's OWN AP (creds served by
#                            the daemon), so no external WiFi is needed.
name: HITL e2e
on:
  # Runs on PRs (full flash + improv + ws against a real rig) and on demand. The
  # job below is guarded to same-repo events only — fork PRs can't read the HITL
  # environment's secrets, and the tailnet join would fail.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      server:
        description: 'Target a specific rig base URL (else pick a free one from HITL_SERVERS)'
        required: false
        default: ''
      skip_flash:
        description: 'Skip flashing (test against whatever is already on the board)'
        type: boolean
        default: false
      monitor_seconds:
        description: 'Seconds of serial to capture after flashing'
        required: false
        default: '12'
# One rig, one reservation at a time: serialize HITL runs so concurrent PRs
# queue instead of colliding on the bench.
concurrency:
  group: hitl-e2e
  cancel-in-progress: false
jobs:
  hitl-e2e:
    # Skip on fork PRs (no access to the HITL environment secrets / tailnet).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Opt into the "HITL" environment so its TS_AUTHKEY secret + HITL_SERVERS
    # variable (and the HITL_WIFI_* secrets, if set) are visible to this job.
    environment: HITL
    env:
      HITL_SERVERS: ${{ vars.HITL_SERVERS }}
      HITL_WIFI_SSID: ${{ secrets.HITL_WIFI_SSID }}
      HITL_WIFI_PASS: ${{ secrets.HITL_WIFI_PASS }}
      # Inputs only exist on workflow_dispatch; fall back for pull_request.
      SERVER: ${{ github.event.inputs.server }}
      SKIP_FLASH: ${{ github.event.inputs.skip_flash }}
      MONITOR_SECONDS: ${{ github.event.inputs.monitor_seconds || '12' }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # Same Nix + Bazel toolchain as the firmware job — the flash-bundle pulls
      # in the esp32c6 image (mbedtls + Arduino core from source), the dominant
      # cost, so we share its Nix cache and warm-start off its disk cache.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Cache /nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-firmware-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-firmware-
          gc-max-store-size-linux: 5G

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Own disk-cache namespace. The firmware job (test.yaml) writes the *same*
      # key this job used to (`bazel-disk-<os>-<hash>`), and they run in parallel
      # — whichever saved first won, so this job's extra outputs (the flash-
      # bundle wrapper, the Go `hitl` CLI, the python harness) were dropped and
      # rebuilt every run. Keep our own namespace so those stay warm across HITL
      # runs, and fall back to the firmware namespace's key for a warm mbedtls /
      # Arduino-core start when ours is cold.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-hitl-e2e-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-disk-hitl-e2e-${{ runner.os }}-
            bazel-disk-${{ runner.os }}-

      # Build the whole e2e graph — including the flash-bundle (esp32c6: mbedtls
      # + Arduino core from source), the dominant cost — BEFORE joining the
      # tailnet and reserving a rig. The flash-bundle is a runfiles data dep of
      # the e2e, so building the e2e target builds it too. Doing it here keeps the
      # firmware graph off the reserved-rig critical path: the `bazel run` below
      # is then a warm no-op build, so the bench reservation (serialized across
      # PRs by the concurrency group) covers only the flash + provision + WS
      # checks, not the multi-minute compile. A firmware/compile break also fails
      # fast here, before we touch the tailnet or the bench.
      - name: Build the HITL e2e (incl. flash-bundle)
        run: bazel build --config=ci -c opt --disk_cache="$HOME/.cache/bazel-disk" //pi/hitl/harness:e2e

      # Reach the rigs over the tailnet. Ephemeral so the node self-reaps after
      # the run; the rigs only accept tailnet peers (DESIGN.md "Security"). Joined
      # only now — the build above needs no tailnet, so the node is up just for
      # the reservation window.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      # Reserve a free rig from the pool, flash, ImprovBLE-provision, then check
      # time-sync + rename over the WebSocket. The e2e is already built, so this
      # only reserves + runs (the harness finds the flash-bundle in runfiles — no
      # --bundle needed). The DUT is provisioned onto the rig's own AP by default
      # (HITL_WIFI_* only overrides it); the pool comes from HITL_SERVERS. -c opt
      # so the firmware build matches the firmware CI job.
      - name: Run HITL e2e
        run: |
          args=(--monitor-seconds "$MONITOR_SECONDS")
          if [ -n "$SERVER" ]; then args+=(--server "$SERVER"); fi
          if [ "$SKIP_FLASH" = "true" ]; then args+=(--skip-flash); fi
          bazel run --config=ci -c opt --disk_cache="$HOME/.cache/bazel-disk" //pi/hitl/harness:e2e -- "${args[@]}"
